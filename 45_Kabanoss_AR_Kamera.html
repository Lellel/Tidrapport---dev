<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
  <meta charset="UTF-8">
  <!-- Förhindra zoom och scroll för att få den att bete sig som en native-app -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fält-AR & Kamera #45 (v1.0)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #000; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    
    /* Kameran i bakgrunden */
    #camera-feed {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
    }
    
    /* Mörktoning för att UI ska synas i solljus */
    .hud-overlay {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 10;
      pointer-events: none; /* Släpp igenom touch till knappar */
    }

    .pointer-events-auto { pointer-events: auto; }
    
    /* 3D-effekt för att rutorna ska se ut att ligga plant på asfalten */
    #ar-grid-container {
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      perspective: 800px;
      z-index: 5;
    }

    #ar-grid {
      position: absolute;
      /* Förskjut så att "Ankaret" är i bottenmitten */
      transform-origin: bottom center; 
      transform: translate(-50%, -100%) rotateX(60deg) rotateZ(0deg);
      transition: transform 0.1s ease-out;
      display: flex;
      gap: 2px;
    }

    /* Linje-styling i AR */
    .ar-stall {
      width: 60px;
      height: 120px;
      border-top: 4px solid #fff;
      border-left: 4px solid #fff;
      border-right: 4px solid #fff;
      background: rgba(15, 23, 42, 0.4); /* Subtil mörk bakgrund för kontrast */
      backdrop-filter: blur(2px);
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    
    /* Den gigantiska kameraknappen */
    .shutter-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: white;
      border: 6px solid rgba(255,255,255,0.3);
      background-clip: padding-box;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.9); }
    
    /* Hårkors */
    .crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      z-index: 4;
    }
    .crosshair::before, .crosshair::after {
      content: ''; position: absolute; background: #22c55e;
    }
    .crosshair::before { top: 19px; left: 0; width: 40px; height: 2px; }
    .crosshair::after { top: 0; left: 19px; width: 2px; height: 40px; }
    
    .glass-panel { background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <!-- Levande Kamerabild -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Startskärm för att begära rättigheter av iOS -->
  <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 pointer-events-auto p-6 text-center">
    <div class="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center text-3xl mb-6 shadow-lg shadow-blue-500/50">📸</div>
    <h1 class="text-3xl font-black text-white mb-2">Kamera & Inmätning</h1>
    <p class="text-slate-300 mb-8 max-w-sm">Godkänn åtkomst till kamera och rörelsesensorer för att placera linjerna direkt på asfalten i AR-läge.</p>
    <button onclick="startAR()" class="w-full max-w-xs py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-lg font-black rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.4)]">
      AKTIVERA AR-LÄGE
    </button>
    <a href="prototyper.html" class="mt-6 text-sm font-bold text-slate-500 underline">Avbryt och gå tillbaka</a>
  </div>

  <!-- Huvud-HUD (Visas när AR är igång) -->
  <div id="hud" class="hud-overlay flex flex-col justify-between hidden">
    
    <!-- TOPP: Banderoll & Instruktioner -->
    <div class="p-4 pt-8 pointer-events-auto">
      <div class="glass-panel rounded-2xl p-4 flex flex-col gap-2">
        <div class="flex justify-between items-start">
          <div class="flex items-center gap-2">
            <span class="px-2 py-0.5 bg-rose-500 text-white rounded font-black text-[10px] uppercase tracking-widest animate-pulse">Live</span>
            <span class="text-xs font-bold text-slate-300">MODUL #45 • v1.0</span>
          </div>
          <button onclick="undoLast()" id="undo-btn" class="px-3 py-1.5 bg-slate-800 text-slate-200 rounded-lg text-[10px] font-bold hidden border border-slate-700">
            ↩ Ångra
          </button>
        </div>
        
        <!-- Den stora instruktionen -->
        <h2 id="instruction-title" class="text-xl md:text-2xl font-black text-white uppercase tracking-wide">
          1. Sikta in startpunkten
        </h2>
        <p id="instruction-sub" class="text-sm font-bold text-amber-400">
          Rikta korset mot asfaltskanten där första rutan ska börja.
        </p>
      </div>
    </div>

    <!-- CENTRUM: Hårkors (Visas i Steg 1) -->
    <div id="center-crosshair" class="crosshair"></div>

    <!-- BOTTEN: Interaktion & Sektioner -->
    <div class="p-4 pb-8 pointer-events-auto flex flex-col gap-4">
      
      <!-- Sektionskort (Sparade) -->
      <div id="sections-container" class="flex gap-2 overflow-x-auto pb-2">
        <!-- Dynamiska kort hamnar här -->
      </div>

      <!-- Den Stora Kamera-Utlösaren -->
      <div class="flex justify-center items-center w-full relative mt-4">
        
        <div class="absolute left-0 flex flex-col">
          <span class="text-[10px] font-bold text-slate-400 uppercase mb-1">Aktiv färg</span>
          <div id="active-color-indicator" class="w-8 h-8 rounded-full border-2 border-white shadow-lg bg-amber-400"></div>
        </div>

        <!-- Shutter Button -->
        <div class="flex flex-col items-center">
          <button id="shutter" onclick="triggerAction()" class="shutter-btn flex items-center justify-center">
            <div id="shutter-inner" class="w-14 h-14 bg-white rounded-full"></div>
          </button>
          <span id="shutter-label" class="mt-3 text-xs font-black text-white uppercase tracking-widest bg-black/50 px-3 py-1 rounded-full">Lås Startpunkt</span>
        </div>

        <div class="absolute right-0">
          <button onclick="location.reload()" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-white border border-slate-700">
            ✕
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- AR-Ritningen (Rutorna som ligger på marken) -->
  <div id="ar-grid-container" class="hidden">
    <div id="ar-grid">
      <!-- 12 st rutor renderas här via JS -->
    </div>
  </div>

  <script>
    // System-variabler
    let currentStep = 1; 
    // Steg 1: Sikta in (Korshår)
    // Steg 2: Vinkla (Panorera / Gyro)
    // Steg 3: Sparad (Går tillbaka till 1 för nästa)

    let savedSections = [];
    const sectionColors = [
      { name: 'Sektion A', hex: '#FBBF24', bg: 'bg-amber-400', border: 'border-amber-400' }, // Gul
      { name: 'Sektion B', hex: '#38BDF8', bg: 'bg-sky-400', border: 'border-sky-400' }, // Cyan
      { name: 'Sektion C', hex: '#C084FC', bg: 'bg-purple-400', border: 'border-purple-400' }, // Lila
      { name: 'Sektion D', hex: '#34D399', bg: 'bg-emerald-400', border: 'border-emerald-400' } // Grön
    ];

    let currentRotation = 0;
    
    // Element
    const startScreen = document.getElementById('start-screen');
    const hud = document.getElementById('hud');
    const video = document.getElementById('camera-feed');
    const crosshair = document.getElementById('center-crosshair');
    const arGridContainer = document.getElementById('ar-grid-container');
    const arGrid = document.getElementById('ar-grid');
    const instrTitle = document.getElementById('instruction-title');
    const instrSub = document.getElementById('instruction-sub');
    const shutterLabel = document.getElementById('shutter-label');
    const colorIndicator = document.getElementById('active-color-indicator');
    const sectionsContainer = document.getElementById('sections-container');
    const undoBtn = document.getElementById('undo-btn');

    // 1. Initiera AR (Kamera & Sensorer)
    async function startAR() {
      try {
        // Fråga om Kamera
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" } // Tvingar bakre kameran
        });
        video.srcObject = stream;

        // Fråga om Gyro/Orientering (Krävs på iOS 13+)
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
          } else {
            alert("Rörelsesensor nekades. Du får använda touch för att vinkla.");
          }
        } else {
          // Android eller äldre webbläsare
          window.addEventListener('deviceorientation', handleOrientation);
        }

        // Göm startskärm, visa HUD
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        renderARGrid(); // Skapa rutorna osynligt redo i bakgrunden

      } catch (err) {
        alert("Kunde inte starta kameran. Kontrollera inställningarna. (" + err.message + ")");
      }
    }

    // 2. Hantera Kompass/Gyro för att snurra AR-nätet
    function handleOrientation(event) {
      if (currentStep === 2) {
        // Använder alpha (kompassriktning) eller event.gamma beroende på hur man håller paddan.
        // För detta prototyp-syfte bygger vi en mjuk CSS-rotation baserad på rörelse
        let compass = event.webkitCompassHeading || event.alpha;
        if (compass) {
          // Avjämning och vinkelapplicering för AR-effekten
          currentRotation = compass;
          arGrid.style.transform = `translate(-50%, -100%) rotateX(60deg) rotateZ(${currentRotation}deg)`;
        }
      }
    }

    // 3. Knapptryckning - Stegmotorn
    function triggerAction() {
      // Haptisk feedback (Vibrerar om enheten stöder det)
      if(navigator.vibrate) navigator.vibrate(50);

      const activeColorObj = sectionColors[savedSections.length % sectionColors.length];

      if (currentStep === 1) {
        // STEG 1 -> 2: Ankare satt, nu ska vi vinkla
        currentStep = 2;
        crosshair.classList.add('hidden'); // Göm hårkors
        arGridContainer.classList.remove('hidden'); // Visa AR-rutnätet
        
        // Färgkodar AR-nätets ram efter aktiv sektion
        const stalls = arGrid.querySelectorAll('.ar-stall');
        stalls.forEach(s => s.style.borderColor = activeColorObj.hex);

        instrTitle.innerText = "2. Vrid för rätt vinkel";
        instrSub.innerText = "Snurra paddan/mobilen så att linjen följer asfaltskanten.";
        instrSub.classList.replace('text-amber-400', 'text-sky-400');
        
        shutterLabel.innerText = "Knäpp Fast (Lås)";
        document.getElementById('shutter-inner').classList.add('bg-sky-500');

      } else if (currentStep === 2) {
        // STEG 2 -> 3: Lås sektionen och skapa kortet
        savedSections.push({
          name: activeColorObj.name,
          color: activeColorObj,
          stalls: 12
        });

        // Uppdatera UI
        updateSectionCards();
        undoBtn.classList.remove('hidden');

        // Gå tillbaka till Steg 1 för nästa rad
        currentStep = 1;
        crosshair.classList.remove('hidden');
        arGridContainer.classList.add('hidden'); // Göm den aktiva
        
        // Förbered nästa färg
        const nextColorObj = sectionColors[savedSections.length % sectionColors.length];
        colorIndicator.className = `w-8 h-8 rounded-full border-2 border-white shadow-lg ${nextColorObj.bg}`;

        instrTitle.innerText = "1. Ny sektion: Sikta in";
        instrSub.innerText = `Rikta mot startpunkten för ${nextColorObj.name}.`;
        instrSub.classList.replace('text-sky-400', 'text-amber-400');
        
        shutterLabel.innerText = "Lås Startpunkt";
        document.getElementById('shutter-inner').classList.remove('bg-sky-500');
      }
    }

    // 4. Rendera det visuella 3D-rutnätet
    function renderARGrid() {
      arGrid.innerHTML = '';
      // Skapar en standardrad med 12 rutor
      for(let i=0; i<12; i++) {
        const box = document.createElement('div');
        box.className = 'ar-stall flex items-end justify-center pb-2 text-white/50 font-black text-xs';
        box.innerText = `P${i+1}`;
        arGrid.appendChild(box);
      }
    }

    // 5. Uppdatera Sektionskorten i botten
    function updateSectionCards() {
      sectionsContainer.innerHTML = '';
      savedSections.forEach((sec, idx) => {
        const card = document.createElement('div');
        card.className = `flex-shrink-0 flex items-center gap-2 px-3 py-2 glass-panel border-l-4 rounded-lg shadow-lg`;
        card.style.borderLeftColor = sec.color.hex;
        card.innerHTML = `
          <div class="text-left">
            <div class="text-[10px] font-black text-slate-300 uppercase">${sec.name}</div>
            <div class="text-xs font-bold text-white">${sec.stalls} rutor <span class="text-slate-400 font-normal">| Låst</span></div>
          </div>
        `;
        sectionsContainer.appendChild(card);
      });
    }

    // 6. Ångra-knappen
    function undoLast() {
      if (savedSections.length > 0) {
        savedSections.pop();
        updateSectionCards();
        if (savedSections.length === 0) undoBtn.classList.add('hidden');
        
        // Återställ till Steg 1 för den borttagna sektionen
        currentStep = 1;
        crosshair.classList.remove('hidden');
        arGridContainer.classList.add('hidden');
        const prevColorObj = sectionColors[savedSections.length % sectionColors.length];
        colorIndicator.className = `w-8 h-8 rounded-full border-2 border-white shadow-lg ${prevColorObj.bg}`;
        instrTitle.innerText = "1. Sikta in startpunkten";
        instrSub.innerText = "Rikta korset mot asfaltskanten.";
        instrSub.classList.replace('text-sky-400', 'text-amber-400');
        shutterLabel.innerText = "Lås Startpunkt";
        document.getElementById('shutter-inner').classList.remove('bg-sky-500');
      }
    }
  </script>
</body>
</html>
