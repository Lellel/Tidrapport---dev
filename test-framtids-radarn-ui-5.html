<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPV & Klaryta - Framtidsradarn (v5.5 Smart Helghopp)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ice: { 50: '#f0f9ff', 100: '#e0f2fe', 900: '#0c4a6e', 950: '#082f49' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; transition: background-color 0.5s ease, color 0.5s ease; }
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 32px rgba(34, 211, 238, 0.15); transition: all 0.3s ease; }
        .dark .glass-panel { background: rgba(8, 25, 45, 0.55); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); }

        .orb-kulpase-liten { width: 44px; height: 44px; font-size: 1.25rem; }
        .orb-kulpase-stor { width: 64px; height: 64px; font-size: 2rem; }
        .orb-gantt-liten { width: 32px; height: 32px; font-size: 0.875rem; z-index: 10; }

        .glass-orb { background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 100%); box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), 0 4px 10px rgba(0,0,0,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
        .dark .glass-orb { background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%); box-shadow: inset 0 2px 4px rgba(255,255,255,0.25), 0 6px 12px rgba(0,0,0,0.5); }
        .glass-orb:active { cursor: grabbing; transform: scale(1.05); }
        .sick-orb { filter: grayscale(0.4) opacity(0.9); border: 2px solid #ef4444 !important; box-shadow: 0 0 12px rgba(239, 68, 68, 0.6) !important; }

        .owner-badge { position: absolute; bottom: -2px; right: -4px; font-size: 8px; font-weight: 900; padding: 2px 4px; border-radius: 4px; z-index: 20; border: 1px solid rgba(255,255,255,0.6); pointer-events: none; line-height: 1; color: white; }
        .bg-lpv { background-color: #0284c7; } .bg-klaryta { background-color: #16a34a; } .bg-ue { background-color: #d97706; }

        .gantt-job-card { border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 8px; position: relative; cursor: grab; transition: all 0.2s ease; overflow: hidden; }
        
        /* Jobbkort styling med mönster för helger om de sträcker sig över */
        .gantt-job-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; border-radius: 11px; opacity: 0.15; pointer-events: none; }
        .gantt-job-card.lpv { background: linear-gradient(145deg, rgba(2, 132, 199, 0.7) 0%, rgba(3, 105, 161, 0.9) 100%); border: 1px solid rgba(125, 211, 252, 0.8); }
        .dark .gantt-job-card.lpv { background: linear-gradient(145deg, rgba(2, 105, 164, 0.85) 0%, rgba(7, 89, 133, 0.95) 100%); border: 1px solid rgba(56, 189, 248, 0.5); }
        .gantt-job-card.kla { background: linear-gradient(145deg, rgba(16, 185, 129, 0.7) 0%, rgba(5, 150, 105, 0.9) 100%); border: 1px solid rgba(110, 231, 183, 0.8); }
        .dark .gantt-job-card.kla { background: linear-gradient(145deg, rgba(6, 78, 59, 0.85) 0%, rgba(2, 44, 34, 0.95) 100%); border: 1px solid rgba(16, 185, 129, 0.5); }
        .gantt-job-card-content { position: relative; z-index: 40; display: flex; align-items: center; gap: 4px; width: 100%; justify-content: space-between;}

        .bg-helg { background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(225, 29, 72, 0.05) 10px, rgba(225, 29, 72, 0.05) 20px); }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(14, 165, 233, 0.1); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.5); border-radius: 4px; }
        .modal-backdrop { background: rgba(3, 15, 28, 0.75); backdrop-filter: blur(10px); }
        .chip-checkbox:checked + label { background-color: rgba(217, 119, 6, 0.25); border-color: #d97706; color: #fef3c7; }

        .orb-placeholder { width: 30px; height: 30px; border: 2px dashed rgba(255, 255, 255, 0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(255, 255, 255, 0.7); pointer-events: none; }

        /* HIGHLIGHT-EFFEKTER */
        .timeline-drag-active { background-color: rgba(56, 189, 248, 0.12) !important; outline: 2px dashed #38bdf8 !important; outline-offset: -4px; }
        .job-card-hover { outline: 3px solid #38bdf8 !important; box-shadow: 0 0 16px rgba(56, 189, 248, 0.8) !important; }
        .pool-drag-active { background-color: rgba(217, 119, 6, 0.15) !important; outline: 2px dashed #f59e0b !important; }
        
        .holiday-marker { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background-color: #ef4444; border-top-left-radius: 2px; border-top-right-radius: 2px;}
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-gradient-to-br from-sky-50 to-cyan-100 dark:from-[#030f1c] dark:to-[#082f49] text-slate-800 dark:text-slate-100 overflow-hidden">

    <!-- HEADER -->
    <header class="glass-panel h-16 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-sky-700 dark:text-sky-300 flex items-center gap-2 drop-shadow-md">
                🔭 Framtidsradarn <span class="text-sky-600/70 dark:text-slate-400 font-normal text-xs">(v5.5 - Smart Helghopp & DMT)</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openCreateJobModal()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs transition shadow-lg shadow-emerald-600/30 flex items-center gap-1.5">
                <span>➕</span> Skapa nytt jobb
            </button>
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-full glass-panel flex items-center justify-center text-lg hover:scale-110 transition shadow-lg border border-sky-200 dark:border-sky-800/50" title="Växla Ljust/Mörkt Tema">
                <span id="theme-icon">❄️</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <div class="flex flex-1 overflow-hidden relative">
        <!-- KULPÅSE / RESURSDEPÅ (SLÄPPZON FÖR AVBOKNING) -->
        <aside id="resource-panel" 
               ondragover="allowPoolDrop(event)" 
               ondragleave="leavePoolDrop(event)"
               ondrop="dropOrbToPool(event)"
               class="w-[320px] flex flex-col border-r border-white/30 dark:border-sky-900/40 bg-white/20 dark:bg-slate-900/40 shrink-0 overflow-y-auto p-4 space-y-4 custom-scrollbar transition-all">
            
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold text-sky-800 dark:text-sky-200 uppercase tracking-wider">🎒 Kulpåsen & Resursdepå</h2>
                <span class="text-[9px] text-sky-500/70">Släpp kula här för avbokning</span>
            </div>

            <!-- EGEN PERSONAL -->
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col">
                <h3 class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-3">👥 Personal</h3>
                <div id="pool-personnel" class="flex flex-wrap gap-3 min-h-[40px] mb-3"></div>
                <button onclick="openQuickAddModal('person')" class="w-full py-1.5 border border-dashed border-sky-400/50 dark:border-sky-600 text-sky-700 dark:text-sky-400 text-[10px] font-bold rounded-lg hover:bg-sky-400/10 transition">
                    + Ta in extra handtag (UE)
                </button>
            </div>

            <!-- SJUKANMÄLDA -->
            <div class="glass-panel p-3.5 rounded-2xl !bg-rose-50/50 dark:!bg-rose-950/20 !border-rose-200 dark:!border-rose-900/50">
                <h3 class="text-[11px] font-bold text-rose-600 dark:text-rose-400 uppercase tracking-wider mb-3">🤒 Sjukanmälda</h3>
                <div id="pool-sick" class="flex flex-wrap gap-3 min-h-[30px]"></div>
            </div>

            <!-- MASKINER & UE -->
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col">
                <h3 class="text-[11px] font-bold text-sky-600 dark:text-sky-300 uppercase tracking-wider mb-3">🚜 UE & Maskinpark</h3>
                <div id="pool-machines" class="flex flex-wrap gap-3 min-h-[40px] mb-3"></div>
                <button onclick="openQuickAddModal('machine')" class="w-full py-1.5 border border-dashed border-amber-500/50 dark:border-amber-600 text-amber-600 dark:text-amber-400 text-[10px] font-bold rounded-lg hover:bg-amber-400/10 transition">
                    + Hyr in maskin (UE)
                </button>
            </div>
        </aside>

        <!-- TIMELINE & ORDERBOOK -->
        <main class="flex-1 flex flex-col overflow-y-auto p-5 space-y-5 custom-scrollbar relative z-10">
            <!-- ORDERBOOK -->
            <section class="glass-panel p-4 rounded-2xl">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-bold text-emerald-700 dark:text-emerald-400 uppercase tracking-wider">📬 Ej inplanerade jobb (Orderboken)</h2>
                    <button onclick="openCreateJobModal()" class="text-[10px] text-emerald-600 dark:text-emerald-400 hover:underline font-bold">+ Nytt Jobb</button>
                </div>
                <div id="orderbook-list" class="flex gap-4 overflow-x-auto pb-2 custom-scrollbar"></div>
            </section>

            <!-- GANTT TIMELINE -->
            <section class="glass-panel p-4 rounded-2xl flex-1 flex flex-col min-h-[360px]">
                <h2 class="text-xs font-bold text-sky-700 dark:text-sky-300 uppercase tracking-wider mb-3">📅 Tidsperiod & Schemaläggning</h2>

                <div id="timeline-container" class="border border-white/40 dark:border-sky-900/50 rounded-xl bg-white/20 dark:bg-slate-950/40 flex-1 overflow-auto custom-scrollbar relative backdrop-blur-sm">
                    <div id="timeline-inner" class="flex flex-col min-h-full relative">
                        <div class="h-10 border-b border-white/30 dark:border-sky-900/50 flex items-center bg-white/40 dark:bg-slate-900/70 shrink-0 sticky top-0 z-40 backdrop-blur-md">
                            <div class="w-56 px-4 font-bold text-sky-800 dark:text-slate-300 text-[10px] uppercase tracking-wider shrink-0 sticky left-0 z-50 bg-white/60 dark:bg-slate-900/90 border-r border-white/30 dark:border-sky-900/50 h-full flex items-center">
                                Projekt / Kund
                            </div>
                            <div id="timeline-header-days" class="flex text-center text-xs font-bold h-full items-center"></div>
                        </div>

                        <!-- DROP-ZON FÖR JOBB -->
                        <div id="timeline-drop-area" 
                             class="relative flex-1 transition-all" 
                             ondragover="allowTimelineDrop(event)" 
                             ondragleave="leaveTimelineDrop(event)" 
                             ondrop="dropJobOnTimeline(event)">
                            <div id="timeline-grid-bg" class="absolute inset-0 flex pointer-events-none z-0 min-h-full"></div>
                            <div id="gantt-rows" class="relative z-10 pb-8"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL 1: SKAPA NYTT JOBB -->
    <div id="create-job-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-[200] p-4">
        <!-- Behåll existerande jobbskaparmodal (Koden förkortad för läsbarhet, men den fungerar som tidigare) -->
        <div class="glass-panel !bg-slate-900/95 border border-emerald-500/30 max-w-lg w-full rounded-2xl p-6 shadow-2xl space-y-4">
             <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-emerald-400 flex items-center gap-2"><span>➕</span> Skapa nytt jobb</h3>
                <button onclick="closeCreateJobModal()" class="text-slate-400 hover:text-white transition">✕</button>
            </div>
            <form onsubmit="handleCreateJobSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">Fakturerar</label>
                        <select id="job-billing-company" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="LPV">LPV AB</option><option value="Klaryta">Klaryta AB</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">Kund</label>
                        <select id="job-client-select" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"></select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5">Titel</label>
                    <input type="text" id="job-title" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">Krävd Kompetens</label>
                        <select id="job-required-skill" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100">
                            <option value="">Ingen specifik</option><option value="VVS">💧 VVS</option><option value="Vikplog">❄️ Vikplog</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5">Timmar</label>
                        <input type="number" id="job-hours" min="1" value="16" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100">
                    </div>
                </div>
                <div class="flex justify-end pt-3 border-t border-slate-800">
                    <button type="submit" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">Skapa</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: DMT QUICK ADD UE -->
    <div id="quick-add-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-[200] p-4">
        <!-- DMT Modal UI -->
        <div class="glass-panel !bg-slate-900/95 border border-amber-500/30 max-w-sm w-full rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex justify-between border-b border-slate-800 pb-2">
                <h3 id="qa-title" class="text-sm font-bold text-amber-400">➕ Hyr in Resurs</h3>
                <button onclick="closeQuickAddModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <form onsubmit="handleQuickAddSubmit(event)" class="space-y-3">
                <input type="hidden" id="qa-type" value="person">
                <div><label class="text-[10px] font-bold text-slate-400">Leverantör</label><select id="qa-supplier" class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white"><option>Svevia</option><option>Bravida</option></select></div>
                <div><label id="qa-name-label" class="text-[10px] font-bold text-slate-400">Namn *</label><input type="text" id="qa-name" required class="w-full bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white"></div>
                <div id="qa-skills-area"><label id="qa-skills-label" class="text-[10px] font-bold text-amber-400">Kompetens</label><div id="qa-skills-container" class="flex gap-2"></div></div>
                <button type="submit" class="w-full py-2 bg-amber-600 text-white font-bold rounded text-xs">Lägg i Kulpåsen 🎒</button>
            </form>
        </div>
    </div>

    <script>
        const SWEDISH_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Maj', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'];
        const SWEDISH_DAYS = ['Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör', 'Sön'];
        const START_DATE = new Date(2026, 9, 21); // Vi börjar en onsdag (ex 21 okt 2026) för att kunna testa helghopp direkt
        const TOTAL_DAYS = 35;
        const DAY_WIDTH = 130;

        // Röda dagar att undvika
        const HOLIDAYS = [
            "2026-10-23", // Dummy röd dag för test (Fredag v.1)
            "2026-11-01"  // Alla Helgons Dag
        ];

        let state = {
            clients: [{ name: "Coop Norrköping", billingCompany: "LPV" }, { name: "Svevia Fastighet", billingCompany: "Klaryta" }],
            resources: [
                { id: "Johan", name: "Johan Svensson", type: "person", ownerCompany: "LPV", color: "#0284c7", icon: "👦", skills: "C-Kort" },
                { id: "Sjuk_Lasse", name: "Lasse N", type: "person", ownerCompany: "LPV", color: "#0284c7", icon: "👦", isSick: true },
                { id: "Kramer_37", name: "Kramer 37.8", type: "machine", sizeClass: "stor", ownerCompany: "LPV", color: "#0284c7", icon: "🚜", skills: "Vikplog" }
            ],
            jobs: [
                { id: "j1", client: "Coop Norrköping", billingCompany: "LPV", title: "Långjobb (16h)", status: "unscheduled", hours: 16, assigned: [], requiredSkill: "Vikplog" },
                { id: "j2", client: "Svevia Fastighet", billingCompany: "Klaryta", title: "Kortjobb (8h)", status: "unscheduled", hours: 8, assigned: [], requiredSize: "liten" }
            ]
        };

        // --- KALENDER OCH HELGLOGIK ---
        let timelineDays = []; // Kommer att innehålla objekt för varje kalenderdag { dateObj, isWeekend, isHoliday }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('theme-icon').innerText = document.documentElement.classList.contains('dark') ? '❄️' : '☀️';
        }

        function initUI() {
            buildTimelineData();
            buildTimelineLayout();
            renderKulpase();
            renderOrderbook();
            renderGantt();
            populateClientSelect();
        }

        function populateClientSelect() {
            const sel = document.getElementById('job-client-select');
            if(!sel) return;
            sel.innerHTML = '';
            state.clients.forEach(c => sel.innerHTML += `<option value="${c.name}">${c.name} (${c.billingCompany})</option>`);
        }

        // Steg 1: Bygg data-array för alla dagar
        function buildTimelineData() {
            timelineDays = [];
            for (let i = 0; i < TOTAL_DAYS; i++) {
                let d = new Date(START_DATE);
                d.setDate(d.getDate() + i);
                
                const isoDate = d.toISOString().split('T')[0]; // "YYYY-MM-DD"
                const isWeekend = (d.getDay() === 0 || d.getDay() === 6);
                const isHoliday = HOLIDAYS.includes(isoDate);

                timelineDays.push({
                    dateObj: d,
                    isoDate: isoDate,
                    isWeekend: isWeekend,
                    isHoliday: isHoliday,
                    isWorkingDay: !isWeekend && !isHoliday
                });
            }
        }

        // Steg 2: Rita upp rutnätet
        function buildTimelineLayout() {
            const inner = document.getElementById('timeline-inner');
            inner.style.width = (224 + (TOTAL_DAYS * DAY_WIDTH)) + 'px';

            const headerContainer = document.getElementById('timeline-header-days');
            const gridBg = document.getElementById('timeline-grid-bg');
            
            headerContainer.innerHTML = '';
            gridBg.innerHTML = '<div class="w-56 shrink-0 border-r border-white/20 dark:border-sky-900/30 sticky left-0 z-20 bg-white/30 dark:bg-slate-900/60 backdrop-blur-sm"></div>';

            timelineDays.forEach((day, index) => {
                const dayName = SWEDISH_DAYS[(day.dateObj.getDay() + 6) % 7];
                const dateNum = day.dateObj.getDate();
                const monthName = SWEDISH_MONTHS[day.dateObj.getMonth()];
                
                let bgClass = '';
                let textClass = 'text-sky-700 dark:text-slate-400';
                let holidayMarker = '';

                if (day.isWeekend) {
                    bgClass = 'bg-helg';
                    textClass = 'text-rose-500';
                } else if (day.isHoliday) {
                    bgClass = 'bg-rose-50 dark:bg-rose-950/30';
                    textClass = 'text-rose-600 font-extrabold';
                    holidayMarker = '<div class="holiday-marker" title="Helgdag/Röd dag"></div>';
                }

                headerContainer.innerHTML += `
                    <div class="border-r border-white/30 dark:border-sky-900/50 py-1 h-full flex flex-col justify-center items-center shrink-0 text-xs font-bold ${bgClass} ${textClass} relative" style="width: ${DAY_WIDTH}px;">
                        <span>${dayName} ${dateNum} ${monthName}</span>
                        ${holidayMarker}
                    </div>
                `;
                gridBg.innerHTML += `<div class="border-r border-white/20 dark:border-sky-900/30 shrink-0 ${bgClass}" style="width: ${DAY_WIDTH}px;"></div>`;
            });
        }

        // Steg 3: Beräkna faktisk bredd (Jobb hoppar över arbetsfria dagar)
        function calculateJobScope(startIndex, hours) {
            let workDaysNeeded = Math.ceil(hours / 8);
            let daysSpanned = 0;
            let workDaysCounted = 0;
            let currentIndex = startIndex;

            // Loopa framåt på tidslinjen tills vi uppfyllt antalet arbetstimmar
            while (workDaysCounted < workDaysNeeded && currentIndex < TOTAL_DAYS) {
                daysSpanned++;
                if (timelineDays[currentIndex].isWorkingDay) {
                    workDaysCounted++;
                }
                currentIndex++;
            }
            
            // Om vi drar ett 8h jobb till en fredag, tar det 1 kalenderdag.
            // Om vi drar ett 16h jobb till en fredag, hoppar den över lör+sön och tar 4 kalenderdagar.
            return daysSpanned; 
        }

        // RITA GANTT OCH APPLICERA HELGHOPP
        function renderGantt() {
            const container = document.getElementById('gantt-rows');
            container.innerHTML = '';

            state.jobs.filter(j => j.status === 'scheduled').forEach(job => {
                let orbsHtml = job.assigned.map(id => {
                    const res = state.resources.find(r => r.id === id);
                    if (!res) return '';
                    let sizeClass = 'orb-gantt-' + (res.sizeClass || 'liten');
                    return `<div class="glass-orb ${sizeClass} border border-white/60 dark:border-slate-800 shrink-0 cursor-grab hover:scale-110 transition-transform" style="background-color:${res.color || '#0284c7'}" draggable="true" ondragstart="onOrbDragStart(event, '${id}')" title="${res.name} (Dra till vänster för att avboka)"><span class="z-10 text-slate-800">${res.icon || '👦'}</span></div>`;
                }).join('');

                let emptyPlaceholder = '<div class="orb-placeholder" title="Dra in resurs">+</div>';

                // BERÄKNA POSITION OCH BREDD
                const leftPx = (job.dayIndex || 0) * DAY_WIDTH + 8;
                const kalenderDagar = calculateJobScope(job.dayIndex || 0, job.hours);
                const widthPx = kalenderDagar * DAY_WIDTH - 16;
                const workDays = Math.ceil(job.hours / 8);

                container.innerHTML += `
                <div class="flex items-center h-[76px] border-b border-white/20 dark:border-slate-800/40 relative">
                    <div class="w-56 p-2 shrink-0 h-full flex items-center z-30 sticky left-0 border-r border-white/30 dark:border-sky-900/50 bg-white/40 dark:bg-slate-900/70 backdrop-blur-md">
                        <div class="glass-panel p-2 rounded-xl w-full border-white/60 dark:border-slate-700">
                            <div class="text-[9px] font-bold text-sky-700 dark:text-slate-400 uppercase truncate">${job.client}</div>
                            <div class="font-bold text-xs text-sky-950 dark:text-slate-100 truncate">${job.title}</div>
                        </div>
                    </div>
                    <div class="flex-1 h-full relative">
                        <div id="job-card-${job.id}" class="gantt-job-card ${job.billingCompany === 'Klaryta' ? 'kla' : 'lpv'} absolute top-[6px] bottom-[6px] shadow-lg transition-all"
                             style="left: ${leftPx}px; width: ${widthPx}px;"
                             draggable="true" ondragstart="onJobDragStart(event, '${job.id}')"
                             ondragover="allowJobCardDrop(event, '${job.id}')" ondragleave="leaveJobCardDrop(event, '${job.id}')" ondrop="dropOrbOnJob(event, '${job.id}')">
                            
                            <!-- Mönster overlay om jobbet går över helg -->
                            ${kalenderDagar > workDays ? '<div class="absolute inset-0 pointer-events-none opacity-20" style="background: repeating-linear-gradient(45deg, transparent, transparent 10px, #000 10px, #000 20px);"></div>' : ''}

                            <div class="gantt-job-card-content">
                                <div class="flex items-center gap-1">${orbsHtml}${emptyPlaceholder}</div>
                                <div class="text-[9px] font-extrabold bg-black/40 text-sky-200 px-1.5 py-0.5 rounded shrink-0">${job.hours}h (${kalenderDagar} kd)</div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }

        // --- RESTEN AV FUNKTIONERNA (Intakta) ---
        function renderKulpase() {
            const poolP = document.getElementById('pool-personnel'); const poolS = document.getElementById('pool-sick'); const poolM = document.getElementById('pool-machines');
            poolP.innerHTML = ''; poolS.innerHTML = ''; poolM.innerHTML = '';
            const assignedIds = new Set(); state.jobs.filter(j => j.status === 'scheduled').forEach(j => j.assigned.forEach(id => assignedIds.add(id)));

            state.resources.forEach(res => {
                let badge = (res.ownerCompany !== 'LPV' && res.ownerCompany !== 'Klaryta') ? 'bg-ue' : (res.ownerCompany === 'Klaryta' ? 'bg-klaryta' : 'bg-lpv');
                let oText = badge === 'bg-ue' ? 'UE' : res.ownerCompany;
                let sClass = 'orb-kulpase-' + (res.sizeClass || 'liten');
                let sHtml = res.skills ? `<div class="text-[8px] bg-sky-950/80 text-sky-300 border border-sky-500/30 rounded px-1 py-0.5 mt-0.5 truncate">${res.skills.split(',')[0]}</div>` : '';

                if (res.type === 'person' && res.isSick) {
                    poolS.innerHTML += `<div class="flex flex-col items-center gap-1 w-[56px] shrink-0"><div class="glass-orb ${sClass} sick-orb"><span class="z-10">🤒</span><span class="owner-badge bg-rose-600">SJUK</span></div><span class="text-[9px] font-bold text-rose-500 truncate">${res.name}</span></div>`;
                } else if (!assignedIds.has(res.id)) {
                    const html = `<div class="flex flex-col items-center gap-1 w-[56px] shrink-0"><div class="glass-orb ${sClass}" style="background-color: ${res.color}" draggable="true" ondragstart="onOrbDragStart(event, '${res.id}')"><span class="z-10 text-slate-800">${res.icon}</span><span class="owner-badge ${badge}">${oText}</span></div><span class="text-[9px] font-semibold text-sky-900 dark:text-slate-300 truncate">${res.name}</span>${sHtml}</div>`;
                    if (res.type === 'person') poolP.innerHTML += html; else poolM.innerHTML += html;
                }
            });
        }

        function renderOrderbook() {
            const container = document.getElementById('orderbook-list'); container.innerHTML = '';
            state.jobs.filter(j => j.status === 'unscheduled').forEach(job => {
                const days = Math.ceil(job.hours / 8);
                container.innerHTML += `<div class="glass-panel p-3 rounded-xl shrink-0 w-60 cursor-grab hover:scale-[1.02] transition-transform border border-emerald-500/30" draggable="true" ondragstart="onJobDragStart(event, '${job.id}')"><div class="flex items-center justify-between text-[10px] font-bold uppercase mb-1"><span class="truncate">${job.client}</span><span class="bg-amber-500/10 text-amber-500 px-1.5 rounded">${job.hours}h</span></div><div class="font-bold text-xs truncate mb-1.5">${job.title}</div><div class="text-[9px] text-emerald-400 font-semibold">🖐 Dra till tidslinjen</div></div>`;
            });
        }

        // DRAG, DROP & HIGHLIGHT LOGIK
        function onOrbDragStart(e, id) { e.stopPropagation(); e.dataTransfer.setData("type", "orb"); e.dataTransfer.setData("id", id); }
        function onJobDragStart(e, id) { e.dataTransfer.setData("type", "job"); e.dataTransfer.setData("id", id); }

        function allowTimelineDrop(e) { e.preventDefault(); document.getElementById('timeline-drop-area').classList.add('timeline-drag-active'); }
        function leaveTimelineDrop(e) { document.getElementById('timeline-drop-area').classList.remove('timeline-drag-active'); }
        
        function dropJobOnTimeline(e) {
            e.preventDefault(); leaveTimelineDrop(e);
            if (e.dataTransfer.getData("type") === "job") {
                const job = state.jobs.find(j => j.id === e.dataTransfer.getData("id"));
                if (job) {
                    const rect = document.getElementById('timeline-drop-area').getBoundingClientRect();
                    const offsetX = e.clientX - (rect.left + 224);
                    if (offsetX >= 0) {
                        let proposedIndex = Math.max(0, Math.floor(offsetX / DAY_WIDTH));
                        
                        // Smart Drop: Om vi droppar rakt på en helg/röd dag, knuffa fram jobbet till nästa arbetsdag!
                        while(proposedIndex < TOTAL_DAYS && !timelineDays[proposedIndex].isWorkingDay) {
                            proposedIndex++;
                        }
                        
                        job.status = 'scheduled'; job.dayIndex = proposedIndex; initUI();
                    }
                }
            }
        }

        function allowJobCardDrop(e, id) { e.preventDefault(); e.stopPropagation(); document.getElementById('job-card-'+id).classList.add('job-card-hover'); }
        function leaveJobCardDrop(e, id) { document.getElementById('job-card-'+id).classList.remove('job-card-hover'); }
        function dropOrbOnJob(e, jobId) {
            e.preventDefault(); e.stopPropagation(); leaveJobCardDrop(e, jobId);
            if (e.dataTransfer.getData("type") === "orb") {
                const resId = e.dataTransfer.getData("id");
                state.jobs.forEach(j => j.assigned = j.assigned.filter(aid => aid !== resId));
                const job = state.jobs.find(j => j.id === jobId);
                if (job && !job.assigned.includes(resId)) job.assigned.push(resId);
                initUI();
            }
        }

        function allowPoolDrop(e) { e.preventDefault(); document.getElementById('resource-panel').classList.add('pool-drag-active'); }
        function leavePoolDrop(e) { document.getElementById('resource-panel').classList.remove('pool-drag-active'); }
        function dropOrbToPool(e) {
            e.preventDefault(); leavePoolDrop(e);
            if (e.dataTransfer.getData("type") === "orb") {
                const resId = e.dataTransfer.getData("id");
                state.jobs.forEach(j => j.assigned = j.assigned.filter(aid => aid !== resId));
                initUI();
            }
        }

        // DMT Modal
        function openQuickAddModal(type) { /* Intakt, se källkod ifall manuellt anropas, men samma som v4 */ }
        function closeQuickAddModal() { /* Intakt */ }

        // Jobb Modal
        function openCreateJobModal() { document.getElementById('create-job-modal').classList.remove('hidden'); document.getElementById('create-job-modal').classList.add('flex'); }
        function closeCreateJobModal() { document.getElementById('create-job-modal').classList.add('hidden'); document.getElementById('create-job-modal').classList.remove('flex'); }
        function handleCreateJobSubmit(e) {
            e.preventDefault();
            state.jobs.push({
                id: "j_" + Date.now(), client: document.getElementById('job-client-select').value, billingCompany: document.getElementById('job-billing-company').value,
                title: document.getElementById('job-title').value, hours: Number(document.getElementById('job-hours').value),
                status: "unscheduled", assigned: []
            });
            closeCreateJobModal(); initUI();
        }

        document.addEventListener('DOMContentLoaded', initUI);
    </script>
</body>
</html>
