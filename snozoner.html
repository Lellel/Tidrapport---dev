<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snözoner – Rita</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg: #0b1220; --panel: #111a2e; --line: #23314f; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --ok: #10b981; --danger: #ef4444; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .layout { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
    #map { height: 100%; width: 100%; }
    .panel { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .topbar a { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 700; }
    h1 { font-size: 17px; margin: 0; }
    label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #0b1220; color: var(--text); font-size: 15px; }
    textarea { resize: vertical; min-height: 54px; }
    .row2 { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
    .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: #17223b; color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; }
    button.active { background: var(--accent); color: #0b1220; border-color: var(--accent); }
    button.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
    button.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .status { font-size: 13px; color: var(--muted); min-height: 18px; }
    .status b { color: var(--text); }
    .banner { background: rgba(239,68,68,.12); border: 1px solid var(--danger); color: #fecaca; padding: 10px; border-radius: 10px; font-size: 13px; display: none; }
    .map-toggle { position: absolute; top: 12px; left: 12px; z-index: 500; display: flex; gap: 6px; }
    .map-toggle button { min-height: 36px; padding: 0 12px; background: rgba(17,26,46,.9); }
    .map-wrap { position: relative; height: 100%; }
    .zone-list { display: flex; flex-direction: column; gap: 6px; }
    .zone-item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; cursor: pointer; }
    .zone-item small { color: var(--muted); }
    .slinga-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .slinga-card-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 700; }
    .slinga-card-head small { color: var(--muted); font-weight: 400; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: transparent; }
    .chip.on { background: var(--ok); border-color: var(--ok); color: #fff; }
    .warn { color: #fbbf24; font-size: 12px; }
    .sugg { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px dashed var(--accent); border-radius: 10px; font-size: 13px; }
    .sugg span { flex: 1; }
    .sugg small { color: var(--muted); }
    .sugg button { min-height: 36px; padding: 0 10px; }
    .kk-overlay { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; max-width: none !important; }
    .kk-handle { width: 34px; height: 34px; border-radius: 50%; background: #38bdf8; color: #0b1220; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; box-shadow: 0 2px 8px rgba(0,0,0,.5); border: 2px solid #fff; }
    .kk-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .kk-row button { flex: 1; min-height: 40px; padding: 0 8px; }
    input[type=range] { padding: 0; }
    .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #3b82f6; border: 3px solid #fff; box-shadow: 0 0 0 4px rgba(59,130,246,.35); }
    .sno-hazard { font-size: 22px; text-align: center; line-height: 30px; filter: drop-shadow(0 1px 2px #000); }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
      .panel { border-left: none; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-toggle">
        <button onclick="mapCtl.setTiles('sat')">🛰️ Satellit</button>
        <button onclick="mapCtl.setTiles('street')">🗺️ Vägkarta</button>
      </div>
    </div>

    <aside class="panel">
      <div class="topbar">
        <a href="index.html">← Tidrapport</a>
        <a href="snohinder.html">📷 Hinder steg för steg</a>
        <a href="snojour.html">Snöjour →</a>
      </div>
      <h1>❄️ Rita snözoner</h1>
      <div class="banner" id="admin-banner">Bara admin kan spara zoner. Logga in med din admin-länk.</div>

      <div>
        <label for="f-omrade">Mitt område i genomgången</label>
        <select id="f-omrade" onchange="setArea(this.value)" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--text);font-size:15px;margin-bottom:8px;"></select>
        <label for="f-fastighet">Fastighet från Snöplanering</label>
        <input id="f-fastighet" list="fastighet-list" placeholder="🔍 Sök fastighet – visar kundens karta" onchange="chooseProperty(this.value)">
        <datalist id="fastighet-list"></datalist>
      </div>
      <div class="slinga-card" id="kk-card" style="display:none"></div>

      <div>
        <label for="f-slinga">Slinga</label>
        <input id="f-slinga" list="slinga-list" placeholder="T.ex. Centrum 1">
        <datalist id="slinga-list"></datalist>
      </div>
      <div class="row2">
        <div>
          <label for="f-property">Fastighet / Adress</label>
          <input id="f-property" placeholder="T.ex. Drottninggatan 4">
        </div>
        <div>
          <label for="f-order">Ordning</label>
          <input id="f-order" type="number" min="0" inputmode="numeric" placeholder="1">
        </div>
      </div>
      <div>
        <label for="f-note">Anteckning</label>
        <textarea id="f-note" placeholder="T.ex. Snöupplag vid gaveln, se upp för låg grind"></textarea>
      </div>

      <div>
        <label>Verktyg</label>
        <div class="tools" id="tools"></div>
      </div>

      <div>
        <label>På plats och förslag</label>
        <div class="actions">
          <button id="btn-gps" onclick="addGpsPoint()">📍 Punkt där jag står</button>
          <button id="btn-sugg" onclick="loadSuggestions()">💡 Förslag från kartan</button>
        </div>
        <div class="zone-list" id="sugg-list" style="margin-top:6px;"></div>
      </div>

      <div class="status" id="status">Välj ett verktyg och tryck på kartan.</div>
      <div class="actions">
        <button onclick="undoPoint()">↶ Ångra punkt</button>
        <button onclick="cancelDrawing()">✕ Avbryt</button>
        <button class="ok" id="btn-save" onclick="saveCurrent()" style="grid-column: 1 / -1;">💾 Spara zon</button>
        <button class="danger" id="btn-delete" onclick="deleteSelected()" style="grid-column: 1 / -1; display:none;">🗑️ Ta bort vald zon</button>
      </div>

      <div id="tilldela">
        <label>Förare per slinga</label>
        <div class="status" style="margin-bottom:6px;">Tryck på ett namn för att tilldela eller ta bort. Föraren ser bara sina slingor i Snöjour.</div>
        <div class="zone-list" id="assign-list"></div>
      </div>

      <div>
        <label>Sparade zoner <span id="zone-count"></span></label>
        <div class="zone-list" id="zone-list"></div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="sno.js"></script>
  <script>
    let mapCtl, map;
    let zones = [];
    let zoneLayers = [];
    let currentTool = 'maskin';
    let drawingPoints = [];
    let previewLayer = null;
    let selectedZone = null;
    let assignments = {};
    let staff = [];

    function setStatus(html) { document.getElementById('status').innerHTML = html; }

    // 🚪 Entré = en handskottningsyta på 3 × 3 m med ett tryck (sparas som Handskottning)
    const ENTRE_SIZE = 3;
    const toolType = () => currentTool === 'entre' ? 'hand' : currentTool;
    const toolDef = () => SNO_TYPES[toolType()];
    function squareAround(pt, sizeM) {
      const dLat = sizeM / 2 / 111320, dLng = sizeM / 2 / (111320 * Math.cos(pt[0] * Math.PI / 180));
      return [[pt[0] + dLat, pt[1] - dLng], [pt[0] + dLat, pt[1] + dLng], [pt[0] - dLat, pt[1] + dLng], [pt[0] - dLat, pt[1] - dLng]];
    }

    function renderTools() {
      document.getElementById('tools').innerHTML = Object.entries(SNO_TYPES).map(([key, def]) =>
        `<button class="${key === currentTool ? 'active' : ''}" onclick="setTool('${key}')">${def.icon || '■'} ${def.label}</button>`
      ).join('') + `<button class="${currentTool === 'entre' ? 'active' : ''}" onclick="setTool('entre')">🚪 Entré</button>`;
    }

    function setTool(tool) {
      currentTool = tool;
      cancelDrawing();
      renderTools();
      const kind = toolDef().kind;
      setStatus(tool === 'entre' ? `Tryck vid entrén – en handskottningsyta på ${ENTRE_SIZE} × ${ENTRE_SIZE} m läggs ut. Spara, och fortsätt med nästa entré.` :
        kind === 'marker' ? 'Tryck på kartan där markören ska sitta.' :
        kind === 'line' ? 'Tryck ut sträckan punkt för punkt, spara när du är klar.' :
        'Tryck ut hörnen runt ytan, spara när du är klar.');
    }

    function drawPreview() {
      if (previewLayer) map.removeLayer(previewLayer);
      previewLayer = null;
      const def = toolDef();
      if (drawingPoints.length === 0) return;
      if (def.kind === 'polygon' && drawingPoints.length >= 3) {
        previewLayer = L.polygon(drawingPoints, { color: def.color, fillOpacity: 0.25, dashArray: '6 6' }).addTo(map);
        setStatus(`${drawingPoints.length} punkter · Yta: <b>${Math.round(snoGeodesicArea(drawingPoints)).toLocaleString('sv-SE')} m²</b>`);
      } else if (def.kind !== 'marker') {
        previewLayer = L.polyline(drawingPoints, { color: def.color || '#fff', dashArray: '6 6', weight: 4 }).addTo(map);
        setStatus(`${drawingPoints.length} punkter`);
      } else {
        previewLayer = L.marker(drawingPoints[0], { icon: L.divIcon({ className: 'sno-hazard', html: def.icon, iconSize: [30, 30] }) }).addTo(map);
        setStatus(`${def.label} placerad – tryck Spara.`);
      }
    }

    function onMapClick(e) {
      if (kk.adjusting) return; // kundkartan justeras – tryck på kartan ritar inget
      selectZone(null);
      const point = [e.latlng.lat, e.latlng.lng];
      if (currentTool === 'entre') drawingPoints = squareAround(point, ENTRE_SIZE);
      else if (toolDef().kind === 'marker') drawingPoints = [point];
      else drawingPoints.push(point);
      drawPreview();
    }

    function undoPoint() { drawingPoints.pop(); drawPreview(); }

    function cancelDrawing() {
      drawingPoints = [];
      if (previewLayer) map.removeLayer(previewLayer);
      previewLayer = null;
    }

    function readForm() {
      return {
        slinga: document.getElementById('f-slinga').value.trim(),
        property: document.getElementById('f-property').value.trim(),
        order: Number(document.getElementById('f-order').value) || 0,
        note: document.getElementById('f-note').value.trim()
      };
    }

    async function saveCurrent() {
      const form = readForm();
      let zone;
      if (selectedZone) {
        zone = { ...selectedZone, ...form };
      } else {
        const kind = toolDef().kind;
        const minPoints = kind === 'polygon' ? 3 : kind === 'line' ? 2 : 1;
        if (drawingPoints.length < minPoints) { setStatus(`Rita minst ${minPoints} punkter först.`); return; }
        zone = { ...form, type: toolType(), coords: drawingPoints, areaM2: kind === 'polygon' ? snoGeodesicArea(drawingPoints) : 0 };
        if (currentTool === 'entre' && !zone.note) zone.note = 'Entré';
      }
      if (!zone.property) { setStatus('Fyll i Fastighet / Adress.'); document.getElementById('f-property').focus(); return; }

      setStatus('Sparar…');
      try {
        const res = await snoApi({ action: 'saveSnowZone', zone });
        if (res.status !== 'success') { setStatus('❌ ' + snoEscape(res.message || 'Kunde inte spara.')); return; }
        cancelDrawing();
        selectZone(null);
        // Vald fastighet ligger kvar, så att nästa zon på samma adress går fort
        document.getElementById('f-property').value = currentProp ? currentProp.address : '';
        document.getElementById('f-note').value = '';
        const orderInput = document.getElementById('f-order');
        if (orderInput.value) orderInput.value = Number(orderInput.value) + 1;
        await loadZones();
        setStatus('✅ Sparad. Rita nästa zon.');
      } catch (err) {
        setStatus('❌ Ingen kontakt med servern. Försök igen.');
      }
    }

    async function deleteSelected() {
      if (!selectedZone) return;
      if (!confirm(`Ta bort ${SNO_TYPES[selectedZone.type].label.toLowerCase()} vid ${selectedZone.property}?`)) return;
      const res = await snoApi({ action: 'deleteSnowZone', zoneId: selectedZone.id });
      if (res.status !== 'success') { setStatus('❌ ' + snoEscape(res.message || 'Kunde inte ta bort.')); return; }
      selectZone(null);
      await loadZones();
      setStatus('🗑️ Borttagen.');
    }

    // Tryck på en sparad zon = välj den för att ändra uppgifter eller ta bort
    function selectZone(zone) {
      selectedZone = zone;
      document.getElementById('btn-delete').style.display = zone ? 'block' : 'none';
      document.getElementById('btn-save').innerText = zone ? '💾 Spara ändringar' : '💾 Spara zon';
      if (zone) {
        cancelDrawing();
        document.getElementById('f-slinga').value = zone.slinga;
        document.getElementById('f-property').value = zone.property;
        document.getElementById('f-order').value = zone.order || '';
        document.getElementById('f-note').value = zone.note;
        setStatus(`Vald: <b>${snoEscape(zone.property)}</b> (${SNO_TYPES[zone.type].label}). Ändra uppgifterna eller ta bort.`);
      }
    }

    function renderZoneList() {
      const sorted = [...zones].sort((a, b) => a.slinga.localeCompare(b.slinga, 'sv') || a.order - b.order);
      document.getElementById('zone-count').innerText = `(${zones.length})`;
      document.getElementById('zone-list').innerHTML = sorted.map(z => `
        <div class="zone-item" onclick="focusZone('${snoEscape(z.id)}')">
          <span>${SNO_TYPES[z.type]?.icon || '■'} ${snoEscape(z.property)}<br><small>${snoEscape(z.slinga || 'Ingen slinga')} · #${z.order}</small></span>
          <small>${z.areaM2 ? Math.round(z.areaM2).toLocaleString('sv-SE') + ' m²' : SNO_TYPES[z.type]?.label || ''}</small>
        </div>`).join('') || '<div class="status">Inga zoner ännu.</div>';
      document.getElementById('slinga-list').innerHTML = snoSlingor(zones).map(s => `<option value="${snoEscape(s)}">`).join('');
    }

    function focusZone(id) {
      const zone = zones.find(z => z.id === id);
      if (!zone) return;
      map.setView(snoCenter(zone.coords), Math.max(map.getZoom(), 18));
      selectZone(zone);
    }

    async function loadZones() {
      try {
        const res = await snoApi({ action: 'getSnowZones' });
        if (res.status !== 'success') { setStatus('❌ ' + snoEscape(res.message || 'Kunde inte hämta zoner.')); return; }
        zones = res.zones || [];
        assignments = res.assignments || {};
        zoneLayers.forEach(l => map.removeLayer(l));
        // Mitt i en ritning blir tryck på en befintlig zon en ny punkt, annars väljs zonen
        zoneLayers = zones.map(z => snoRenderZone(map, z, (zone, layer, e) => {
          // Entréer och markörer läggs ofta inne i en zon: då räknas trycket som ett tryck på kartan
          if (drawingPoints.length > 0 || currentTool === 'entre' || toolDef().kind === 'marker') { layer.closePopup(); onMapClick(e); }
          else selectZone(zone);
        }));
        renderZoneList();
        renderAssignments();
      } catch (err) {
        setStatus('❌ Ingen kontakt med servern.');
      }
    }

    // ---------- TILLDELA FÖRARE ----------
    async function loadStaff() {
      try {
        const res = await snoApi({ action: 'getUsers' });
        if (res.status === 'success') staff = res.users.filter(u => !/karantän/i.test(u.status || ''));
      } catch (err) { staff = []; }
      renderAssignments();
    }

    function renderAssignments() {
      const el = document.getElementById('assign-list');
      const slingor = [...new Set([...snoSlingor(zones), ...Object.keys(assignments)])].sort((a, b) => a.localeCompare(b, 'sv'));
      if (!slingor.length) { el.innerHTML = '<div class="status">Rita en zon med ett slingnamn först.</div>'; return; }
      el.innerHTML = slingor.map(slinga => {
        const assigned = assignments[slinga] || [];
        const count = zones.filter(z => z.slinga === slinga).length;
        const names = [...new Set([...staff.map(u => u.name), ...assigned])];
        return `<div class="slinga-card">
          <div class="slinga-card-head"><span>${snoEscape(slinga)}</span><small>${count} objekt</small></div>
          ${assigned.length ? '' : '<div class="warn">⚠️ Ingen förare tilldelad</div>'}
          <div class="chips">${names.map(n => `<button class="chip ${assigned.includes(n) ? 'on' : ''}" data-slinga="${snoEscape(slinga)}" data-name="${snoEscape(n)}" onclick="toggleDriver(this)">${assigned.includes(n) ? '✓ ' : ''}${snoEscape(n)}</button>`).join('') || '<span class="status">Hämtar personal…</span>'}</div>
        </div>`;
      }).join('');
    }

    async function toggleDriver(btn) {
      const slinga = btn.dataset.slinga, name = btn.dataset.name;
      const before = assignments[slinga] || [];
      const after = before.includes(name) ? before.filter(n => n !== name) : [...before, name];
      assignments[slinga] = after;
      renderAssignments();
      try {
        const res = await snoApi({ action: 'setSlingaDrivers', slinga, drivers: after });
        if (res.status !== 'success') throw new Error(res.message);
        setStatus(`✅ ${snoEscape(slinga)}: ${after.length ? snoEscape(after.join(', ')) : 'ingen förare'}`);
      } catch (err) {
        assignments[slinga] = before;
        renderAssignments();
        setStatus('❌ Kunde inte spara tilldelningen. ' + snoEscape(err.message || ''));
      }
    }

    // ---------- PÅ PLATS: punkt där jag står (GPS-medelvärde i fem sekunder) ----------
    let gpsWatch = null, myFix = null, meMarker = null, gpsSamples = null;

    function startGps() {
      if (gpsWatch !== null) return;
      if (!('geolocation' in navigator)) { setStatus('Ingen GPS i den här webbläsaren.'); return; }
      gpsWatch = navigator.geolocation.watchPosition((pos) => {
        myFix = { pos: [pos.coords.latitude, pos.coords.longitude], acc: Math.max(1, pos.coords.accuracy) };
        if (!meMarker) meMarker = L.marker(myFix.pos, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18] }), zIndexOffset: 1000, interactive: false }).addTo(map);
        else meMarker.setLatLng(myFix.pos);
        if (gpsSamples) gpsSamples.push(myFix);
      }, (err) => {
        setStatus(err.code === 1 ? 'GPS nekad. Tillåt plats för sidan i inställningarna.' : 'Hittar ingen GPS-position just nu.');
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    }

    async function addGpsPoint() {
      if (gpsSamples) return;
      selectZone(null);
      startGps();
      const btn = document.getElementById('btn-gps');
      btn.disabled = true;
      gpsSamples = [];
      const started = Date.now();
      // Fem sekunder; telefonen skickar sällan nya positioner när man står still – då gäller den senaste
      while (Date.now() - started < 5000 || (!gpsSamples.length && !myFix && Date.now() - started < 15000)) {
        setStatus(`📡 Mäter… stå still (${Math.max(0, Math.ceil((5000 - (Date.now() - started)) / 1000))} s)`);
        await new Promise(r => setTimeout(r, 250));
      }
      const samples = gpsSamples.length ? gpsSamples : (myFix ? [myFix] : []);
      gpsSamples = null;
      btn.disabled = false;
      if (!samples.length) { setStatus('Fick ingen GPS-position. Försök igen eller tryck på kartan.'); return; }
      let w = 0, lat = 0, lng = 0;
      samples.forEach(x => { const k = 1 / (x.acc * x.acc); w += k; lat += x.pos[0] * k; lng += x.pos[1] * k; });
      const point = [lat / w, lng / w];
      const acc = Math.round(samples.map(x => x.acc).sort((a, b) => a - b)[Math.floor(samples.length / 2)]);
      if (currentTool === 'entre') drawingPoints = squareAround(point, ENTRE_SIZE);
      else if (toolDef().kind === 'marker') drawingPoints = [point];
      else drawingPoints.push(point);
      setStatus('');
      drawPreview();
      map.setView(point, Math.max(map.getZoom(), 18));
      setStatus((document.getElementById('status').innerHTML || `${drawingPoints.length} punkter`) + ` · senaste ±${acc} m${toolDef().kind === 'marker' || currentTool === 'entre' ? '' : ' – gå till nästa hörn'}`);
    }

    // ---------- FÖRSLAG FRÅN KARTAN (OpenStreetMap) ----------
    let suggestions = [], suggLayers = [];

    function clearSuggestionLayers() { suggLayers.forEach(l => l && map.removeLayer(l)); suggLayers = []; }

    async function loadSuggestions() {
      if (map.getZoom() < 16) { setStatus('Zooma in på adressen först, så letar jag inom kartbilden.'); return; }
      const btn = document.getElementById('btn-sugg');
      btn.disabled = true;
      setStatus('💡 Letar efter parkeringar och gångvägar…');
      try {
        const found = await snoOsmSuggestions(map.getBounds());
        // Det som redan är ritat (mitten av förslaget ligger i en zon av samma typ) visas inte
        const fresh = found.filter(sg => !zones.some(z => z.type === sg.type && z.coords.length >= 3 && snoPointInPolygon(snoCenter(sg.coords), z.coords)));
        // Kartförslagen ersätter tidigare kartförslag; AI-förslagen från kundkartan ligger kvar
        suggestions = suggestions.filter(sg => sg.source === 'ai').concat(fresh);
        renderSuggestions();
        setStatus(fresh.length ? `💡 ${fresh.length} förslag. Tryck <b>Ta med</b>, fyll i adressen och spara.` : 'Inga nya förslag här – rita själv.');
      } catch (err) {
        setStatus('❌ ' + snoEscape(err.message || 'Kunde inte hämta förslag.'));
      }
      btn.disabled = false;
    }

    function renderSuggestions() {
      clearSuggestionLayers();
      suggLayers = suggestions.map(sg => (sg.coords.length === 1
        ? L.circleMarker(sg.coords[0], { radius: 9, color: '#fff', weight: 2, dashArray: '3 4', fillColor: '#f59e0b', fillOpacity: 0.5, interactive: false })
        : L.polygon(sg.coords, { color: '#fff', weight: 2, dashArray: '4 6', fillColor: SNO_TYPES[sg.type].color, fillOpacity: 0.15, interactive: false })).addTo(map));
      document.getElementById('sugg-list').innerHTML = suggestions.map((sg, i) => `<div class="sugg">
          <span>${sg.icon} ${snoEscape(sg.what)} <small>${sg.size ? sg.size + ' ' : ''}→ ${SNO_TYPES[sg.type].label}</small></span>
          <button onclick="takeSuggestion(${i})">Ta med</button><button onclick="dropSuggestion(${i})" title="Inte aktuell">✕</button></div>`).join('');
    }

    function takeSuggestion(i) {
      const sg = suggestions[i];
      selectZone(null);
      setTool(sg.type);
      drawingPoints = sg.coords.slice();
      drawPreview();
      dropSuggestion(i);
      setStatus(`${sg.icon} ${snoEscape(sg.what)} inlagd som ${SNO_TYPES[sg.type].label.toLowerCase()}. Fyll i adress och tryck <b>Spara zon</b>.`);
      if (!document.getElementById('f-property').value) document.getElementById('f-property').focus();
    }

    // ---------- FASTIGHETER OCH KUNDENS KARTA ----------
    // Kundens karta (från PDF:en) läggs halvgenomskinlig ovanpå satellitbilden. Två handtag:
    // ✥ flyttar, ⟳ vrider och skalar (sidförhållandet behålls). Läget sparas på fastigheten.
    let properties = [], currentProp = null;
    const kk = { idx: 0, layer: null, place: null, W: 0, H: 0, opacity: 0.6, adjusting: false, dirty: false, hidden: false, handles: [] };

    async function loadProperties() {
      try {
        const res = await snoApi({ action: 'getProperties' });
        if (res.status !== 'success') return;
        properties = res.properties || [];
        renderPropList();
        setInterval(refreshProperties, 60000);
        const want = new URLSearchParams(location.search).get('fastighet');
        if (want) { const p = properties.find(x => x.id === want); if (p) { document.getElementById('f-fastighet').value = propLabel(p); chooseProperty(propLabel(p)); } }
      } catch (err) { /* utan nät: fastighetslistan saknas, resten fungerar */ }
    }
    const me = snoCurrentUser();
    const takenByOther = (p) => p.claimedBy && p.claimedBy !== me;
    const propLabel = (p) => p.address + (p.ort ? ', ' + p.ort : '') + (p.maps && p.maps.length ? ' 📄' : '') + (p.zoneStatus === 'klar' ? ' ✅' : p.zoneStatus === 'senare' ? ' ⏭' : '');
    const areaOf = (p) => p.omrade || p.ort || 'Utan område';
    // Flera hjälps åt: var och en väljer sitt område (sparas i den här webbläsaren)
    let area = '';
    try { area = localStorage.getItem('lpv_zon_omrade') || ''; } catch (e) { area = ''; }
    const inArea = (p) => !area || areaOf(p) === area;
    // Genomgångens ordning: område, sedan adress
    const propOrder = () => properties.filter(inArea).sort((a, b) => areaOf(a).localeCompare(areaOf(b), 'sv') || a.address.localeCompare(b.address, 'sv'));

    function renderPropList() {
      document.getElementById('fastighet-list').innerHTML = propOrder().map(p => `<option value="${snoEscape(propLabel(p))}">${takenByOther(p) ? '🔒 ' + snoEscape(p.claimedBy) : ''}</option>`).join('');
      const areas = {};
      properties.forEach(p => { const a = areas[areaOf(p)] || (areas[areaOf(p)] = { n: 0, done: 0 }); a.n++; if (p.zoneStatus === 'klar') a.done++; });
      document.getElementById('f-omrade').innerHTML = `<option value="">Alla områden (${properties.length})</option>` +
        Object.keys(areas).sort((a, b) => a.localeCompare(b, 'sv')).map(a => `<option value="${snoEscape(a)}" ${a === area ? 'selected' : ''}>${snoEscape(a)} – ${areas[a].done} av ${areas[a].n} klara</option>`).join('');
    }

    async function setArea(a) {
      area = a;
      try { localStorage.setItem('lpv_zon_omrade', a); } catch (e) { /* privat läge */ }
      await refreshProperties(); // färska 🔒 innan första fastigheten väljs
      renderPropList();
      if (!currentProp || !inArea(currentProp)) { const first = nextProperty(null); if (first) openProperty(first); }
      else renderKkCard();
    }

    // Nästa i mitt område: inte klar, inte upptagen av någon annan; de överhoppade kommer sist
    function nextProperty(from) {
      const list = propOrder(), i = from ? list.findIndex(x => x.id === from.id) : -1;
      const after = list.slice(i + 1).concat(list.slice(0, i + 1)).filter(x => !from || x.id !== from.id);
      return after.find(x => !x.zoneStatus && !takenByOther(x)) || after.find(x => x.zoneStatus === 'senare' && !takenByOther(x));
    }

    function openProperty(p) {
      document.getElementById('f-fastighet').value = propLabel(p);
      document.getElementById('f-slinga').value = '';
      document.getElementById('f-note').value = '';
      clearSuggestionLayers(); suggestions = []; document.getElementById('sugg-list').innerHTML = '';
      chooseProperty(propLabel(p));
    }

    // 🔒 Den man öppnar markeras som upptagen i en halvtimme; den förra släpps
    async function claim(p, force) {
      try {
        const res = await snoApi({ action: 'claimProperty', id: p.id, force: !!force });
        if (res.status === 'success') p.claimedBy = res.claimedBy;
      } catch (err) { /* utan nät: ingen markering */ }
      renderKkCard(); renderPropList();
    }

    // Hämta de andras markeringar och framsteg varje minut
    async function refreshProperties() {
      try {
        const res = await snoApi({ action: 'getProperties' });
        if (res.status !== 'success') return;
        res.properties.forEach(np => { const old = properties.find(x => x.id === np.id); if (old) { old.zoneStatus = np.zoneStatus; old.claimedBy = np.claimedBy; } else properties.push(np); });
        renderPropList(); renderKkCard();
      } catch (err) { /* nästa gång */ }
    }

    // ✅ Klar / ⏭ Senare -> nästa som inte är klar (de överhoppade kommer sist)
    async function markAndNext(status) {
      const p = currentProp;
      try {
        const res = await snoApi({ action: 'setPropertyZoneStatus', id: p.id, zoneStatus: status });
        if (res.status !== 'success') throw new Error(res.message);
        p.zoneStatus = status; p.claimedBy = '';
      } catch (err) { setStatus('❌ ' + snoEscape(err.message || 'Kunde inte spara.')); return; }
      await refreshProperties(); // färska 🔒 från de andra innan nästa väljs
      const next = nextProperty(p);
      if (!next) { setStatus(area ? `🎉 Allt i ${snoEscape(area)} är klart (eller upptaget av någon annan)!` : '🎉 Alla fastigheter är klara!'); renderKkCard(); return; }
      openProperty(next);
      setStatus(`${status === 'klar' ? '✅ ' + snoEscape(p.address) + ' klar.' : '⏭ ' + snoEscape(p.address) + ' tas senare.'} Nu: <b>${snoEscape(next.address)}</b>`);
    }

    function progressHtml() {
      const mine = properties.filter(inArea);
      const done = mine.filter(x => x.zoneStatus === 'klar').length, later = mine.filter(x => x.zoneStatus === 'senare').length;
      const busy = properties.filter(takenByOther).map(x => x.claimedBy);
      return `${takenByOther(currentProp) ? `<div class="warn">🔒 ${snoEscape(currentProp.claimedBy)} jobbar med den här just nu. Välj en annan – eller <a href="#" onclick="claim(currentProp, true); return false;" style="color:var(--accent)">ta över</a>.</div>` : ''}
        <div class="status" style="font-size:12px">${area ? snoEscape(area) : 'Genomgång'}: <b>${done} av ${mine.length}</b> klara${later ? ` · ${later} senare` : ''}${busy.length ? ` · 🔒 ${[...new Set(busy)].map(snoEscape).join(', ')} jobbar också` : ''}</div>
        ${takenByOther(currentProp) ? `<div class="kk-row"><button onclick="const n = nextProperty(currentProp); if (n) openProperty(n)">⏭ Välj en annan</button></div>` :
          `<div class="kk-row"><button class="ok" onclick="markAndNext('klar')">✅ Klar – nästa</button><button onclick="markAndNext('senare')">⏭ Senare – nästa</button></div>`}`;
    }

    function chooseProperty(label) {
      const p = properties.find(x => propLabel(x) === label);
      if (!p) return;
      if (currentProp && currentProp.id !== p.id && currentProp.claimedBy === me) {
        snoApi({ action: 'claimProperty', id: currentProp.id, release: true }).catch(() => {});
        currentProp.claimedBy = '';
      }
      currentProp = p;
      if (!takenByOther(p)) claim(p);
      selectZone(null);
      document.getElementById('f-property').value = p.address;
      const sl = document.getElementById('f-slinga');
      if (!sl.value) sl.value = p.omrade || p.ort || '';
      if (p.note && !document.getElementById('f-note').value) document.getElementById('f-note').placeholder = p.note;
      if (p.lat !== null) map.setView([p.lat, p.lng], 18);
      kk.idx = 0;
      showCustomerMap();
    }

    const kkMap = () => currentProp && currentProp.maps && currentProp.maps[kk.idx];

    function removeCustomerMap() {
      if (kk.layer) map.removeLayer(kk.layer);
      kk.handles.forEach(h => map.removeLayer(h));
      kk.layer = null; kk.handles = []; kk.adjusting = false; kk.dirty = false;
    }

    function showCustomerMap() {
      removeCustomerMap();
      const m = kkMap();
      if (!m) { renderKkCard(); return; }
      const img = new Image();
      img.onload = () => {
        kk.W = img.naturalWidth; kk.H = img.naturalHeight;
        // Första gången: mitt på fastigheten, ca 150 m bred (LandInfo-kartorna visar mer omgivning)
        kk.place = m.place ? { ...m.place } : { c: currentProp.lat !== null ? [currentProp.lat, currentProp.lng] : [map.getCenter().lat, map.getCenter().lng], w: /LandInfo/.test(m.label) ? 140 : 160, rot: 0 };
        kk.layer = new KundOverlay(m.url).addTo(map);
        if (!m.place) startAdjust();
        renderKkCard();
      };
      img.onerror = () => { setStatus('❌ Kundkartan kunde inte laddas.'); renderKkCard(); };
      img.src = m.url;
    }

    // Hörnen i kartprojektionen (meter gånger 1/cos(lat) i Web Mercator)
    function kkCorners(place) {
      const crs = L.CRS.EPSG3857;
      const c = crs.project(L.latLng(place.c[0], place.c[1]));
      const k = 1 / Math.cos(place.c[0] * Math.PI / 180);
      const hw = place.w / 2 * k, hh = hw * kk.H / kk.W;
      const ex = [Math.cos(place.rot), Math.sin(place.rot)], ey = [-Math.sin(place.rot), Math.cos(place.rot)];
      const at = (sx, sy) => { const ll = crs.unproject(L.point(c.x + sx * hw * ex[0] + sy * hh * ey[0], c.y + sx * hw * ex[1] + sy * hh * ey[1])); return [ll.lat, ll.lng]; };
      return { tl: at(-1, 1), tr: at(1, 1), bl: at(-1, -1), br: at(1, -1) };
    }

    const KundOverlay = L.Layer.extend({
      initialize(url) { this._url = url; },
      onAdd(m) {
        if (!m.getPane('kundkarta')) { m.createPane('kundkarta'); m.getPane('kundkarta').style.zIndex = 350; }
        this._img = L.DomUtil.create('img', 'kk-overlay', m.getPane('kundkarta'));
        this._img.src = this._url;
        this._img.style.width = kk.W + 'px'; this._img.style.height = kk.H + 'px';
        m.on('zoomend viewreset', this.update, this);
        m.on('zoomstart', this._hide, this);
        this.update();
      },
      onRemove(m) { L.DomUtil.remove(this._img); m.off('zoomend viewreset', this.update, this); m.off('zoomstart', this._hide, this); },
      _hide() { this._img.style.visibility = 'hidden'; },
      update() {
        if (!this._map || !kk.place) return;
        const c = kkCorners(kk.place);
        const p = (ll) => this._map.latLngToLayerPoint(ll);
        const tl = p(c.tl), tr = p(c.tr), bl = p(c.bl);
        this._img.style.transform = `matrix(${(tr.x - tl.x) / kk.W},${(tr.y - tl.y) / kk.W},${(bl.x - tl.x) / kk.H},${(bl.y - tl.y) / kk.H},${tl.x},${tl.y})`;
        this._img.style.opacity = kk.hidden ? 0 : kk.opacity;
        this._img.style.visibility = 'visible';
      }
    });

    function placeHandles() {
      kk.handles.forEach(h => map.removeLayer(h));
      kk.handles = [];
      if (!kk.adjusting) return;
      const icon = (t) => L.divIcon({ className: '', html: `<div class="kk-handle">${t}</div>`, iconSize: [34, 34], iconAnchor: [17, 17] });
      const mv = L.marker(kk.place.c, { draggable: true, icon: icon('✥'), zIndexOffset: 3000 }).addTo(map);
      const rt = L.marker(kkCorners(kk.place).tr, { draggable: true, icon: icon('⟳'), zIndexOffset: 3000 }).addTo(map);
      mv.on('drag', () => { const ll = mv.getLatLng(); kk.place.c = [ll.lat, ll.lng]; rt.setLatLng(kkCorners(kk.place).tr); kk.dirty = true; kk.layer.update(); });
      rt.on('drag', () => {
        const crs = L.CRS.EPSG3857;
        const c = crs.project(L.latLng(kk.place.c[0], kk.place.c[1])), q = crs.project(rt.getLatLng());
        const k = 1 / Math.cos(kk.place.c[0] * Math.PI / 180);
        const ratio = kk.H / kk.W, dx = q.x - c.x, dy = q.y - c.y;
        kk.place.rot = Math.atan2(dy, dx) - Math.atan2(ratio, 1);
        kk.place.w = Math.max(10, 2 * Math.hypot(dx, dy) / Math.sqrt(1 + ratio * ratio) / k);
        kk.dirty = true; kk.layer.update();
      });
      [mv, rt].forEach(h => h.on('dragend', renderKkCard));
      kk.handles = [mv, rt];
    }

    function startAdjust() { kk.adjusting = true; cancelDrawing(); placeHandles(); renderKkCard(); setStatus('Dra <b>✥</b> för att flytta kundkartan och <b>⟳</b> för att vrida och ändra storlek, tills husen ligger rätt. Tryck sedan <b>Spara läge</b>.'); }

    async function saveKkPlace() {
      const m = kkMap();
      const place = { ...kk.place, ...(() => { const c = kkCorners(kk.place); return { tl: c.tl, tr: c.tr, bl: c.bl }; })() };
      try {
        const res = await snoApi({ action: 'savePropertyMapPlace', id: currentProp.id, mapId: m.id, place });
        if (res.status !== 'success') throw new Error(res.message);
        m.place = res.place; kk.place = { ...res.place }; kk.dirty = false; kk.adjusting = false;
        placeHandles(); renderKkCard();
        setStatus('✅ Kundkartans läge sparat. Rita av zonerna, eller tryck <b>🤖 Föreslå zoner</b>.');
        return true;
      } catch (err) { setStatus('❌ ' + snoEscape(err.message || 'Kunde inte spara läget.')); return false; }
    }

    // AI läser kundkartan; punkterna (0–1000 i bilden) räknas om till kartan via hörnen
    async function analyzeKk() {
      const m = kkMap();
      if (kk.dirty || !m.place) { if (!(await saveKkPlace())) return; }
      const btn = document.getElementById('kk-ai');
      if (btn) btn.disabled = true;
      setStatus('🤖 AI:n läser kundens karta… (10–30 sekunder)');
      try {
        const res = await snoApi({ action: 'analyzePropertyMap', id: currentProp.id, mapId: m.id });
        if (res.status !== 'success') throw new Error(res.message);
        const c = m.place;
        const toLL = ([y, x]) => [c.tl[0] + (c.tr[0] - c.tl[0]) * x / 1000 + (c.bl[0] - c.tl[0]) * y / 1000,
                                   c.tl[1] + (c.tr[1] - c.tl[1]) * x / 1000 + (c.bl[1] - c.tl[1]) * y / 1000];
        const found = [];
        res.areas.forEach(a => { const coords = a.polygon.map(toLL); found.push({ type: a.type, coords, icon: a.type === 'hand' ? '🚶' : '🚜', what: a.name || (a.type === 'hand' ? 'Gångyta' : 'Köryta'), size: Math.round(snoGeodesicArea(coords)).toLocaleString('sv-SE') + ' m²', areaM2: snoGeodesicArea(coords) }); });
        res.points.forEach(p => found.push({ type: p.type, coords: [toLL(p.point)], icon: SNO_TYPES[p.type].icon, what: SNO_TYPES[p.type].label, size: '' }));
        found.forEach(sg => { sg.source = 'ai'; });
        suggestions = found.concat(suggestions.filter(sg => sg.source !== 'ai'));
        renderSuggestions();
        setStatus(found.length ? `🤖 ${found.length} förslag från kundkartan. Kontrollera mot kartan – <b>Ta med</b> det som stämmer.` : 'AI:n hittade inga ytor på kartan. Rita av den själv.');
      } catch (err) { setStatus('❌ ' + snoEscape(err.message || 'AI:n svarade inte.')); }
      if (btn) btn.disabled = false;
    }

    function renderKkCard() {
      const el = document.getElementById('kk-card');
      const m = kkMap();
      if (!currentProp) { el.style.display = 'none'; return; }
      el.style.display = 'flex';
      if (!m) { el.innerHTML = `<div class="slinga-card-head"><span>🏠 ${snoEscape(currentProp.address)}</span></div><div class="status">${snoEscape(currentProp.kund || '')} Ingen kundkarta – rita från satellitbilden.</div>${progressHtml()}`; return; }
      el.innerHTML = `<div class="slinga-card-head"><span>📄 Kundkarta</span><small>${snoEscape(currentProp.kund || '')}</small></div>
        ${currentProp.maps.length > 1 ? `<div class="chips">${currentProp.maps.map((x, i) => `<button class="chip ${i === kk.idx ? 'on' : ''}" onclick="kk.idx=${i}; showCustomerMap()">${snoEscape(x.label || 'Karta ' + (i + 1))}</button>`).join('')}</div>` : `<div class="status">${snoEscape(m.label)}</div>`}
        <div><label for="kk-op">Genomskinlighet</label><input id="kk-op" type="range" min="0.15" max="1" step="0.05" value="${kk.opacity}" oninput="kk.opacity=Number(this.value); kk.hidden=false; kk.layer && kk.layer.update()"></div>
        <div class="kk-row">
          ${kk.adjusting ? `<button class="ok" onclick="saveKkPlace()">💾 Spara läge</button>` : `<button onclick="startAdjust()">✋ Justera läge</button>`}
          <button onclick="kk.hidden=!kk.hidden; kk.layer && kk.layer.update(); renderKkCard()">${kk.hidden ? '👁 Visa' : '🙈 Dölj'}</button>
        </div>
        <button id="kk-ai" onclick="analyzeKk()" ${kk.adjusting && !kk.dirty && !m.place ? 'disabled' : ''}>🤖 Föreslå zoner från kundkartan</button>
        ${currentProp.note ? `<div class="status" style="font-size:12px">${snoEscape(currentProp.note)}</div>` : ''}
        ${progressHtml()}`;
    }

    function dropSuggestion(i) { suggestions.splice(i, 1); renderSuggestions(); }

    mapCtl = snoCreateMap('map');
    map = mapCtl.map;
    map.on('click', onMapClick);
    if (!snoIsAdmin()) document.getElementById('admin-banner').style.display = 'block';
    renderTools();
    loadZones();
    if (snoIsAdmin()) { loadStaff(); loadProperties(); }
  </script>
</body>
</html>
