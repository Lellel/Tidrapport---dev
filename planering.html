<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snöplanering</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Snöplaneringen i Radarns stil (docs/snoplanering.md, 2026-11-06):
   traktorremsan där Radarns orderbok är, kulpåsen (förare + handskottare) till vänster,
   fastigheterna som kort på planeringsytan. Tre vyer: Fastigheter, Traktorer, Karta. */
:root {
  --bg: var(--t-bg); --panel: var(--t-panel); --panel2: var(--t-card); --line: var(--t-line); --fg: var(--t-text); --muted: var(--t-muted);
  --accent: var(--t-accent); --ok: var(--t-ok); --warn: var(--t-warn); --bad: var(--t-danger);
  --stor: #f97316; --liten: #38bdf8; --hand: #a78bfa;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.35 var(--t-font); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-rows: auto auto 1fr; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
/* Listen */
.top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top h1 { font-size: var(--t-fs-title); margin: 0 8px 0 2px; white-space: nowrap; }
.seg { display: inline-flex; background: var(--panel2); border-radius: var(--t-r); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 7px 11px; border-radius: var(--t-r); font-size: 13px; font-weight: 600; color: var(--muted); min-height: 36px; }
.seg button.on { background: var(--accent); color: var(--t-on-accent); }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: var(--t-r); padding: 7px 12px; font-weight: 600; font-size: 13px; min-height: 38px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--t-on-accent); }
.btn.on { background: var(--accent); border-color: var(--accent); color: var(--t-on-accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.period { font-weight: 700; font-size: 14px; min-width: 130px; text-align: center; white-space: nowrap; }
.search { border: 1px solid var(--line); background: var(--panel2); color: var(--fg); border-radius: var(--t-r); padding: 7px 10px; font-size: 14px; min-height: 38px; width: 170px; }
.sfchip { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sfchip b { color: var(--fg); }
.warnline { font-size: 12px; white-space: nowrap; }
.warnline .bad { color: var(--warn); font-weight: 700; }
.warnline .good { color: var(--ok); font-weight: 700; }
.status { font-size: 12px; color: var(--muted); margin-left: auto; min-width: 60px; text-align: right; }
.status.err { color: var(--bad); }
.top a.link { color: var(--accent); font-weight: 700; font-size: 13px; text-decoration: none; white-space: nowrap; }
/* Traktorremsan (där Radarns orderbok är) */
.order { display: flex; gap: 10px; align-items: stretch; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; min-height: 92px; }
.order.hidden { display: none; }
.order .title { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; flex: none; }
.order .owner { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 700; color: var(--muted); border-left: 1px solid var(--line); padding-left: 4px; flex: none; text-align: center; }
.order.drop-ok { outline: 2px dashed var(--accent); outline-offset: -4px; }
.order .more { flex: none; align-self: center; }
.order .empty { color: var(--muted); font-size: 13px; align-self: center; }
.tchip { flex: none; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; font-size: 11px; color: var(--muted); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; border-radius: var(--t-r); padding: 4px 2px; cursor: grab; }
.tchip b { color: var(--fg); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 88px; }
.tchip .drv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 88px; }
.tchip .drv.none { color: var(--warn); font-weight: 700; }
.tchip.drop-ok { background: rgba(56, 189, 248, .15); outline: 2px solid var(--accent); }
.tchip.inactive { opacity: .45; }
/* Kulor */
.kula { position: relative; border-radius: 50%; overflow: hidden; flex-shrink: 0; display: grid; place-items: center; font-weight: 800; color: #fff;
  background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.8), var(--kc, #64748b) 40%, rgba(0,0,0,.55) 100%);
  box-shadow: inset 0 -4px 10px rgba(0,0,0,.4), 0 3px 8px rgba(0,0,0,.4); }
.kula img { width: 100%; height: 100%; object-fit: cover; }
.kula.hk { --kc: var(--hand); color: #1e1b4b; }
.kula.grey { filter: grayscale(1); opacity: .6; }
.kula .chk { position: absolute; right: 0; bottom: 0; background: var(--ok); color: #fff; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; display: grid; place-items: center; }
.ring { position: absolute; inset: -4px; border-radius: 50%; border: 3px solid var(--ok); pointer-events: none; }
/* Huvudytan */
.main { display: grid; grid-template-columns: auto 1fr; min-height: 0; }
.side { width: 210px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
.side.hidden { display: none; }
.side.drop-ok { outline: 2px dashed var(--accent); outline-offset: -4px; }
.side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.side .ownr { font-size: 11px; font-weight: 700; margin: 4px 0; }
.orbs { display: flex; flex-wrap: wrap; gap: 8px; }
.orbwrap { width: 56px; display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; }
.orbwrap small { font-size: 10px; color: var(--muted); max-width: 56px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.busylist { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.busylist summary { cursor: pointer; font-weight: 700; color: var(--fg); }
.busylist div { padding-left: 4px; }
.hint { font-size: 11px; color: var(--muted); }
.area { overflow: auto; position: relative; overscroll-behavior: contain; padding: 10px 12px 30px; }
.area.mapmode { padding: 0; overflow: hidden; }
#map { height: 100%; width: 100%; }
/* Fastighetsvyn: kort i rutnät */
.grp { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; }
.grp.wait { color: var(--warn); }
.grp:first-child { margin-top: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; }
.pcard { background: var(--panel2); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: var(--t-r); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.pcard.done { border-left-color: var(--ok); }
.pcard.part { border-left-color: var(--warn); }
.pcard.flash { box-shadow: 0 0 0 3px var(--accent); }
.pcard.drop-ok { outline: 3px solid var(--accent); }
.pcard.drop-bad { outline: 3px solid var(--bad); }
.pcard .t { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .m { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .w { font-size: 11px; color: var(--warn); font-weight: 700; }
.kulrad { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hole { border-radius: 50%; border: 3px dashed var(--line); display: grid; place-items: center; flex-shrink: 0; position: relative; font-size: 14px; color: var(--muted); }
.hole.stor { width: 46px; height: 46px; border-color: var(--stor); }
.hole.liten { width: 36px; height: 36px; border-color: var(--liten); }
.hole.none { width: 40px; height: 40px; border-color: var(--bad); font-size: 11px; }
.hole.empty { background: rgba(239,68,68,.15); border-color: var(--bad); border-style: solid; }
.hole.filled { border-style: solid; }
.hole.forced::after { content: '💪'; position: absolute; top: -8px; right: -10px; font-size: 12px; }
.slot { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--hand); display: grid; place-items: center; color: var(--hand); font-weight: 800; flex-shrink: 0; font-size: 13px; }
.slot.need { border-color: var(--warn); color: var(--warn); }
.hole.drop-ok, .slot.drop-ok { outline: 3px solid var(--accent); outline-offset: 2px; }
.hole.drop-bad { outline: 3px solid var(--bad); outline-offset: 2px; }
.drvname { font-size: 11px; color: var(--muted); max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drag { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; }
/* Traktorvyn: en rad per traktor */
.lane { display: flex; gap: 10px; align-items: stretch; border-bottom: 1px solid var(--line); padding: 8px 0; min-height: 76px; }
.lane.drop-ok { background: rgba(56, 189, 248, .08); }
.lane.drop-bad { background: rgba(239, 68, 68, .08); }
.lane .lab { width: 170px; flex: none; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.lane .lab span { font-size: 13px; font-weight: 700; min-width: 0; }
.lane .lab em { display: block; font-style: normal; font-size: 11px; color: var(--muted); font-weight: 400; }
.lane.wait .lab span { color: var(--warn); }
.lane .lcards { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-width: 0; }
.lane .sum { width: 120px; flex: none; font-size: 11px; color: var(--muted); text-align: right; align-self: center; }
.lane .sum b { color: var(--fg); font-size: 13px; display: block; }
.mcard { background: var(--panel2); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--t-r); padding: 5px 8px; font-size: 12px; max-width: 200px; }
.mcard b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard span { color: var(--muted); font-size: 11px; }
.mcard.done { border-left-color: var(--ok); }
.mcard.part { border-left-color: var(--warn); }
.empty { color: var(--muted); font-size: 13px; padding: 30px; text-align: center; }
/* Kartan */
.mk { position: relative; border-radius: 50%; }
.mk.empty { border: 3px solid var(--bad); background: rgba(239,68,68,.3); }
.mk.done { box-shadow: 0 0 0 3px var(--ok); }
.mk.part { box-shadow: 0 0 0 3px var(--warn); }
.mk i { position: absolute; right: -8px; top: -6px; background: var(--hand); color: #1e1b4b; font-style: normal; font-weight: 800; font-size: 10px; border-radius: 9px; padding: 0 4px; border: 1px solid #fff; }
.mk.drop-ok { outline: 3px solid var(--accent); outline-offset: 3px; }
/* Dra */
.ghost { position: fixed; z-index: 200; pointer-events: none; opacity: .92; transform: translate(-50%, -60%) scale(1.08); }
/* Detaljrutan (som jobbrutan i Radarn) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: none; }
.sheet-bg.open { display: block; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 51; padding: max(16px, env(safe-area-inset-top)) 16px calc(env(safe-area-inset-bottom) + 16px); overflow-y: auto;
  transform: translateX(100%); transition: transform .2s; }
.sheet.open { transform: none; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet .sub { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
.sheet h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.sheet .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.sheet .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .row2 > * { flex: 1; }
.sheet textarea, .sheet input, .sheet select { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: var(--t-r); padding: 9px 10px; font-size: 15px; }
.sheet textarea { min-height: 64px; resize: vertical; font: inherit; }
.krow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.krow .who { flex: 1; min-width: 0; font-size: 13px; }
.krow .who em { display: block; font-style: normal; color: var(--muted); font-size: 12px; }
.krow .x { border: 0; background: var(--bad); color: #fff; border-radius: 99px; font-size: 11px; padding: 3px 8px; }
.krow .st { font-size: 12px; }
.krow .st.ok { color: var(--ok); font-weight: 700; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.thumbs a { aspect-ratio: 1; border-radius: var(--t-r); overflow: hidden; background: var(--bg); display: block; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.sizes { display: flex; gap: 6px; }
.sizes button { flex: 1; }
.sizes .on.stor { background: var(--stor); border-color: var(--stor); color: #111; }
.sizes .on.liten { background: var(--liten); border-color: var(--liten); color: #111; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #7f1d1d; color: #fff; padding: 12px 16px; border-radius: var(--t-r); z-index: 120; font-weight: 600; display: none; max-width: 92vw; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.toast.ok { background: #065f46; }
.toast button { margin-left: 10px; border: 0; background: #fff; color: #065f46; border-radius: var(--t-r); padding: 6px 10px; font-weight: 800; }
@media (max-width: 800px) { .side { width: 150px; } .search { width: 120px; } .lane .lab { width: 120px; } .lane .sum { width: 80px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="lpv-back" href="index.html"><span data-icon="tillbaka">←</span> Hem</a>
    <h1><span data-icon="sno">❄️</span> Snöplanering</h1>
    <div class="seg" id="viewseg"><button data-v="props">🏠 Fastigheter</button><button data-v="tractors">🚜 Traktorer</button><button data-v="map">🗺️ Karta</button></div>
    <button class="btn" id="prev" aria-label="Föregående kommundel">‹</button><span class="period" id="period"></span><button class="btn" id="next" aria-label="Nästa kommundel">›</button>
    <input class="search" id="search" list="searchlist" placeholder="🔍 Sök adress/kund" autocomplete="off"><datalist id="searchlist"></datalist>
    <span class="sfchip" id="sfchip"></span>
    <button class="btn" id="newSf">❄️ Nytt snöfall</button>
    <span class="warnline" id="warnline"></span>
    <button class="btn" id="tglSide">Kulpåse</button>
    <button class="btn" id="tglOrder">Traktorer</button>
    <a class="link" href="snoregister.html">⚙️ Register</a>
    <span data-theme-slot></span>
    <span class="status" id="status"></span>
  </div>
  <div class="order" id="order"></div>
  <div class="main">
    <aside class="side" id="side"></aside>
    <div class="area" id="area"><div id="cardsview"></div><div id="map" hidden></div></div>
  </div>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<aside class="sheet" id="sheet" aria-label="Detaljer"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="knappar.js"></script>
<script src="inloggning.js"></script>
<script src="sasong.js"></script>
<script src="sno.js"></script>
<script>
// ===== Data =====
let properties = [], fleet = [], people = [], zonesAll = [], avatars = {}, snowfall = null, doneList = [];
let view = 'props', kommundel = '', showOthers = false, loaded = false;
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* privat/fullt */ } } };
view = ['props', 'tractors', 'map'].includes(store.get('lpv_plan_view')) ? store.get('lpv_plan_view') : 'props';
kommundel = store.get('lpv_plan_kd') || '';
const $ = (id) => document.getElementById(id);
const esc = snoEscape;
const sv = (a, b) => String(a).localeCompare(String(b), 'sv');

const kdOf = (p) => String(p.omrade || p.ort || 'Utan område').trim();
const propById = (id) => properties.find(p => p.id === id);
const tractorById = (id) => fleet.find(t => t.id === id);
const personByName = (n) => people.find(x => x.name === n) || { name: n, owner: 'Egna', active: true, lat: null, lng: null };
const ownerLabel = (o) => !o || o === 'Egna' ? '🏠 Egna' : '🤝 ' + o;
const m2 = (v) => Math.round(v).toLocaleString('sv-SE') + ' m²';
function kommundelar() { return [...new Set(properties.map(kdOf))].sort(sv); }
function currentKd() { const l = kommundelar(); if (!l.includes(kommundel)) kommundel = l[0] || ''; return kommundel; }
const kdProps = (kd = currentKd()) => properties.filter(p => kdOf(p) === kd);

// Ytor per fastighet ur Rita zoner
let zoneCache = null;
function zoneStats(p) {
  if (!zoneCache) {
    zoneCache = {};
    zonesAll.forEach(z => { const o = zoneCache[snoAddrKey(z.property)] || (zoneCache[snoAddrKey(z.property)] = { maskin: 0, hand: 0 });
      if (z.type === 'maskin' || z.type === 'hand') o[z.type] += Number(z.areaM2) || 0; });
  }
  return zoneCache[snoAddrKey(p.address)] || { maskin: 0, hand: 0 };
}

// Status i pågående snöfall
const partsOf = (p) => (p.tractorId ? [{ part: 'traktor', unit: p.tractorId }] : []).concat((p.shovelers || []).map(n => ({ part: 'hand', unit: n })));
const doneOf = (p, part, unit) => doneList.find(d => d.propertyId === p.id && d.part === part && d.unit === unit);
function stateOf(p) {
  const parts = partsOf(p), n = parts.filter(x => doneOf(p, x.part, x.unit)).length;
  return !parts.length || !n ? '' : n === parts.length ? 'done' : 'part';
}
const fits = (t, p) => !(t.size === 'stor' && p.size === 'liten' && !p.forced);
const needsHand = (p) => zoneStats(p).hand > 0 && !(p.shovelers || []).length;

// Var en kula hör hemma (för avstånd och "stationerad")
function centroid(list) {
  const pts = list.filter(p => p.lat !== null && p.lat !== undefined);
  return pts.length ? [pts.reduce((s, p) => s + p.lat, 0) / pts.length, pts.reduce((s, p) => s + p.lng, 0) / pts.length] : null;
}
function baseMatches(base, kd) {
  const b = String(base || '').trim().toLowerCase(), k = kd.toLowerCase();
  return !!b && (b === k || (b.length > 3 && (k.includes(b) || b.includes(k))) || kdProps(kd).some(p => String(p.ort || '').toLowerCase() === b));
}
function tractorHome(t) {
  const there = properties.filter(p => baseMatches(t.base, kdOf(p)));
  return centroid(there) || centroid(properties.filter(p => p.tractorId === t.id));
}
const personHome = (x) => x.lat !== null && x.lat !== undefined ? [x.lat, x.lng] : centroid(properties.filter(p => (p.shovelers || []).includes(x.name)));
const distTo = (home, c) => home && c ? snoDistance(home, c) : 1e12;

// ===== Kulor =====
const BRAND = { kramer: '#2dd4bf', volvo: '#facc15', avant: '#84cc16', bobcat: '#f97316', jcb: '#facc15', 'john deere': '#16a34a', deere: '#16a34a', kubota: '#f97316', valtra: '#dc2626', 'new holland': '#2563eb', massey: '#dc2626', fendt: '#22c55e', cat: '#facc15' };
const brandColor = (m) => { const s = String(m).toLowerCase(); const k = Object.keys(BRAND).find(x => s.includes(x)); return k ? BRAND[k] : '#64748b'; };
const shortModel = (t) => String(t.model).split(/\s+/).slice(0, 2).join(' ');
const initials = (n) => String(n).split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
function tKula(t, px, chk) {
  const inner = t.avatarUrl ? `<img src="${esc(t.avatarUrl)}" alt="">` : '🚜';
  return `<div class="kula${t.active === false ? ' grey' : ''}" style="width:${px}px;height:${px}px;font-size:${Math.round(px * .45)}px;--kc:${brandColor(t.model)}">${inner}${chk ? '<span class="chk">✓</span>' : ''}</div>`;
}
function pKula(name, px, chk) {
  const av = avatars[name], x = personByName(name);
  return `<div class="kula hk${x.active === false ? ' grey' : ''}" style="width:${px}px;height:${px}px;font-size:${Math.round(px * .36)}px">${av ? `<img src="${esc(av)}" alt="">` : esc(initials(name))}${chk ? '<span class="chk">✓</span>' : ''}</div>`;
}

// ===== Listen =====
function renderTop() {
  document.querySelectorAll('#viewseg button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const kd = currentKd(), list = kdProps(kd);
  $('period').textContent = kd ? `${kd} (${list.length})` : '–';
  const assigned = list.filter(p => partsOf(p).length), doneN = assigned.filter(p => stateOf(p) === 'done').length;
  $('sfchip').innerHTML = snowfall ? `❄️ Snöfall ${esc(snowfall.start.slice(5))} · <b>${doneN}/${assigned.length}</b> klara` : '❄️ Inget snöfall';
  const noT = list.filter(p => !p.tractorId).length, noH = list.filter(needsHand).length;
  const tr = fleet.filter(t => t.active !== false && list.some(p => p.tractorId === t.id));
  const noDrv = tr.filter(t => !t.driver).length;
  const badPeople = new Set();
  list.forEach(p => (p.shovelers || []).forEach(n => { if (personByName(n).active === false) badPeople.add(n); }));
  tr.forEach(t => { if (t.driver && personByName(t.driver).active === false) badPeople.add(t.driver); });
  const parts = [noT ? `<span class="bad">⚠️ ${noT} utan traktor</span>` : '<span class="good">✅ Alla har traktor</span>'];
  if (noH) parts.push(`<span class="bad">⚠️ ${noH} saknar handskottare</span>`);
  if (noDrv) parts.push(`<span class="bad">⚠️ ${noDrv} traktor utan förare</span>`);
  if (badPeople.size) parts.push(`<span class="bad">⚠️ ${[...badPeople].map(esc).join(', ')} inaktiv</span>`);
  $('warnline').innerHTML = list.length ? parts.join(' · ') : '';
  $('searchlist').innerHTML = properties.map(p => `<option value="${esc(p.address)}">${esc([p.kund, kdOf(p)].filter(Boolean).join(' · '))}</option>`).join('');
}

// ===== Traktorremsan =====
function tractorCounts(t, kd) {
  const mine = properties.filter(p => p.tractorId === t.id), here = mine.filter(p => kdOf(p) === kd);
  const done = here.filter(p => doneOf(p, 'traktor', t.id)).length;
  return { here: here.length, all: mine.length, done };
}
function tchip(t, kd, extra) {
  const c = tractorCounts(t, kd);
  const drvBad = t.driver && personByName(t.driver).active === false;
  const count = c.all === c.here ? `${c.here}` : `${c.here} (av ${c.all})`;
  return `<div class="tchip drag${t.active === false ? ' inactive' : ''}" data-drag="tractor" data-id="${esc(t.id)}" data-drop="tractor" data-tid="${esc(t.id)}">
    ${tKula(t, t.size === 'stor' ? 46 : 36)}
    <b>${esc(shortModel(t))}</b>
    <span class="drv${t.driver ? '' : ' none'}">${t.driver ? (drvBad ? '⚠️ ' : '👷 ') + esc(t.driver) : '⚠️ ingen förare'}</span>
    <span>${extra ? extra + ' · ' : ''}${count} st${snowfall && c.here ? ` · ${c.done}/${c.here}` : ''}</span></div>`;
}
function renderOrder() {
  const kd = currentKd(), center = centroid(kdProps(kd));
  const act = fleet.filter(t => t.active !== false);
  const here = act.filter(t => baseMatches(t.base, kd) || properties.some(p => p.tractorId === t.id && kdOf(p) === kd));
  const others = act.filter(t => !here.includes(t)).map(t => ({ t, d: distTo(tractorHome(t), center) })).sort((a, b) => a.d - b.d);
  const owners = [...new Set(here.map(t => t.owner || 'Egna'))].sort((a, b) => (a !== 'Egna') - (b !== 'Egna') || sv(a, b));
  let h = '<div class="title">Traktorer</div>';
  owners.forEach(o => { h += `<div class="owner">${esc(ownerLabel(o))}</div>` + here.filter(t => (t.owner || 'Egna') === o).map(t => tchip(t, kd)).join(''); });
  if (!here.length) h += `<div class="empty">Ingen traktor står i ${esc(kd)}. Sätt Ort / uppställning i ⚙️ Register – eller låna under ⋯</div>`;
  if (others.length) {
    h += `<button class="btn more" id="othersBtn">${showOthers ? '◂' : '⋯'} Övriga (${others.length})</button>`;
    if (showOthers) h += others.map(x => tchip(x.t, kd, x.d < 1e11 ? snoFormatDistance(x.d) : '')).join('');
  }
  $('order').innerHTML = h;
  const ob = $('othersBtn'); if (ob) ob.onclick = () => { showOthers = !showOthers; render(); };
}

// ===== Kulpåsen: förare + handskottare =====
function renderSide() {
  const kd = currentKd(), center = centroid(kdProps(kd));
  const active = people.filter(x => x.active !== false);
  const driving = {};
  fleet.forEach(t => { if (t.driver) driving[t.driver] = t; });
  const drivers = active.filter(x => !driving[x.name] && (x.role === 'Förare' || x.role === 'UE') && !x.shoveler);
  const hands = active.filter(x => x.shoveler).map(x => ({ x, d: distTo(personHome(x), center) })).sort((a, b) => a.d - b.d || sv(a.x.name, b.x.name));
  const group = (list, ownerOf, html) => {
    const owners = [...new Set(list.map(ownerOf))].sort((a, b) => (a !== 'Egna') - (b !== 'Egna') || sv(a, b));
    return owners.map(o => `<div class="ownr">${esc(ownerLabel(o))}</div><div class="orbs">${list.filter(i => ownerOf(i) === o).map(html).join('')}</div>`).join('');
  };
  const orb = (name, sub, kind) => `<div class="orbwrap drag" data-drag="person" data-kind="${kind}" data-id="${esc(name)}">${pKula(name, 44)}<small>${esc(name.split(' ')[0])}</small>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  const busy = Object.keys(driving).filter(n => personByName(n).active !== false).sort(sv);
  $('side').innerHTML = `
    <div><h3>👷 Förare</h3>${drivers.length ? group(drivers, x => x.owner || 'Egna', x => orb(x.name, '', 'driver')) : '<div class="hint">Alla förare sitter på en traktor.</div>'}
      ${busy.length ? `<details class="busylist" ${store.get('lpv_plan_busy') === 'open' ? 'open' : ''} ontoggle="store.set('lpv_plan_busy', this.open ? 'open' : '')"><summary>Upptagna (${busy.length})</summary>${busy.map(n => `<div class="drag" data-drag="person" data-kind="driver" data-id="${esc(n)}" data-from-tractor="${esc(driving[n].id)}">👷 ${esc(n)} → ${esc(shortModel(driving[n]))}</div>`).join('')}</details>` : ''}
      <div class="hint" style="margin-top:6px">Dra föraren till en traktor i remsan.</div></div>
    <div><h3>🧹 Handskottare – närmast först</h3>${hands.length ? group(hands, h => h.x.owner || 'Egna', h => orb(h.x.name, h.d < 1e11 ? snoFormatDistance(h.d) : '', 'hand')) : '<div class="hint">Bocka i Handskottare på Personal-sidan.</div>'}</div>
    <div class="hint">Dra en kula hit för att ta bort den från kortet eller traktorn.</div>`;
}

// ===== Fastighetsvyn =====
function cardHtml(p) {
  const t = p.tractorId ? tractorById(p.tractorId) : null, zs = zoneStats(p), st = stateOf(p);
  const holeCls = `hole ${p.size || 'none'}${t ? ' filled' : ' empty'}${p.forced && t && t.size === 'stor' ? ' forced' : ''}`;
  const hole = `<div class="${holeCls}" data-drop="hole" data-pid="${esc(p.id)}">${t
    ? `<div class="drag" data-drag="tractor" data-id="${esc(t.id)}" data-from="${esc(p.id)}">${tKula(t, p.size === 'liten' ? 30 : 38, !!doneOf(p, 'traktor', t.id))}</div>` : (p.size ? '' : '?')}</div>`;
  const drv = t ? `<span class="drvname">${t.driver ? '👷 ' + esc(t.driver) : '⚠️ ingen förare'}</span>` : '';
  const hands = (p.shovelers || []).map(n => `<div class="drag" data-drag="person" data-kind="hand" data-id="${esc(n)}" data-from="${esc(p.id)}" title="${esc(n)}">${pKula(n, 30, !!doneOf(p, 'hand', n))}</div>`).join('');
  const slot = zs.hand > 0 || (p.shovelers || []).length ? `<div class="slot${needsHand(p) ? ' need' : ''}" data-drop="slot" data-pid="${esc(p.id)}">${(p.shovelers || []).length ? '＋' : '🧹'}</div>` : '';
  const warns = [needsHand(p) ? '🧹⚠️ saknar handskottare' : '', !p.size ? '⚠️ storlek saknas' : '',
    t && t.driver && personByName(t.driver).active === false ? `⚠️ ${esc(t.driver)} inaktiv` : '',
    ...(p.shovelers || []).filter(n => personByName(n).active === false).map(n => `⚠️ ${esc(n)} inaktiv`)].filter(Boolean);
  return `<div class="pcard ${st}" id="c-${esc(p.id)}" data-card="${esc(p.id)}" data-drop="card" data-pid="${esc(p.id)}">
    <div class="t">${p.priority ? '⭐ ' : ''}${esc(p.address)}${p.zoneStatus === 'klar' ? ' ✅' : ''}</div>
    <div class="m">${[esc(p.kund), zs.maskin ? '🔵 ' + m2(zs.maskin) : '', zs.hand ? '🟠 ' + m2(zs.hand) : '', !zs.maskin && !zs.hand ? 'inga zoner' : ''].filter(Boolean).join(' · ')}</div>
    <div class="kulrad">${hole}${drv}${hands}${slot}</div>

function renderProps() {
  const list = kdProps();
  if (!list.length) return '<div class="empty">Inga fastigheter här. Lägg till i ⚙️ Register.</div>';
  const wait = list.filter(p => !p.tractorId).sort((a, b) => sv(a.address, b.address));
  const rest = list.filter(p => p.tractorId);
  let h = wait.length ? `<div class="grp wait">⚠️ Väntar på traktor (${wait.length})</div><div class="cards">${wait.map(cardHtml).join('')}</div>` : '';
  const orter = [...new Set(rest.map(p => p.ort || ''))].sort(sv);
  orter.forEach(o => {
    const ps = rest.filter(p => (p.ort || '') === o).sort((a, b) => sv(a.address, b.address));
    h += `<div class="grp">${esc(o || 'Utan ort')} (${ps.length})</div><div class="cards">${ps.map(cardHtml).join('')}</div>`;
  });
  return h + '<div class="hint" style="margin-top:14px">Dra en traktor från remsan till hålet, en handskottare till 🧹. Tryck på ett kort för detaljer.</div>';
}

// ===== Traktorvyn =====
function miniCard(p) {
  return `<div class="mcard drag ${stateOf(p)}" data-drag="prop" data-id="${esc(p.id)}" data-card="${esc(p.id)}"><b>${p.priority ? '⭐ ' : ''}${esc(p.address)}</b><span>${p.size === 'stor' ? '🟠' : p.size === 'liten' ? '🔵' : '?'} ${zoneStats(p).maskin ? m2(zoneStats(p).maskin) : 'inga zoner'}${(p.shovelers || []).length ? ' · 🧹' + p.shovelers.length : ''}</span></div>`;
}
function renderTractors() {
  const kd = currentKd(), list = kdProps(kd);
  if (!list.length) return '<div class="empty">Inga fastigheter här.</div>';
  const wait = list.filter(p => !p.tractorId).sort((a, b) => sv(a.address, b.address));
  let h = `<div class="lane wait" data-drop="lane" data-tid=""><div class="lab"><span>⚠️ Utan traktor<em>${wait.length} fastigheter</em></span></div>
    <div class="lcards">${wait.map(miniCard).join('') || '<span class="hint">✅ Alla har traktor</span>'}</div><div class="sum"></div></div>`;
  const act = fleet.filter(t => t.active !== false);
  // ⋯ Övriga öppen i remsan → de lånade traktorerna får också en rad
  const here = act.filter(t => showOthers || baseMatches(t.base, kd) || list.some(p => p.tractorId === t.id));
  here.sort((a, b) => (a.owner || 'Egna').localeCompare(b.owner || 'Egna', 'sv') || sv(a.model, b.model)).forEach(t => {
    const ps = list.filter(p => p.tractorId === t.id).sort((a, b) => sv(a.address, b.address));
    const area = ps.reduce((s, p) => s + zoneStats(p).maskin, 0), c = tractorCounts(t, kd);
    h += `<div class="lane" data-drop="lane" data-tid="${esc(t.id)}">
      <div class="lab" data-tractor-sheet="${esc(t.id)}">${tKula(t, t.size === 'stor' ? 40 : 32)}<span>${esc(shortModel(t))}<em>${t.driver ? '👷 ' + esc(t.driver) : '⚠️ ingen förare'}${t.owner && t.owner !== 'Egna' ? ' · ' + esc(t.owner) : ''}</em></span></div>
      <div class="lcards">${ps.map(miniCard).join('') || '<span class="hint">Dra fastigheter hit</span>'}</div>
      <div class="sum"><b>${ps.length} ${ps.length === 1 ? 'fastighet' : 'fastigheter'}</b>${area ? m2(area) : ''}${snowfall && ps.length ? `<br>${c.done}/${ps.length} klara` : ''}</div></div>`;
  });
  return h + '<div class="hint" style="margin-top:10px">Dra en fastighet till en traktors rad. Tillbaka till "Utan traktor" tar bort traktorn.</div>';
}

// ===== Kartvyn =====
let mapCtl = null, map = null, pins = [];
function ensureMap() {
  if (map) { setTimeout(() => map.invalidateSize(), 50); return; }
  mapCtl = snoCreateMap('map'); map = mapCtl.map;
}
function renderMapPins(fit) {
  if (!map || SNO_MAP_MISSING) return;
  pins.forEach(l => map.removeLayer(l));
  pins = kdProps().filter(p => p.lat !== null).map(p => {
    const t = p.tractorId ? tractorById(p.tractorId) : null, px = p.size === 'liten' ? 26 : 32, n = (p.shovelers || []).length;
    const html = `<div class="mk ${t ? stateOf(p) : 'empty'}" data-drop="pin" data-pid="${esc(p.id)}" style="width:${px}px;height:${px}px">${t ? tKula(t, px) : ''}${n ? `<i>🧹${n > 1 ? n : ''}</i>` : ''}</div>`;
    const m = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html, iconSize: [px, px] }) }).addTo(map);
    m.bindTooltip(`${esc(p.address)}${t ? ' · ' + esc(t.model) + (t.driver ? ' (' + esc(t.driver) + ')' : '') : ' · ingen traktor'}${n ? ' · 🧹 ' + p.shovelers.map(esc).join(', ') : ''}`);
    m.on('click', () => openSheet(p.id));
    return m;
  });
  if (fit) { const pts = kdProps().filter(p => p.lat !== null).map(p => [p.lat, p.lng]); if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 16 }); }
}

// ===== Rita allt =====
function render(fitMap) {

}
function setView(v) { view = v; store.set('lpv_plan_view', v); render(true); }
function setKd(kd) { kommundel = kd; store.set('lpv_plan_kd', kd); showOthers = false; render(true); $('area').scrollTop = 0; }
function stepKd(dir) { const l = kommundelar(); if (!l.length) return; const i = l.indexOf(currentKd()); setKd(l[(i + dir + l.length) % l.length]); }

// ===== Spara =====
function setStatus(t, err) { const s = $('status'); s.textContent = t; s.className = 'status' + (err ? ' err' : ''); }
let toastT;
function toast(html, ok, action) {
  const el = $('toast');
  el.innerHTML = html + (action ? ` <button id="toastAct">${action.label}</button>` : '');
  el.className = 'toast' + (ok ? ' ok' : ''); el.style.display = 'block';
  if (action) $('toastAct').onclick = () => { el.style.display = 'none'; action.run(); };
  clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = 'none'; }, action ? 9000 : ok ? 2200 : 5000);
}
async function assign(pid, changes) {
  const p = propById(pid);
  if (!p) return false;
  const before = { tractorId: p.tractorId || '', shovelers: [...(p.shovelers || [])] };
  Object.assign(p, changes); render();
  setStatus('Sparar…');
  try {
    const res = await snoApi({ action: 'assignSnow', propertyId: pid, ...changes });
    if (res.status !== 'success') throw new Error(res.message || 'Kunde inte spara.');
    p.tractorId = res.property.tractorId; p.shovelers = res.property.shovelers;
    setStatus('Sparat');
    return true;
  } catch (err) {
    Object.assign(p, before); render();
    setStatus('Fel', true); toast('❌ ' + esc(err.message));
    return false;
  }
}
async function saveTractor(t, changes) {
  const before = { ...t };
  Object.assign(t, changes); render();
  setStatus('Sparar…');
  try {
    const res = await snoApi({ action: 'saveTractor', tractor: t });
    if (res.status !== 'success') throw new Error(res.message || 'Kunde inte spara.');
    Object.assign(t, res.tractor); setStatus('Sparat'); render();
  } catch (err) { Object.assign(t, before); render(); setStatus('Fel', true); toast('❌ ' + esc(err.message)); }
}
async function saveProp(p, changes) {
  const before = { ...p };
  Object.assign(p, changes); render();
  setStatus('Sparar…');
  try {
    const res = await snoApi({ action: 'saveProperty', property: { ...p, manualPosition: true } });
    if (res.status !== 'success') throw new Error(res.message || 'Kunde inte spara.');
    Object.assign(p, res.property); setStatus('Sparat'); render();
  } catch (err) { Object.assign(p, before); render(); setStatus('Fel', true); toast('❌ ' + esc(err.message)); }
}

// Traktor på en fastighet + förslag: grannar inom 300 m utan traktor
async function putTractor(t, p, fromPid) {
  if (!p.size) { bounce(p.id); toast(`🚫 ${esc(p.address)} saknar storlek – välj stor/liten i detaljrutan.`); return; }
  if (!fits(t, p)) { bounce(p.id); toast(`🚫 ${esc(shortModel(t))} är stor – ${esc(p.address)} har ett litet hål.`); return; }
  if (p.tractorId === t.id) return;
  if (fromPid && fromPid !== p.id) assign(fromPid, { tractorId: '' });
  const ok = await assign(p.id, { tractorId: t.id });
  if (!ok || p.lat === null) return;
  const near = properties.filter(x => x.id !== p.id && !x.tractorId && x.lat !== null && kdOf(x) === kdOf(p) && x.size && fits(t, x) && snoDistance([p.lat, p.lng], [x.lat, x.lng]) <= 300);
  if (near.length) toast(`${near.length} ${near.length === 1 ? 'granne' : 'grannar'} inom 300 m saknar traktor (${near.slice(0, 3).map(x => esc(x.address)).join(', ')}${near.length > 3 ? ' …' : ''}).`, true,
    { label: `Lägg ${esc(shortModel(t))} där också`, run: async () => { for (const x of near) await assign(x.id, { tractorId: t.id }); toast(`✅ ${esc(shortModel(t))} lagd på ${near.length} till`, true); } });
}
function bounce(pid) {
  const el = document.querySelector(`#c-${CSS.escape(pid)} .hole`) || document.getElementById('c-' + pid);
  if (el && el.animate) el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 350 });
}

// ===== Dra och släpp (som i Radarn: dra = flytta, tryck = detaljer) =====
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-drag]');
  if (!el || e.button > 0 || el.closest('.sheet')) return;
  drag = { el, x: e.clientX, y: e.clientY, started: false, type: el.dataset.drag, id: el.dataset.id, kind: el.dataset.kind, from: el.dataset.from, fromTractor: el.dataset.fromTractor, pointerId: e.pointerId };
});
document.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.started = true;
    const src = drag.el.querySelector('.kula') || drag.el;
    const g = src.cloneNode(true); g.classList.add('ghost'); g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px';
    if (drag.type === 'prop') g.style.width = Math.min(drag.el.offsetWidth, 200) + 'px';
    document.body.appendChild(g); drag.ghost = g;
    drag.el.style.opacity = '.35';
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  highlight(e.clientX, e.clientY);
  // Rulla planeringsytan när man drar nära kanten
  const a = $('area'), r = a.getBoundingClientRect();
  if (e.clientX > r.left && e.clientX < r.right) { if (e.clientY > r.bottom - 50) a.scrollTop += 14; else if (e.clientY < r.top + 40 && e.clientY > r.top) a.scrollTop -= 14; }
}, { passive: false });
document.addEventListener('pointerup', (e) => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const d = drag; drag = null;
  clearHighlight();
  d.el.style.opacity = '';
  if (d.ghost) d.ghost.remove();
  if (!d.started) { tapOn(d); return; }
  drop(d, e.clientX, e.clientY);
});
document.addEventListener('pointercancel', () => { if (drag) { if (drag.ghost) drag.ghost.remove(); drag.el.style.opacity = ''; } drag = null; clearHighlight(); });
// Tryck på ett kort (utan att dra) öppnar detaljrutan; på en traktor öppnas traktorns ruta
document.addEventListener('click', (e) => {
  if (e.target.closest('.sheet, [data-drag]')) return;
  const ts = e.target.closest('[data-tractor-sheet]'); if (ts) { openTractorSheet(ts.dataset.tractorSheet); return; }
  const c = e.target.closest('[data-card]'); if (c) openSheet(c.dataset.card);
});
function tapOn(d) {
  if (d.type === 'tractor') openTractorSheet(d.id);
  else if (d.type === 'prop') openSheet(d.id);
  else if (d.from) openSheet(d.from);
  else if (d.fromTractor) openTractorSheet(d.fromTractor);
}

function targetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return {};
  const t = el.closest('[data-drop]');
  return { el: t, type: t && t.dataset.drop, pid: t && t.dataset.pid, tid: t && t.dataset.tid, order: el.closest('#order'), side: el.closest('#side'),
    card: el.closest('.pcard'), lane: el.closest('.lane'), map: el.closest('#map') };
}
function clearHighlight() { document.querySelectorAll('.drop-ok,.drop-bad').forEach(x => x.classList.remove('drop-ok', 'drop-bad')); }
// Vart kulan skulle hamna – samma regler för markering och släpp
function resolve(d, x, y) {
  const t = targetAt(x, y);
  if (d.type === 'tractor') {
    let pid = t.type === 'hole' || t.type === 'card' || t.type === 'pin' ? t.pid : t.card ? t.card.dataset.pid : null;
    if (!pid && t.map) pid = nearestPin(x, y);
    if (pid) { const p = propById(pid), tr = tractorById(d.id); return { act: 'putTractor', pid, ok: !!p.size && fits(tr, p), el: (t.card || document.getElementById('c-' + pid) || t.el)?.querySelector?.('.hole') || t.el }; }
    if (t.order && d.from) return { act: 'removeTractor', el: $('order') };
    return null;
  }
  if (d.type === 'person') {
    if (d.kind === 'driver' || d.fromTractor) {
      if (t.type === 'tractor') return { act: 'setDriver', tid: t.tid, ok: true, el: t.el };
      if (t.side && d.fromTractor) return { act: 'removeDriver', el: $('side') };
      return null;
    }
    let pid = t.type === 'slot' || t.type === 'card' || t.type === 'pin' ? t.pid : t.card ? t.card.dataset.pid : null;
    if (!pid && t.map) pid = nearestPin(x, y);
    if (pid) { const el = (document.getElementById('c-' + pid) || {}).querySelector?.('.slot') || t.el; return { act: 'putHand', pid, ok: true, el }; }
    if (t.side && d.from) return { act: 'removeHand', el: $('side') };
    return null;
  }
  if (d.type === 'prop' && t.lane) {
    const tid = t.lane.dataset.tid, p = propById(d.id);
    return { act: 'propToLane', tid, ok: !tid || (!!p.size && fits(tractorById(tid), p)), el: t.lane };
  }
  return null;
}
function highlight(x, y) {
  clearHighlight();
  const r = resolve(drag, x, y);
  if (r && r.el) r.el.classList.add(r.ok === false ? 'drop-bad' : 'drop-ok');
}
function nearestPin(x, y) {
  if (!map) return null;
  const r = $('map').getBoundingClientRect();
  let best = null;
  kdProps().filter(p => p.lat !== null).forEach(p => {
    const pt = map.latLngToContainerPoint([p.lat, p.lng]), d = Math.hypot(pt.x - (x - r.left), pt.y - (y - r.top));
    if (d < 40 && (!best || d < best.d)) best = { id: p.id, d };
  });
  return best && best.id;
}
function drop(d, x, y) {
  const r = resolve(d, x, y);
  if (!r) return;
  if (r.act === 'putTractor') return putTractor(tractorById(d.id), propById(r.pid), d.from);
  if (r.act === 'removeTractor') { assign(d.from, { tractorId: '' }); toast('↩ Traktorn borttagen från kortet', true); return; }
  if (r.act === 'setDriver') {
    const t = tractorById(r.tid), x2 = personByName(d.id);
    if ((x2.owner || 'Egna') !== (t.owner || 'Egna')) { toast(`🚫 ${esc(d.id)} hör till ${esc(ownerLabel(x2.owner))} – ${esc(shortModel(t))} till ${esc(ownerLabel(t.owner))}. Ändra ägare på Personal-sidan eller i ⚙️ Register.`); return; }
    if (d.fromTractor && d.fromTractor !== t.id) saveTractor(tractorById(d.fromTractor), { driver: '' });
    if (t.driver && t.driver !== d.id) toast(`🔁 ${esc(t.driver)} tillbaka i kulpåsen`, true);
    return saveTractor(t, { driver: d.id });
  }
  if (r.act === 'removeDriver') { saveTractor(tractorById(d.fromTractor), { driver: '' }); return; }
  if (r.act === 'putHand') {
    const p = propById(r.pid);
    if ((p.shovelers || []).includes(d.id)) return;
    if (d.from && d.from !== p.id) { const f = propById(d.from); assign(f.id, { shovelers: f.shovelers.filter(n => n !== d.id) }); }
    return assign(p.id, { shovelers: [...(p.shovelers || []), d.id] });
  }
  if (r.act === 'removeHand') { const f = propById(d.from); assign(f.id, { shovelers: f.shovelers.filter(n => n !== d.id) }); return; }
  if (r.act === 'propToLane') {
    const p = propById(d.id);
    if (!r.tid) { if (p.tractorId) assign(p.id, { tractorId: '' }); return; }
    if (!r.ok) { toast(p.size ? `🚫 ${esc(shortModel(tractorById(r.tid)))} är stor – ${esc(p.address)} har ett litet hål.` : `🚫 ${esc(p.address)} saknar storlek.`); return; }
    return putTractor(tractorById(r.tid), p, null);
  }
}

// ===== Detaljrutan: fastighet =====
let sheetFor = null; // { kind: 'prop'|'tractor', id }
function openSheet(pid) { sheetFor = { kind: 'prop', id: pid }; renderSheet(); $('sheet').classList.add('open'); $('sheetBg').classList.add('open'); }
function openTractorSheet(tid) { sheetFor = { kind: 'tractor', id: tid }; renderSheet(); $('sheet').classList.add('open'); $('sheetBg').classList.add('open'); }
function closeSheet() { sheetFor = null; $('sheet').classList.remove('open'); $('sheetBg').classList.remove('open'); }
$('sheetBg').onclick = closeSheet;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

function renderSheet() {
  if (!sheetFor) return;
  const el = $('sheet');
  if (document.activeElement && el.contains(document.activeElement) && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return; // skriv i fred
  el.innerHTML = sheetFor.kind === 'tractor' ? tractorSheetHtml(tractorById(sheetFor.id)) : propSheetHtml(propById(sheetFor.id));
}
function statusText(p, part, unit) {
  const d = doneOf(p, part, unit);
  return d ? `<span class="st ok">✅ ${esc(d.time.slice(11))}</span>` : snowfall ? '<span class="st">ej klar</span>' : '';
}
function propSheetHtml(p) {
  if (!p) return '<div class="empty">Fastigheten finns inte längre.</div>';
  const t = p.tractorId ? tractorById(p.tractorId) : null, zs = zoneStats(p);
  const pos = p.lat !== null ? `${p.lat},${p.lng}` : encodeURIComponent(p.address + (p.ort ? ', ' + p.ort : ''));
  const freeT = fleet.filter(x => x.active !== false && x.id !== p.tractorId && (!p.size || fits(x, p)));
  const freeH = people.filter(x => x.active !== false && x.shoveler && !(p.shovelers || []).includes(x.name));
  const id = esc(p.id);
  return `<div class="head"><div><h2>${p.priority ? '⭐ ' : ''}${esc(p.address)}</h2><div class="sub">${esc([p.kund, p.ort, kdOf(p) !== p.ort ? kdOf(p) : ''].filter(Boolean).join(' · '))}</div></div><button class="btn" onclick="closeSheet()">✕</button></div>
    <div class="row2"><button class="btn ${p.priority ? 'on' : ''}" onclick="saveProp(propById('${id}'), { priority: ${!p.priority} })">⭐ ${p.priority ? 'Prioriterad' : 'Prioritera'}</button>
      <a class="btn" style="text-align:center;text-decoration:none" href="https://www.google.com/maps/dir/?api=1&destination=${pos}" target="_blank" rel="noopener">🧭 Kör dit</a>
      <a class="btn" style="text-align:center;text-decoration:none" href="snozoner.html?fastighet=${encodeURIComponent(p.id)}">✏️ Rita zoner</a></div>
    <h4>Storlek (traktorhålet)</h4>
    <div class="sizes"><button class="btn stor ${p.size === 'stor' ? 'on' : ''}" onclick="saveProp(propById('${id}'), { size: 'stor', forced: false })">🟠 Stor</button>
      <button class="btn liten ${p.size === 'liten' ? 'on' : ''}" onclick="saveProp(propById('${id}'), { size: 'liten' })">🔵 Liten</button>
      ${p.size === 'liten' ? `<button class="btn ${p.forced ? 'on' : ''}" onclick="if (${p.forced} || confirm('Tvinga in en stor traktor på en liten plats? Bara för gränsfall.')) saveProp(propById('${id}'), { forced: ${!p.forced} })">💪 ${p.forced ? 'Tvingad stor' : 'Tvinga stor'}</button>` : ''}</div>
    <h4>Kulorna${snowfall ? ' · snöfall ' + esc(snowfall.start.slice(5)) : ''}</h4>
    ${t ? `<div class="krow">${tKula(t, 34)}<div class="who">${esc(t.model)}<em>${t.driver ? '👷 ' + esc(t.driver) : '⚠️ ingen förare'}${t.owner !== 'Egna' ? ' · ' + esc(t.owner) : ''}</em></div>${statusText(p, 'traktor', t.id)}
        ${snowfall ? `<button class="btn" onclick="adminMark('${id}','traktor','${esc(t.id)}', ${!!doneOf(p, 'traktor', t.id)})">${doneOf(p, 'traktor', t.id) ? '↶' : '✅'}</button>` : ''}
        <button class="x" onclick="assign('${id}', { tractorId: '' })">✕</button></div>`
      : `<div class="krow"><div class="hole ${p.size || 'none'} empty"></div><div class="who">Ingen traktor<em>Dra från remsan – eller välj:</em></div></div>`}
    <select onchange="if (this.value) putTractor(tractorById(this.value), propById('${id}'), null); this.value=''"><option value="">${t ? '🔁 Byt traktor…' : '🚜 Välj traktor…'}</option>${freeT.map(x => `<option value="${esc(x.id)}">${esc(x.model)}${x.driver ? ' (' + esc(x.driver) + ')' : ''}</option>`).join('')}</select>
    ${(p.shovelers || []).map(n => `<div class="krow">${pKula(n, 34)}<div class="who">${esc(n)}<em>🧹 Handskottare${personByName(n).active === false ? ' · ⚠️ inaktiv' : ''}</em></div>${statusText(p, 'hand', n)}
        ${snowfall ? `<button class="btn" onclick="adminMark('${id}','hand','${esc(n).replace(/&#39;/g, "\\'")}', ${!!doneOf(p, 'hand', n)})">${doneOf(p, 'hand', n) ? '↶' : '✅'}</button>` : ''}
        <button class="x" onclick="assign('${id}', { shovelers: propById('${id}').shovelers.filter(x => x !== this.dataset.n) })" data-n="${esc(n)}">✕</button></div>`).join('')}
    ${freeH.length ? `<select style="margin-top:6px" onchange="if (this.value) assign('${id}', { shovelers: [...(propById('${id}').shovelers || []), this.value] }); this.value=''"><option value="">🧹 Lägg till handskottare…</option>${freeH.map(x => `<option>${esc(x.name)}</option>`).join('')}</select>` : ''}
    ${needsHand(p) ? '<div class="hint" style="color:var(--warn);margin-top:4px">🧹⚠️ Har handytor men ingen handskottare.</div>' : ''}
    <h4>Ytor</h4>
    <div class="hint" style="font-size:13px">${zs.maskin ? '🔵 Maskin ' + m2(zs.maskin) : ''}${zs.maskin && zs.hand ? ' · ' : ''}${zs.hand ? '🟠 Hand ' + m2(zs.hand) : ''}${!zs.maskin && !zs.hand ? 'Inga zoner ritade ännu.' : ''} ${p.zoneStatus === 'klar' ? '· ✅ zonerna klara' : ''}</div>
    <h4>Att tänka på (syns i Snöjour)</h4>
    <textarea id="noteBox" placeholder="T.ex. låg grind vid infarten" onchange="saveProp(propById('${id}'), { note: this.value })" onblur="setTimeout(renderSheet, 50)">${esc(p.note)}</textarea>
    ${(p.maps || []).length || (p.photos || []).length ? `<h4>Kundkarta och foton</h4><div class="thumbs">${(p.maps || []).map(m => `<a href="${esc(m.url)}" target="_blank" rel="noopener"><img src="${esc(m.url)}" alt="${esc(m.label || 'Kundkarta')}" loading="lazy"></a>`).join('')}${(p.photos || []).map(ph => `<a href="${esc(ph.url)}" target="_blank" rel="noopener"><img src="${esc(ph.url)}" alt="Foto" loading="lazy"></a>`).join('')}</div>` : ''}
    <div class="hint" style="margin-top:14px">Adress, position, foton och borttagning: <a href="snoregister.html" style="color:var(--accent)">⚙️ Register</a></div>`;
}
async function adminMark(pid, part, unit, undo) {
  if (!snowfall) return;
  setStatus('Sparar…');
  try {
    const res = await snoApi({ action: 'markSnowDone', propertyId: pid, part, unit, undo, at: Date.now() });
    if (res.status !== 'success') throw new Error(res.message || 'Kunde inte spara.');
    doneList = doneList.filter(d => d.propertyId !== pid).concat(res.done);
    setStatus('Sparat'); render();
  } catch (err) { setStatus('Fel', true); toast('❌ ' + esc(err.message)); }
}

// ===== Detaljrutan: traktor =====
function tractorSheetHtml(t) {
  if (!t) return '<div class="empty">Traktorn finns inte längre.</div>';
  const kd = currentKd(), mine = properties.filter(p => p.tractorId === t.id).sort((a, b) => sv(kdOf(a), kdOf(b)) || sv(a.address, b.address));
  const owners = ['Egna', ...[...new Set(people.map(x => x.owner).concat(fleet.map(x => x.owner)).filter(o => o && o !== 'Egna'))].sort(sv)];
  const drivers = people.filter(x => x.active !== false && (x.owner || 'Egna') === (t.owner || 'Egna') && x.name !== t.driver);
  const id = esc(t.id);
  const area = mine.reduce((s, p) => s + zoneStats(p).maskin, 0);
  return `<div class="head"><div style="display:flex;gap:10px;align-items:center">${tKula(t, 52)}<div><h2>${esc(t.model)}</h2><div class="sub">${t.size === 'stor' ? '🟠 Stor' : '🔵 Liten'} · ${esc(ownerLabel(t.owner))}${t.base ? ' · står i ' + esc(t.base) : ''}</div></div></div><button class="btn" onclick="closeSheet()">✕</button></div>
    <h4>Förare</h4>
    ${t.driver ? `<div class="krow">${pKula(t.driver, 34)}<div class="who">${esc(t.driver)}<em>${personByName(t.driver).active === false ? '⚠️ inaktiv' : 'Fast förare'}</em></div><button class="x" onclick="saveTractor(tractorById('${id}'), { driver: '' })">✕</button></div>` : '<div class="hint" style="color:var(--warn)">⚠️ Ingen förare – dra en från kulpåsen till traktorn, eller välj:</div>'}
    <select onchange="if (this.value) { const o = fleet.find(x => x.driver === this.value && x.id !== '${id}'); if (o) saveTractor(o, { driver: '' }); saveTractor(tractorById('${id}'), { driver: this.value }); } this.value=''"><option value="">👷 ${t.driver ? 'Byt förare…' : 'Välj förare…'}</option>${drivers.map(x => `<option>${esc(x.name)}</option>`).join('')}</select>
    <h4>Ägare och uppställning</h4>
    <div class="row2"><select onchange="saveTractor(tractorById('${id}'), { owner: this.value, driver: '' })">${owners.map(o => `<option value="${esc(o)}" ${o === (t.owner || 'Egna') ? 'selected' : ''}>${esc(ownerLabel(o))}</option>`).join('')}</select>
      <input value="${esc(t.base)}" placeholder="Ort / uppställning" onchange="saveTractor(tractorById('${id}'), { base: this.value.trim() })"></div>
    <div class="hint">Byter du ägare tas föraren bort (föraren måste ha samma ägare). Nytt UE-företag skrivs in på Personal-sidan eller i ⚙️ Register.</div>
    <h4>Fastigheter (${mine.length}${area ? ' · ' + m2(area) : ''})</h4>
    ${mine.map(p => `<div class="krow" style="cursor:pointer" onclick="openSheet('${esc(p.id)}')"><div class="who">${p.priority ? '⭐ ' : ''}${esc(p.address)}<em>${esc(kdOf(p))}${kdOf(p) === kd ? '' : ' (annan kommundel)'}</em></div>${statusText(p, 'traktor', t.id)}</div>`).join('') || '<div class="hint">Inga ännu.</div>'}
    <div class="row2" style="margin-top:14px"><button class="btn" onclick="saveTractor(tractorById('${id}'), { active: ${t.active === false} })">${t.active === false ? '▶️ I tjänst' : '⏸ Ur tjänst'}</button>
      <a class="btn" style="text-align:center;text-decoration:none" href="snoregister.html">⚙️ Register (AI-kula, ta bort)</a></div>`;
}

// ===== Snöfall =====
async function newSnowfall() {
  if (!confirm('Starta ett nytt snöfall?\n\nAlla fastigheter blir ogjorda (✅ nollställs). Kulorna ligger kvar där de ligger.')) return;
  setStatus('Sparar…');
  try {
    const res = await snoApi({ action: 'newSnowfall' });
    if (res.status !== 'success') throw new Error(res.message || 'Kunde inte starta.');
    snowfall = res.snowfall; doneList = []; setStatus('Sparat'); render();
    toast('❄️ Nytt snöfall startat – förarna ser alla sina fastigheter som ogjorda.', true);
  } catch (err) { setStatus('Fel', true); toast('❌ ' + esc(err.message)); }
}
async function refreshStatus() {
  if (document.hidden || drag) return;
  try {
    const res = await snoApi({ action: 'getSnowBoard' });
    if (res.status !== 'success') return;
    const changed = JSON.stringify([res.snowfall, res.done]) !== JSON.stringify([snowfall, doneList]);
    people = res.people || people; snowfall = res.snowfall; doneList = res.done || [];
    if (changed && !drag) render();
  } catch (e) { /* ingen täckning */ }
}

// ===== Sök: hoppa till kommundelen och kortet =====
function jumpTo(text) {
  const q = snoAddrKey(text);
  if (!q) return;
  const p = properties.find(x => snoAddrKey(x.address) === q) || properties.find(x => snoAddrKey(x.address).includes(q) || snoAddrKey(x.kund).includes(q));
  if (!p) { toast('Hittade ingen fastighet som matchar.'); return; }
  if (kdOf(p) !== currentKd()) setKd(kdOf(p));
  if (view === 'map') { if (map && p.lat !== null) map.setView([p.lat, p.lng], 17); openSheet(p.id); return; }
  setTimeout(() => {
    const el = document.querySelector(`[data-card="${CSS.escape(p.id)}"]`);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500); }
  }, 50);
}

// ===== Start =====
async function load() {
  let cache = null;
  try { cache = JSON.parse(store.get('lpv_plan_cache2') || 'null'); } catch (e) { cache = null; }
  if (cache) { ({ properties, fleet, people, zonesAll, snowfall, doneList } = Object.assign({ properties: [], fleet: [], people: [], zonesAll: [], snowfall: null, doneList: [] }, cache)); zoneCache = null; loaded = true; render(true); }
  setStatus('Hämtar…');
  try {
    const [pRes, fRes, bRes, zRes] = await Promise.all([snoApi({ action: 'getProperties' }), snoApi({ action: 'getFleet' }), snoApi({ action: 'getSnowBoard' }), snoApi({ action: 'getSnowZones' })]);
    if (pRes.status !== 'success') throw new Error(pRes.message || 'Kunde inte hämta.');
    properties = pRes.properties || [];
    if (fRes.status === 'success') fleet = fRes.fleet || [];
    if (bRes.status === 'success') { people = bRes.people || []; snowfall = bRes.snowfall; doneList = bRes.done || []; }
    if (zRes.status === 'success') { zonesAll = zRes.zones || []; zoneCache = null; }
    loaded = true; setStatus('');
    render(!cache);
    snoApi({ action: 'getAvatars' }).then(r => { if (r.status === 'success') { avatars = r.avatars || {}; render(); } }).catch(() => {});
  } catch (err) {
    setStatus(cache ? 'Ingen kontakt – visar senast hämtade' : 'Ingen kontakt', true);
    if (!cache) $('cardsview').innerHTML = `<div class="empty">❌ ${esc(err.message)}</div>`;
  }
}

document.querySelectorAll('#viewseg button').forEach(b => b.onclick = () => setView(b.dataset.v));
$('prev').onclick = () => stepKd(-1);
$('next').onclick = () => stepKd(1);
$('newSf').onclick = newSnowfall;
$('search').addEventListener('change', (e) => { jumpTo(e.target.value); });
$('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') { jumpTo(e.target.value); e.target.blur(); } });
const panels = { side: store.get('lpv_plan_side') !== 'dold', order: store.get('lpv_plan_order') !== 'dold' };
function applyPanels() {
  $('side').classList.toggle('hidden', !panels.side); $('order').classList.toggle('hidden', !panels.order);
  $('tglSide').classList.toggle('on', panels.side); $('tglOrder').classList.toggle('on', panels.order);
  if (map) setTimeout(() => map.invalidateSize(), 50);
}
$('tglSide').onclick = () => { panels.side = !panels.side; store.set('lpv_plan_side', panels.side ? '' : 'dold'); applyPanels(); };
$('tglOrder').onclick = () => { panels.order = !panels.order; store.set('lpv_plan_order', panels.order ? '' : 'dold'); applyPanels(); };
applyPanels();
if (!snoIsAdmin()) $('cardsview').innerHTML = '<div class="empty">⚠️ Snöplaneringen är bara för admin. Logga in med din admin-länk.</div>';
render();
load();
setInterval(refreshStatus, 60000);
</script>
