<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPV & Klaryta - Framtidsradarn (Full UI Mockup v5.2)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ice: { 50: '#f0f9ff', 100: '#e0f2fe', 900: '#0c4a6e', 950: '#082f49' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(34, 211, 238, 0.15);
            transition: all 0.3s ease;
        }
        .dark .glass-panel {
            background: rgba(8, 25, 45, 0.55);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }

        .orb-kulpase-liten { width: 44px; height: 44px; font-size: 1.25rem; }
        .orb-kulpase-medium { width: 54px; height: 54px; font-size: 1.5rem; }
        .orb-kulpase-stor { width: 64px; height: 64px; font-size: 2rem; }
        .orb-gantt-liten { width: 32px; height: 32px; font-size: 0.875rem; z-index: 10; }

        .glass-orb {
            background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 100%);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            position: relative; cursor: grab; transition: transform 0.2s, box-shadow 0.2s;
        }
        .dark .glass-orb {
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.25), 0 6px 12px rgba(0,0,0,0.5);
        }
        .glass-orb:active { cursor: grabbing; transform: scale(1.05); }

        .sick-orb {
            filter: grayscale(0.4) opacity(0.9);
            border: 2px solid #ef4444 !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6) !important;
        }

        .owner-badge {
            position: absolute; bottom: -2px; right: -4px; font-size: 8px; font-weight: 900; 
            padding: 2px 4px; border-radius: 4px; z-index: 20; border: 1px solid rgba(255,255,255,0.6);
            pointer-events: none; line-height: 1; color: white;
        }
        .bg-lpv { background-color: #0284c7; }
        .bg-klaryta { background-color: #16a34a; }
        .bg-ue { background-color: #d97706; }

        .gantt-job-card {
            border-radius: 12px; display: flex; align-items: center; padding: 0 12px; gap: 12px;
            position: relative; cursor: grab; transition: all 0.2s ease;
        }
        .gantt-job-card.lpv {
            background: linear-gradient(145deg, rgba(2, 132, 199, 0.7) 0%, rgba(3, 105, 161, 0.9) 100%);
            border: 1px solid rgba(125, 211, 252, 0.8); backdrop-filter: blur(8px);
        }
        .dark .gantt-job-card.lpv {
            background: linear-gradient(145deg, rgba(2, 105, 164, 0.85) 0%, rgba(7, 89, 133, 0.95) 100%);
            border: 1px solid rgba(56, 189, 248, 0.5);
        }
        .gantt-job-card.kla {
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.7) 0%, rgba(5, 150, 105, 0.9) 100%);
            border: 1px solid rgba(110, 231, 183, 0.8); backdrop-filter: blur(8px);
        }
        .dark .gantt-job-card.kla {
            background: linear-gradient(145deg, rgba(6, 78, 59, 0.85) 0%, rgba(2, 44, 34, 0.95) 100%);
            border: 1px solid rgba(16, 185, 129, 0.5);
        }

        .bg-helg {
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(225, 29, 72, 0.05) 10px, rgba(225, 29, 72, 0.05) 20px);
        }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(14, 165, 233, 0.1); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.5); border-radius: 4px; }

        .modal-backdrop {
            background: rgba(3, 15, 28, 0.75);
            backdrop-filter: blur(10px);
        }

        .chip-checkbox:checked + label {
            background-color: rgba(217, 119, 6, 0.25);
            border-color: #d97706;
            color: #fef3c7;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-gradient-to-br from-sky-50 to-cyan-100 dark:from-[#030f1c] dark:to-[#082f49] text-slate-800 dark:text-slate-100 overflow-hidden">

    <!-- HEADER -->
    <header class="glass-panel h-16 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-sky-700 dark:text-sky-300 flex items-center gap-2 drop-shadow-md">
                🔭 Framtidsradarn <span class="text-sky-600/70 dark:text-slate-400 font-normal text-xs">(Full Mockup v5.2)</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openCreateJobModal()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-xs transition shadow-lg shadow-emerald-600/30 flex items-center gap-1.5">
                <span>➕</span> Skapa nytt jobb
            </button>
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-full glass-panel flex items-center justify-center text-lg hover:scale-110 transition shadow-lg border border-sky-200 dark:border-sky-800/50" title="Växla Ljust/Mörkt Tema">
                <span id="theme-icon">❄️</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <div class="flex flex-1 overflow-hidden relative">
        <!-- KULPÅSE / RESURSDEPÅ -->
        <aside id="resource-panel" class="w-[320px] flex flex-col border-r border-white/30 dark:border-sky-900/40 bg-white/20 dark:bg-slate-900/40 shrink-0 overflow-y-auto p-4 space-y-4 custom-scrollbar">
            <h2 class="text-xs font-bold text-sky-800 dark:text-sky-200 uppercase tracking-wider">🎒 Kulpåsen & Resursdepå</h2>

            <!-- EGEN PERSONAL -->
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col">
                <h3 class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-3">👥 Personal</h3>
                <div id="pool-personnel" class="flex flex-wrap gap-3 min-h-[40px] mb-3"></div>
                <!-- DMT Micro-knapp -->
                <button onclick="openQuickAddModal('person')" class="w-full py-1.5 border border-dashed border-sky-400/50 dark:border-sky-600 text-sky-700 dark:text-sky-400 text-[10px] font-bold rounded-lg hover:bg-sky-400/10 transition">
                    + Ta in extra handtag (UE)
                </button>
            </div>

            <!-- SJUKANMÄLDA -->
            <div class="glass-panel p-3.5 rounded-2xl !bg-rose-50/50 dark:!bg-rose-950/20 !border-rose-200 dark:!border-rose-900/50">
                <h3 class="text-[11px] font-bold text-rose-600 dark:text-rose-400 uppercase tracking-wider mb-3">🤒 Sjukanmälda</h3>
                <div id="pool-sick" class="flex flex-wrap gap-3 min-h-[30px]"></div>
            </div>

            <!-- MASKINER & UE -->
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col">
                <h3 class="text-[11px] font-bold text-sky-600 dark:text-sky-300 uppercase tracking-wider mb-3">🚜 UE & Maskinpark</h3>
                <div id="pool-machines" class="flex flex-wrap gap-3 min-h-[40px] mb-3"></div>
                <!-- DMT Micro-knapp -->
                <button onclick="openQuickAddModal('machine')" class="w-full py-1.5 border border-dashed border-amber-500/50 dark:border-amber-600 text-amber-600 dark:text-amber-400 text-[10px] font-bold rounded-lg hover:bg-amber-400/10 transition">
                    + Hyr in maskin (UE)
                </button>
            </div>
        </aside>

        <!-- TIMELINE & ORDERBOOK -->
        <main class="flex-1 flex flex-col overflow-y-auto p-5 space-y-5 custom-scrollbar relative z-10">
            <!-- ORDERBOOK -->
            <section class="glass-panel p-4 rounded-2xl">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-bold text-emerald-700 dark:text-emerald-400 uppercase tracking-wider">📬 Ej inplanerade jobb</h2>
                    <button onclick="openCreateJobModal()" class="text-[10px] text-emerald-600 dark:text-emerald-400 hover:underline font-bold">+ Nytt Jobb</button>
                </div>
                <div id="orderbook-list" class="flex gap-4 overflow-x-auto pb-2 custom-scrollbar"></div>
            </section>

            <!-- GANTT TIMELINE -->
            <section class="glass-panel p-4 rounded-2xl flex-1 flex flex-col min-h-[360px]">
                <h2 class="text-xs font-bold text-sky-700 dark:text-sky-300 uppercase tracking-wider mb-3">📅 Tidsperiod & Schemaläggning</h2>

                <div id="timeline-container" class="border border-white/40 dark:border-sky-900/50 rounded-xl bg-white/20 dark:bg-slate-950/40 flex-1 overflow-auto custom-scrollbar relative backdrop-blur-sm">
                    <div id="timeline-inner" class="flex flex-col min-h-full relative">
                        <div class="h-10 border-b border-white/30 dark:border-sky-900/50 flex items-center bg-white/40 dark:bg-slate-900/70 shrink-0 sticky top-0 z-40 backdrop-blur-md">
                            <div class="w-56 px-4 font-bold text-sky-800 dark:text-slate-300 text-[10px] uppercase tracking-wider shrink-0 sticky left-0 z-50 bg-white/60 dark:bg-slate-900/90 border-r border-white/30 dark:border-sky-900/50 h-full flex items-center">
                                Projekt / Kund
                            </div>
                            <div id="timeline-header-days" class="flex text-center text-xs font-bold h-full items-center"></div>
                        </div>

                        <div class="relative flex-1" ondragover="allowDrop(event)" ondrop="dropJobOnTimeline(event)">
                            <div id="timeline-grid-bg" class="absolute inset-0 flex pointer-events-none z-0 min-h-full"></div>
                            <div id="gantt-rows" class="relative z-10 pb-8"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL 1: SKAPA NYTT JOBB / KRAVPROFIL -->
    <div id="create-job-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-[200] p-4">
        <div class="glass-panel !bg-slate-900/95 border border-emerald-500/30 max-w-lg w-full rounded-2xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-emerald-400 flex items-center gap-2">
                    <span>➕</span> Skapa nytt jobb / Beställning
                </h3>
                <button onclick="closeCreateJobModal()" class="text-slate-400 hover:text-white transition">✕</button>
            </div>
            
            <form onsubmit="handleCreateJobSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Fakturerande / Utförande Enhet *</label>
                    <select id="job-billing-company" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="LPV">LPV AB (Blå)</option>
                        <option value="Klaryta">Klaryta AB (Grön)</option>
                        <option value="UE">Underentreprenör / UE (Orange)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Kund / Uppdragsgivare *</label>
                    <select id="job-client-select" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Projekttitel / Beskrivning *</label>
                    <input type="text" id="job-title" required placeholder="t.ex. Snöröjning Coop Norrköping" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="grid grid-cols-2 gap-4 bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                    <div>
                        <label class="block text-[10px] font-bold text-sky-400 uppercase mb-1">Max Maskinstorlek</label>
                        <select id="job-required-size" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                            <option value="alla">⚪ Valfri storlek</option>
                            <option value="liten">🟢 Endast Liten (Trångt/Garageröjning)</option>
                            <option value="medium">🔵 Medium (Standard Parkering/Gata)</option>
                            <option value="stor">🔴 Stor / Heavy Duty (Tunga lyft/Ytor)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-sky-400 uppercase mb-1">Krävd Kompetens / Redskap</label>
                        <select id="job-required-skill" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                            <option value="">Inga särskilda krav</option>
                            <option value="Elektriker">⚡ Elektriker</option>
                            <option value="VVS">💧 VVS / Röris</option>
                            <option value="Heta Arbeten">🔥 Heta Arbeten</option>
                            <option value="APV">🚧 Arbete på Väg (APV)</option>
                            <option value="Vikplog">❄️ Vikplog</option>
                            <option value="Sandspridare">🧂 Sandspridare</option>
                            <option value="Pallgafflar">🏗️ Pallgafflar</option>
                            <option value="Sopvals">🧹 Sopvals</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">📍 Arbetsplatsadress</label>
                    <input type="text" id="job-site-address" placeholder="Storgatan 12, Norrköping" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-sky-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Beräknade timmar</label>
                        <input type="number" id="job-hours" min="1" max="100" value="8" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Skift</label>
                        <select id="job-shift" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Dagpass">☀️ Dagpass</option>
                            <option value="Kvällspass">🌆 Kvällspass</option>
                            <option value="Nattpass">🌙 Nattpass</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeCreateJobModal()" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white transition">Avbryt</button>
                    <button type="submit" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-emerald-900/50 transition">
                        Skapa Beställning ➕
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: DMT QUICK ADD UE MICRO-MODAL -->
    <div id="quick-add-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-[200] p-4">
        <div class="glass-panel !bg-slate-900/95 border border-amber-500/30 max-w-sm w-full rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 id="qa-title" class="text-sm font-bold text-amber-400 flex items-center gap-2">
                    ➕ Hyr in Resurs
                </h3>
                <button onclick="closeQuickAddModal()" class="text-slate-400 hover:text-white transition">✕</button>
            </div>
            
            <form onsubmit="handleQuickAddSubmit(event)" class="space-y-3">
                <input type="hidden" id="qa-type" value="person">
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Leverantör (UE) *</label>
                    <select id="qa-supplier" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                        <option value="Svevia">Svevia</option>
                        <option value="PEAB">PEAB</option>
                        <option value="Bravida">Bravida</option>
                        <option value="Bemannia">Bemannia (Personal)</option>
                    </select>
                </div>

                <div>
                    <label id="qa-name-label" class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Namn / Förare *</label>
                    <input type="text" id="qa-name" required placeholder="t.ex. Kalle" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div id="qa-skills-area">
                    <label id="qa-skills-label" class="block text-[10px] font-bold text-amber-400 uppercase mb-1">Medhavda Redskap</label>
                    <div id="qa-skills-container" class="flex flex-wrap gap-2 text-[11px]"></div>
                </div>

                <div class="pt-3 border-t border-slate-800">
                    <button type="submit" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-amber-900/50 transition">
                        Lägg i Kulpåsen 🎒
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SWEDISH_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'Maj', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'];
        const SWEDISH_DAYS = ['Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör', 'Sön'];
        const START_DATE = new Date(2026, 9, 26);
        const TOTAL_DAYS = 35;
        const DAY_WIDTH = 130;

        let state = {
            clients: [
                { name: "Coop Norrköping", billingCompany: "LPV" },
                { name: "Svevia Fastighet", billingCompany: "Klaryta" }
            ],
            resources: [
                { id: "Johan", name: "Johan Svensson", type: "person", ownerCompany: "LPV", color: "#0284c7", icon: "👦", skills: "C-Kort, APV" },
                { id: "Pelle", name: "Pelle Röris", type: "person", ownerCompany: "ue", color: "#d97706", icon: "👷‍♂️", skills: "VVS" },
                { id: "Sjuk_Lasse", name: "Lasse N", type: "person", ownerCompany: "LPV", color: "#0284c7", icon: "👦", isSick: true },
                { id: "Kramer_37", name: "Kramer 37.8", type: "machine", sizeClass: "stor", ownerCompany: "LPV", color: "#0284c7", icon: "🚜", skills: "Vikplog, Sandspridare" },
                { id: "Avant_528", name: "Avant 528", type: "machine", sizeClass: "liten", ownerCompany: "Klaryta", color: "#16a34a", icon: "🚜", skills: "Sopvals" }
            ],
            jobs: [
                { id: "j1", client: "Coop Norrköping", billingCompany: "LPV", title: "Snöröjning Parkering", status: "scheduled", dayIndex: 2, hours: 8, assigned: ["Kramer_37"], requiredSkill: "Vikplog" },
                { id: "j2", client: "Svevia Fastighet", billingCompany: "Klaryta", title: "Garagestädning & Sopning", status: "unscheduled", hours: 16, assigned: [], requiredSkill: "Sopvals", requiredSize: "liten" }
            ]
        };

        function toggleTheme() {
            const htmlTag = document.documentElement;
            htmlTag.classList.toggle('dark');
            const isDark = htmlTag.classList.contains('dark');
            document.getElementById('theme-icon').innerText = isDark ? '❄️' : '☀️';
        }

        function initUI() {
            buildTimelineLayout();
            renderKulpase();
            renderOrderbook();
            renderGantt();
            populateClientSelect();
        }

        function populateClientSelect() {
            const sel = document.getElementById('job-client-select');
            if (!sel) return;
            sel.innerHTML = '';
            state.clients.forEach(function(c) {
                sel.innerHTML += '<option value="' + c.name + '">' + c.name + ' (' + (c.billingCompany || 'LPV') + ')</option>';
            });
        }

        function buildTimelineLayout() {
            const inner = document.getElementById('timeline-inner');
            inner.style.width = (224 + (TOTAL_DAYS * DAY_WIDTH)) + 'px';

            const headerContainer = document.getElementById('timeline-header-days');
            const gridBg = document.getElementById('timeline-grid-bg');
            
            headerContainer.innerHTML = '';
            gridBg.innerHTML = '<div class="w-56 shrink-0 border-r border-white/20 dark:border-sky-900/30 sticky left-0 z-20 bg-white/30 dark:bg-slate-900/60 backdrop-blur-sm"></div>';

            for (let i = 0; i < TOTAL_DAYS; i++) {
                const d = new Date(START_DATE);
                d.setDate(d.getDate() + i);

                const dayName = SWEDISH_DAYS[(d.getDay() + 6) % 7];
                const dateNum = d.getDate();
                const monthName = SWEDISH_MONTHS[d.getMonth()];
                const isWeekend = (d.getDay() === 0 || d.getDay() === 6);

                headerContainer.innerHTML += '<div class="border-r border-white/30 dark:border-sky-900/50 py-1 h-full flex flex-col justify-center items-center shrink-0 text-xs font-bold ' + (isWeekend ? 'bg-helg text-rose-500' : 'text-sky-700 dark:text-slate-400') + '" style="width: ' + DAY_WIDTH + 'px;">' +
                    '<span>' + dayName + ' ' + dateNum + ' ' + monthName + '</span>' +
                '</div>';

                gridBg.innerHTML += '<div class="border-r border-white/20 dark:border-sky-900/30 shrink-0 ' + (isWeekend ? 'bg-helg' : '') + '" style="width: ' + DAY_WIDTH + 'px;"></div>';
            }
        }

        function renderKulpase() {
            const poolPersonnel = document.getElementById('pool-personnel');
            const poolSick = document.getElementById('pool-sick');
            const poolMachines = document.getElementById('pool-machines');
            
            poolPersonnel.innerHTML = ''; poolSick.innerHTML = ''; poolMachines.innerHTML = '';

            const assignedIds = new Set();
            state.jobs.filter(function(j) { return j.status === 'scheduled'; }).forEach(function(j) { 
                j.assigned.forEach(function(id) { assignedIds.add(id); }); 
            });

            state.resources.forEach(function(res) {
                let badgeClass = 'bg-lpv'; let ownerText = 'LPV';
                if (res.ownerCompany && res.ownerCompany.toLowerCase().includes('kla')) { badgeClass = 'bg-klaryta'; ownerText = 'KLA'; }
                if (res.ownerCompany && res.ownerCompany.toLowerCase().includes('ue') || (res.ownerCompany !== 'LPV' && res.ownerCompany !== 'Klaryta')) { badgeClass = 'bg-ue'; ownerText = 'UE'; }

                let sizeClass = 'orb-kulpase-' + (res.sizeClass || 'liten');
                let displayIcon = '<span class="z-10 text-slate-800">' + (res.icon || '👦') + '</span>';

                let skillHtml = '';
                if (res.skills) {
                    let firstSkill = res.skills.split(',')[0].trim();
                    skillHtml = '<div class="text-[8px] bg-sky-950/80 text-sky-300 border border-sky-500/30 rounded px-1 py-0.5 mt-0.5 truncate max-w-full" title="' + res.skills + '">' + firstSkill + '</div>';
                }

                if (res.type === 'person' && res.isSick) {
                    poolSick.innerHTML += '<div class="flex flex-col items-center gap-1 w-[56px] shrink-0">' +
                        '<div class="glass-orb ' + sizeClass + ' sick-orb">' +
                            '<span class="z-10">🤒</span>' +
                            '<span class="owner-badge bg-rose-600 text-white">SJUK</span>' +
                        '</div>' +
                        '<span class="text-[9px] font-bold text-rose-500 dark:text-rose-300 truncate w-full text-center">' + res.name + '</span>' +
                    '</div>';
                } else if (!assignedIds.has(res.id)) {
                    const html = '<div class="flex flex-col items-center gap-1 w-[56px] shrink-0">' +
                        '<div class="glass-orb ' + sizeClass + '" style="background-color: ' + (res.color || '#0284c7') + '" draggable="true" ondragstart="onOrbDragStart(event, \'' + res.id + '\')">' +
                            displayIcon +
                            '<span class="owner-badge ' + badgeClass + '">' + ownerText + '</span>' +
                        '</div>' +
                        '<span class="text-[9px] font-semibold text-sky-900 dark:text-slate-300 truncate w-full text-center">' + res.name + '</span>' +
                        skillHtml +
                    '</div>';
                    
                    if (res.type === 'person') poolPersonnel.innerHTML += html;
                    else poolMachines.innerHTML += html;
                }
            });

            if (!poolPersonnel.innerHTML) poolPersonnel.innerHTML = '<span class="text-sky-600/70 dark:text-slate-500 text-[10px]">Inga tillgängliga</span>';
            if (!poolSick.innerHTML) poolSick.innerHTML = '<span class="text-emerald-600/70 dark:text-emerald-500 text-[10px]">Alla friska! 👍</span>';
            if (!poolMachines.innerHTML) poolMachines.innerHTML = '<span class="text-sky-600/70 dark:text-slate-500 text-[10px]">Inga maskiner</span>';
        }

        function renderOrderbook() {
            const container = document.getElementById('orderbook-list');
            container.innerHTML = '';
            state.jobs.filter(function(j) { return j.status === 'unscheduled'; }).forEach(function(job) {
                let reqHtml = '';
                if (job.requiredSkill) reqHtml += '<span class="text-[8px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1 rounded">REQ: ' + job.requiredSkill + '</span>';

                container.innerHTML += '<div class="glass-panel p-3 rounded-xl shrink-0 w-56 cursor-grab" draggable="true" ondragstart="onJobDragStart(event, \'' + job.id + '\')">' +
                    '<div class="flex items-center justify-between text-[10px] font-bold uppercase mb-1">' +
                        '<span class="truncate text-sky-800 dark:text-slate-300">' + job.client + '</span>' +
                        '<span class="text-amber-500 dark:text-amber-400">' + job.hours + 'h</span>' +
                    '</div>' +
                    '<div class="font-bold text-xs text-sky-950 dark:text-slate-100 truncate mb-1">' + job.title + '</div>' +
                    reqHtml +
                '</div>';
            });
            if (!container.innerHTML) container.innerHTML = '<span class="text-sky-600/70 dark:text-slate-500 text-[10px]">Inga nya beställningar</span>';
        }

        function renderGantt() {
            const container = document.getElementById('gantt-rows');
            container.innerHTML = '';

            state.jobs.filter(function(j) { return j.status === 'scheduled'; }).forEach(function(job) {
                let orbsHtml = job.assigned.map(function(id) {
                    const res = state.resources.find(function(r) { return r.id === id; });
                    if (!res) return '';
                    let sizeClass = 'orb-gantt-' + (res.sizeClass || 'liten');
                    let displayIcon = '<span class="z-10 text-slate-800">' + (res.icon || '👦') + '</span>';

                    return '<div class="glass-orb ' + sizeClass + ' border border-white/60 dark:border-slate-800 shrink-0" style="background-color:' + (res.color || '#0284c7') + '" draggable="true" ondragstart="onOrbDragStart(event, \'' + id + '\')">' +
                        displayIcon +
                    '</div>';
                }).join('');

                const leftPx = (job.dayIndex || 0) * DAY_WIDTH + 8;
                const widthPx = Math.ceil(job.hours / 8) * DAY_WIDTH - 16;

                container.innerHTML += '<div class="flex items-center h-[76px] border-b border-white/20 dark:border-slate-800/40 relative">' +
                    '<div class="w-56 p-2 shrink-0 h-full flex items-center z-30 sticky left-0 border-r border-white/30 dark:border-sky-900/50 bg-white/40 dark:bg-slate-900/70 backdrop-blur-md">' +
                        '<div class="glass-panel p-2 rounded-xl w-full border-white/60 dark:border-slate-700">' +
                            '<div class="text-[9px] font-bold text-sky-700 dark:text-slate-400 uppercase truncate">' + job.client + '</div>' +
                            '<div class="font-bold text-xs text-sky-950 dark:text-slate-100 truncate">' + job.title + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="flex-1 h-full relative">' +
                        '<div class="gantt-job-card ' + (job.billingCompany === 'Klaryta' ? 'kla' : 'lpv') + ' absolute top-[6px] bottom-[6px] shadow-lg shadow-sky-900/10 dark:shadow-black/40" style="left: ' + leftPx + 'px; width: ' + widthPx + 'px;" draggable="true" ondragstart="onJobDragStart(event, \'' + job.id + '\')" ondrop="dropOrbOnJob(event, \'' + job.id + '\')" ondragover="allowDrop(event)">' +
                            '<div class="flex items-center gap-1 z-40 relative">' + orbsHtml + '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            });
        }

        // DMT QUICK ADD MICRO-MODAL
        function openQuickAddModal(type) {
            document.getElementById('qa-type').value = type;
            const title = document.getElementById('qa-title');
            const nameLabel = document.getElementById('qa-name-label');
            const skillsLabel = document.getElementById('qa-skills-label');
            const skillsContainer = document.getElementById('qa-skills-container');

            if (type === 'person') {
                title.innerHTML = '👥 Ta in extra personal (UE)';
                nameLabel.innerText = 'Namn / Förare *';
                skillsLabel.innerText = 'Kompetenser (Klicka i)';
                skillsContainer.innerHTML = `
                    <input type="checkbox" id="qa-sk-el" value="Elektriker" class="hidden chip-checkbox">
                    <label for="qa-sk-el" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer text-xs select-none">⚡ El</label>
                    <input type="checkbox" id="qa-sk-vvs" value="VVS" class="hidden chip-checkbox">
                    <label for="qa-sk-vvs" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer text-xs select-none">💧 VVS</label>
                    <input type="checkbox" id="qa-sk-heta" value="Heta Arbeten" class="hidden chip-checkbox">
                    <label for="qa-sk-heta" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer text-xs select-none">🔥 Heta</label>
                `;
            } else {
                title.innerHTML = '🚜 Hyr in Maskin (UE)';
                nameLabel.innerText = 'Maskinmodell *';
                skillsLabel.innerText = 'Medhavda Redskap (Klicka i)';
                skillsContainer.innerHTML = `
                    <input type="checkbox" id="qa-eq-plog" value="Vikplog" class="hidden chip-checkbox">
                    <label for="qa-eq-plog" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer text-xs select-none">❄️ Plog</label>
                    <input type="checkbox" id="qa-eq-sand" value="Sandspridare" class="hidden chip-checkbox">
                    <label for="qa-eq-sand" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer text-xs select-none">🧂 Sand</label>
                    <input type="checkbox" id="qa-eq-gaffel" value="Pallgafflar" class="hidden chip-checkbox">
                    <label for="qa-eq-gaffel" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-300 cursor-pointer text-xs select-none">🏗️ Gafflar</label>
                `;
            }

            document.getElementById('quick-add-modal').classList.remove('hidden');
            document.getElementById('quick-add-modal').classList.add('flex');
            document.getElementById('qa-name').focus();
        }

        function closeQuickAddModal() {
            document.getElementById('quick-add-modal').classList.add('hidden');
            document.getElementById('quick-add-modal').classList.remove('flex');
            document.getElementById('qa-name').value = '';
        }

        function handleQuickAddSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('qa-type').value;
            const name = document.getElementById('qa-name').value;
            const supplier = document.getElementById('qa-supplier').value;

            const checkedBoxes = document.querySelectorAll('#qa-skills-container input:checked');
            const selectedSkills = Array.from(checkedBoxes).map(cb => cb.value).join(', ');

            const newRes = {
                id: name + "_" + Date.now(),
                name: name,
                type: type,
                ownerCompany: supplier,
                color: '#d97706',
                icon: type === 'person' ? '👷‍♂️' : '🚜',
                sizeClass: type === 'person' ? 'liten' : 'stor',
                skills: selectedSkills || (type === 'person' ? 'Arbetare' : 'Maskin')
            };

            state.resources.push(newRes);
            closeQuickAddModal();
            initUI();
        }

        // CREATE JOB MODAL
        function openCreateJobModal() {
            populateClientSelect();
            document.getElementById('create-job-modal').classList.remove('hidden');
            document.getElementById('create-job-modal').classList.add('flex');
        }
        function closeCreateJobModal() {
            document.getElementById('create-job-modal').classList.add('hidden');
            document.getElementById('create-job-modal').classList.remove('flex');
        }

        function handleCreateJobSubmit(e) {
            e.preventDefault();
            const newJob = {
                id: "j_" + Date.now(),
                client: document.getElementById('job-client-select').value || "Standard Kund",
                billingCompany: document.getElementById('job-billing-company').value,
                title: document.getElementById('job-title').value,
                requiredSize: document.getElementById('job-required-size').value,
                requiredSkill: document.getElementById('job-required-skill').value,
                siteAddress: document.getElementById('job-site-address').value,
                hours: Number(document.getElementById('job-hours').value) || 8,
                shift: document.getElementById('job-shift').value,
                status: "unscheduled",
                assigned: []
            };

            state.jobs.push(newJob);
            closeCreateJobModal();
            initUI();
        }

        // DRAG & DROP LOGIK
        function onOrbDragStart(e, resId) { e.stopPropagation(); e.dataTransfer.setData("type", "orb"); e.dataTransfer.setData("id", resId); }
        function onJobDragStart(e, jobId) { e.dataTransfer.setData("type", "job"); e.dataTransfer.setData("id", jobId); }
        function allowDrop(e) { e.preventDefault(); }

        function dropJobOnTimeline(e) {
            e.preventDefault();
            const type = e.dataTransfer.getData("type");
            const id = e.dataTransfer.getData("id");
            if (type === "job") {
                const job = state.jobs.find(function(j) { return j.id === id; });
                if (job) {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const offsetX = e.clientX - (rect.left + 224);
                    if (offsetX >= 0) {
                        job.status = 'scheduled';
                        job.dayIndex = Math.max(0, Math.floor(offsetX / DAY_WIDTH));
                        initUI();
                    }
                }
            }
        }

        function dropOrbOnJob(e, jobId) {
            e.preventDefault(); e.stopPropagation();
            const type = e.dataTransfer.getData("type");
            const resId = e.dataTransfer.getData("id");
            if (type === "orb" && resId) {
                state.jobs.forEach(function(j) { 
                    j.assigned = j.assigned.filter(function(aid) { return aid !== resId; }); 
                });
                const job = state.jobs.find(function(j) { return j.id === jobId; });
                if (job && job.assigned.indexOf(resId) === -1) job.assigned.push(resId);
                initUI();
            }
        }

        document.addEventListener('DOMContentLoaded', initUI);
    </script>
</body>
</html>
