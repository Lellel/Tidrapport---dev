<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="theme.css">
  <script src="kravkoll.js"></script>
  <script src="theme.js"></script>
  <script src="moduler.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offerter & ÄTA</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg: var(--t-bg); --panel: var(--t-panel); --card: var(--t-card); --line: var(--t-line); --text: var(--t-text); --muted: var(--t-muted); --accent: var(--t-accent); --ok: var(--t-ok); --warn: var(--t-warn); --danger: var(--t-danger); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--t-font); }
    .wrap { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 14px 90px; display: flex; flex-direction: column; gap: 12px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; }
    .topbar a { color: var(--accent); text-decoration: none; font-size: var(--t-fs-link); font-weight: 700; }
    h1 { font-size: var(--t-fs-title); margin: 0; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    .grid2, .grid3 { display: grid; gap: 8px; }
    .cust-hits { display: grid; gap: 4px; }
    .deal { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 4px 0; border-top: 1px solid var(--line); }
    .grid2 { grid-template-columns: 1fr 1fr; }
    .grid3 { grid-template-columns: repeat(3, 1fr); }
    label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 4px; }
    input, textarea, select { width: 100%; padding: 10px; border-radius: var(--t-r); border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: var(--t-fs-input); }
    textarea { min-height: 70px; resize: vertical; }
    input[type=checkbox] { width: 22px; height: 22px; padding: 0; accent-color: var(--ok); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--t-r-card); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .muted { color: var(--muted); font-size: 12px; }
    .msg { font-size: 13px; min-height: 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .cust-hits .lpv-btn { justify-content: flex-start; text-align: left; }
    .ocard { display: flex; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: var(--t-r); padding: 12px; cursor: pointer; }
    .ocard b { font-size: 14px; }
    .status { display: inline-block; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; }
    .s-utkast { background: #334155; } .s-skickad { background: #1d4ed8; } .s-öppnad { background: #7c3aed; }
    .brand { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: #1e293b; color: #cbd5e1; margin-left: 4px; }
    .s-godkänd { background: var(--ok); } .s-avböjd { background: var(--danger); } .s-makulerad { background: #475569; text-decoration: line-through; }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .orow { background: var(--card); border: 1px solid var(--line); border-radius: var(--t-r); padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .orow .full { grid-column: 1 / -1; }
    .orow .rowfoot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .orow input, .orow select { padding: 8px; font-size: var(--t-fs-input); }
    .addbtns { display: flex; flex-wrap: wrap; gap: 6px; }
    .totals { background: var(--card); border-radius: var(--t-r); padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
    .totals div { display: flex; justify-content: space-between; }
    .totals .pay { font-size: 18px; font-weight: 800; color: var(--accent); border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
    .banner { border-radius: var(--t-r); padding: 10px 12px; font-size: 13px; }
    .banner.info { background: rgba(56,189,248,.12); border: 1px solid var(--accent); }
    .banner.warn { background: rgba(245,158,11,.12); border: 1px solid var(--warn); }
    .banner.good { background: rgba(16,185,129,.12); border: 1px solid var(--ok); }
    .timeline { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
    .sticky { position: fixed; left: 0; right: 0; bottom: 0; background: var(--t-overlay); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 8px; justify-content: center; }
    .sticky > * { flex: 1; max-width: 240px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--panel); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: var(--t-r-card) 18px 0 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .wall { background: var(--card); border-radius: var(--t-r); padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .wall .full { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
    .result { background: var(--card); border-radius: var(--t-r); padding: 10px; font-size: 14px; }
    #line-map { height: 320px; flex-shrink: 0; border-radius: var(--t-r); border: 1px solid var(--line); position: relative; }
    .modal > * { flex-shrink: 0; }
    .map-tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .placing { outline: 3px solid var(--warn); }
    .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .sec-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
    input[type=range] { padding: 0; }
    .swatches { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .swatch { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 0; padding: 6px; width: 76px; border-radius: var(--t-r); font-size: 10px; font-weight: 600; line-height: 1.15; }
    .swatch .chip { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); }
    .copt { background: var(--card); border: 1px solid var(--line); border-radius: var(--t-r); overflow: hidden; }
    .copt img { width: 100%; display: block; cursor: pointer; }
    .copt .cbody { padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
    .colors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    .photo-prev { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--t-r); }
    @media (max-width: 520px) { .orow { grid-template-columns: 1fr 1fr; } .wall { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <div class="sticky" id="sticky" style="display:none"></div>

  <div class="modal-bg" id="modal-bg" onclick="if (event.target === this) closeModal()">
    <div class="modal" id="modal"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="knappar.js"></script>
  <script src="inloggning.js"></script>
  <script src="sasong.js"></script>
  <script src="sno.js"></script>
  <script src="linjer.js"></script>
  <script>
    // Offerter & ÄTA (admin). Belopp räknas likadant här som i Kod.gs (computeOfferTotals) – backend är facit.
    let offers = [], settings = null;
    let view = 'list';         // list | edit | settings
    let statusFilter = 'aktiva';
    let draft = null;          // offerten som redigeras
    let message = '';
    let brands = null;         // { lpv: { label, connected }, ... } från backend
    let scope = null;          // null = admin på LPV (allt); "Klaryta"/"LPV" = bara det bolagets offerter
    let brandFilter = 'alla';
    let customers = null;      // kundregistret (hämtas när det behövs)
    let customerSearch = '', pickSearch = '', openCustomer = '';
    let newCust = null;        // ＋ Ny kund: formulärets värden medan det är öppet

    const KIND_LABELS = { arbete: 'Arbete', maskin: 'Maskin', material: 'Material', resa: 'Resa', ovrigt: 'Övrigt' };
    const money = (v) => Math.round(v).toLocaleString('sv-SE') + ' kr';
    const esc = snoEscape;

    // Samma gissning som guessBrand i Kod.gs: fasad -> Fasadmålarna, linjer -> Linjemålarna, annars LPV
    function brandOf(o) {
      if (o.brandSet && o.brand) return o.brand;
      if (o.facade || (o.colorOptions && o.colorOptions.length)) return 'fasadmalarna';
      if (o.layout) return 'linjemalarna';
      return 'lpv';
    }
    const brandLabel = (k) => (brands && brands[k] ? brands[k].label : k);
    function hubspotIcon(o) {
      if (!o.sent) return '';
      const s = (o.hubspot || {}).status;
      if (s === 'ok') return '<span title="Finns i HubSpot">🟢</span>';
      if (s === 'fel') return `<span title="${esc((o.hubspot || {}).message || 'Fel mot HubSpot')}">⚠️</span>`;
      return '<span title="Väntar på HubSpot">⏳</span>';
    }

    function setMessage(text) { message = text; const el = document.getElementById('msg'); if (el) el.innerHTML = text; }

    function computeTotals(o) {
      const vat = settings.vatPercent / 100;
      let net = 0, deductibleNet = 0;
      o.rows.forEach(r => { const sum = (Number(r.qty) || 0) * (Number(r.price) || 0); net += sum; if (r.deductible) deductibleNet += sum; });
      const vatAmount = net * vat, gross = net + vatAmount;
      let deduction = 0, label = '';
      if (o.customerType === 'privat' && (o.deduction === 'rot' || o.deduction === 'rut')) {
        const rate = (o.deduction === 'rot' ? settings.rotPercent : settings.rutPercent) / 100;
        const cap = (o.deduction === 'rot' ? settings.rotCapPerPerson : settings.rutCapPerPerson) * Math.max(1, Number(o.deductionPersons) || 1);
        deduction = Math.min(deductibleNet * (1 + vat) * rate, cap);
        label = `${o.deduction.toUpperCase()}-avdrag ${o.deduction === 'rot' ? settings.rotPercent : settings.rutPercent} %`;
      }
      return { net, vat: vatAmount, gross, deduction, label, toPay: gross - deduction, capped: deduction > 0 && deduction === (o.deduction === 'rot' ? settings.rotCapPerPerson : settings.rutCapPerPerson) * Math.max(1, Number(o.deductionPersons) || 1) };
    }

    // ================= LISTA =================
    function renderList() {
      const active = ['utkast', 'skickad', 'öppnad'];
      const list = offers.filter(o => statusFilter === 'alla' || (statusFilter === 'aktiva' ? active.includes(o.status) : o.status === statusFilter))
        .filter(o => brandFilter === 'alla' || brandOf(o) === brandFilter);
      const bchip = (key, text) => `<button class="lpv-chip ${brandFilter === key ? 'on' : ''}" onclick="brandFilter='${key}'; render()">${text}</button>`;
      const chip = (key, text) => `<button class="lpv-chip ${statusFilter === key ? 'on' : ''}" onclick="statusFilter='${key}'; render()">${text}</button>`;
      const count = (st) => offers.filter(o => o.status === st).length;
      return `
        <div class="grid2">
          <button class="lpv-btn primary" onclick="newOffer('offert')">➕ Ny offert</button>
          <button class="lpv-btn" onclick="newOffer('ata')">➕ Ny ÄTA</button>
        </div>
        <div class="msg" id="msg">${message}</div>
        <div class="chips">${chip('aktiva', 'Pågående')}${chip('godkänd', `✅ Godkända (${count('godkänd')})`)}${chip('avböjd', `❌ Avböjda (${count('avböjd')})`)}${chip('alla', 'Alla')}</div>
        ${brands ? `<div class="chips">${bchip('alla', 'Alla varumärken')}${Object.keys(brands).map(k => bchip(k, esc(brands[k].label))).join('')}</div>` : ''}
        ${list.map(o => `
          <div class="ocard" onclick="openOffer('${esc(o.id)}')">
            <div>
              <b>${esc(o.customerName)}</b> <span class="muted">${esc(o.id)}${o.version > 1 ? ' v' + o.version : ''}</span><span class="brand">${esc(brandLabel(brandOf(o)))}</span> ${hubspotIcon(o)}<br>
              <span class="muted">${esc(o.title || (o.type === 'ata' ? 'ÄTA' : 'Offert'))}</span>
            </div>
            <div style="text-align:right">
              <span class="status s-${esc(o.status)}">${esc(o.status)}</span><br>
              <b style="font-size:13px">${money(o.totals.toPay)}</b>
            </div>
          </div>`).join('') || '<div class="muted">Inga offerter här.</div>'}`;
    }

    function newOffer(type) {
      draft = { id: '', type, version: 1, status: 'utkast', customerName: '', customerType: 'privat', phone: '', email: '', site: '',
        title: '', description: '', rows: [], deduction: type === 'ata' ? 'inget' : 'rot', deductionPersons: 1, validUntil: '', colorOptions: [] };
      const d = new Date(); d.setDate(d.getDate() + settings.validDays);
      draft.validUntil = d.toISOString().slice(0, 10);
      // Från fältet: offerter.html?ny=offert&kund=...&plats=...
      const q = new URLSearchParams(location.search);
      if (q.get('plats')) draft.site = q.get('plats');
      resetColorState();
      view = 'edit'; message = ''; render();
    }

    function openOffer(id) {
      draft = JSON.parse(JSON.stringify(offers.find(o => o.id === id)));
      resetColorState();
      view = 'edit'; message = ''; render();
    }

    // ================= REDIGERA =================
    function locked() { return draft.status === 'godkänd' || draft.status === 'makulerad'; }

    function renderEdit() {
      const t = computeTotals(draft);
      const sent = ['skickad', 'öppnad', 'avböjd'].includes(draft.status) || (draft.status === 'utkast' && draft.version > 1);
      const dis = locked() ? 'disabled' : '';
      const seg = (field, val, text) => `<button class="${draft[field] === val ? 'on' : ''}" ${dis} onclick="setField('${field}', '${val}')">${text}</button>`;
      return `
        <div class="topbar"><button type="button" class="lpv-back" onclick="backToList()"><span data-icon="tillbaka">←</span> Alla offerter</button><span class="status s-${esc(draft.status)}">${esc(draft.status)}</span></div>
        <h1>${draft.type === 'ata' ? '<span data-icon="ata">🔧</span> ÄTA' : '<span data-icon="offerter">📄</span> Offert'} ${esc(draft.id || '(ny)')}${draft.version > 1 ? ` <span class="muted">version ${draft.version}</span>` : ''}</h1>
        ${draft.status === 'godkänd' ? `<div class="banner good">✅ Godkänd av <b>${esc(draft.approvedBy)}</b> ${esc(draft.answered)}. Jobbet <b>${esc(draft.jobId)}</b> ligger i planeringen.${draft.customerComment ? `<br>Kommentar: <i>${esc(draft.customerComment)}</i>` : ''}</div>` : ''}
        ${draft.status === 'avböjd' ? `<div class="banner warn">❌ Avböjd ${esc(draft.answered)}${draft.customerComment ? `: <i>${esc(draft.customerComment)}</i>` : ''}. Ändra och skicka en ny version om du vill.</div>` : ''}
        ${['skickad', 'öppnad'].includes(draft.status) ? '<div class="banner info">✏️ Ändrar du något skapas en ny version. Kunden får då ny PDF och ny länk, och den gamla länken slutar gälla.</div>' : ''}
        ${draft.status === 'utkast' && draft.version > 1 ? '<div class="banner warn">📨 Ändrad efter att den skickats – tryck <b>Skicka</b> så får kunden den nya versionen.</div>' : ''}
        ${draft.pdfUrl ? `<a href="${esc(draft.pdfUrl)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;font-size:13px;">📄 Öppna senast skickade PDF</a>` : ''}

        <div class="card">
          <h2>Kund</h2>
          ${locked() || draft.sent ? '' : renderCustomerPicker()}
          <input placeholder="Kundens namn *" value="${esc(draft.customerName)}" ${dis} oninput="draft.customerName=this.value">
          <div class="lpv-seg block">${seg('customerType', 'privat', '🏠 Privatperson')}${seg('customerType', 'foretag', '🏢 Företag/BRF')}</div>
          <div class="grid2">
            <input type="tel" placeholder="Mobil" value="${esc(draft.phone)}" ${dis} oninput="draft.phone=this.value">
            <input type="email" placeholder="E-post (PDF skickas hit)" value="${esc(draft.email)}" ${dis} oninput="draft.email=this.value">
          </div>
          <input placeholder="Arbetsplats / adress" value="${esc(draft.site)}" ${dis} oninput="draft.site=this.value">
          ${renderPickedHistory()}
          ${renderBrandPicker(dis)}
        </div>

        <div class="card">
          <h2>Arbetet</h2>
          <input placeholder="Rubrik, t.ex. Målning av fasad, 2 strykningar" value="${esc(draft.title)}" ${dis} oninput="draft.title=this.value">
          <textarea placeholder="Beskrivning som kunden ser" ${dis} oninput="draft.description=this.value">${esc(draft.description)}</textarea>
          <div class="rows">${draft.rows.map((r, i) => renderRow(r, i, dis)).join('') || '<div class="muted">Inga rader ännu – lägg till nedan.</div>'}</div>
          ${draft.layout && layoutHasPlacedSections(draft.layout) ? `<div class="banner info">🗺️ P-platserna är utritade – kunden ser dem på karta, och den här ritningen kommer med i PDF:en:
            <img src="${renderLayoutPng(draft.layout, { title: draft.title || 'Ritning p-platser' })}" alt="Ritning" style="width:100%;margin-top:8px;border-radius:8px;background:#fff;"></div>` : ''}
          ${locked() ? '' : `<div class="addbtns">
            <button class="lpv-btn" onclick="addRow('arbete')">➕ Arbete</button>
            <button class="lpv-btn" onclick="addRow('maskin')">➕ Maskin</button>
            <button class="lpv-btn" onclick="addRow('resa')">➕ Restid</button>
            <button class="lpv-btn" onclick="addRow('material')">➕ Material</button>
            <button class="lpv-btn" onclick="addRow('ovrigt')">➕ Övrigt</button>
            <button class="lpv-btn" onclick="openFacade()">🏠 ${draft.facade ? 'Ändra fasadmått' : 'Fasadmålning'}</button>
            <button class="lpv-btn" onclick="openLines()">🅿️ ${draft.layout ? 'Ändra linjeritning' : 'Linjemålning'}</button>
          </div>`}
        </div>

        ${renderColorCard(dis)}

        <div class="card">
          <h2>Avdrag & giltighet</h2>
          ${draft.customerType === 'privat' ? `<div class="lpv-seg block">${seg('deduction', 'rot', 'ROT')}${seg('deduction', 'rut', 'RUT')}${seg('deduction', 'inget', 'Inget')}</div>
          ${draft.deduction !== 'inget' ? `<div class="grid2"><div><label>Antal personer som delar avdraget</label><input type="number" min="1" max="4" value="${draft.deductionPersons}" ${dis} oninput="draft.deductionPersons=this.value; refreshTotals()"></div><div class="muted" style="align-self:end">Taket är ${money(draft.deduction === 'rot' ? settings.rotCapPerPerson : settings.rutCapPerPerson)} per person och år.</div></div>` : ''}`
          : '<div class="muted">Företag och BRF kan inte få ROT/RUT.</div>'}
          <div><label>Giltig till</label><input type="date" value="${esc(draft.validUntil)}" ${dis} onchange="draft.validUntil=this.value"></div>
        </div>

        <div class="totals" id="totals">${renderTotals(t)}</div>
        <div class="msg" id="msg">${message}</div>
        <div class="timeline">
          ${draft.created ? `<span>Skapad ${esc(draft.created)} av ${esc(draft.createdBy)}</span>` : ''}
          ${draft.sent ? `<span>Skickad ${esc(draft.sent)}</span>` : ''}
          ${draft.opened ? `<span>👀 Öppnad av kunden ${esc(draft.opened)}</span>` : ''}
          ${draft.answered ? `<span>Besvarad ${esc(draft.answered)}</span>` : ''}
        </div>
        ${draft.id && !locked() ? '<button class="lpv-btn danger" onclick="cancelOffer()">🗑️ Makulera</button>' : ''}`;
    }

    function renderRow(r, i, dis) {
      return `<div class="orow">
        <input class="full" placeholder="Text på raden" value="${esc(r.text)}" ${dis} oninput="draft.rows[${i}].text=this.value">
        <select ${dis} onchange="draft.rows[${i}].kind=this.value">${Object.entries(KIND_LABELS).map(([k, v]) => `<option value="${k}" ${r.kind === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <input type="number" step="0.5" placeholder="Antal" value="${r.qty}" ${dis} oninput="draft.rows[${i}].qty=this.value; refreshTotals()">
        <input placeholder="Enhet" value="${esc(r.unit)}" ${dis} oninput="draft.rows[${i}].unit=this.value">
        <input type="number" placeholder="À-pris" value="${r.price}" ${dis} oninput="draft.rows[${i}].price=this.value; refreshTotals()">
        <label style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;font-size:12px;" title="Arbetskostnad som ger ROT/RUT"><input type="checkbox" ${r.deductible ? 'checked' : ''} ${dis} onchange="draft.rows[${i}].deductible=this.checked; refreshTotals()"> ROT/RUT-grund</label>
        <div class="rowfoot"><b id="rowsum-${i}">${money((Number(r.qty) || 0) * (Number(r.price) || 0))}</b>${dis ? '' : `<button class="lpv-btn danger" style="min-height:32px" onclick="removeRow(${i})">Ta bort</button>`}</div>
      </div>`;
    }

    function renderTotals(t) {
      return `<div><span>Summa exkl. moms</span><span>${money(t.net)}</span></div>
        <div><span>Moms ${settings.vatPercent} %</span><span>${money(t.vat)}</span></div>
        <div><span>Summa inkl. moms</span><span>${money(t.gross)}</span></div>
        ${t.deduction ? `<div><span>${t.label}${t.capped ? ' (tak)' : ''}</span><span>−${money(t.deduction)}</span></div>` : ''}
        <div class="pay"><span>Kunden betalar</span><span>${money(t.toPay)}</span></div>`;
    }

    // ================= KUNDREGISTER =================
    async function loadCustomers() {
      if (customers) return customers;
      const res = await snoApi({ action: 'getCustomers' });
      customers = res.status === 'success' ? res.customers : [];
      return customers;
    }
    async function showCustomers() { view = 'customers'; message = ''; render(); if (!customers) { await loadCustomers(); render(); } }

    function customerMatches(c, q) {
      q = q.trim().toLowerCase();
      return !q || [c.name, c.company, c.contact, c.email, c.phone, c.address, c.orgnr, c.fortnoxNr].some(v => String(v || '').toLowerCase().includes(q));
    }
    const kr = (v) => Math.round(Number(v) || 0).toLocaleString('sv-SE') + ' kr';
    function renderDeals(c) {
      if (!c.deals || !c.deals.length) return '<div class="muted">Inga tidigare affärer.</div>';
      return c.deals.map(d => `<div class="deal"><span>${esc(d.name)}<br><span class="muted">${esc(d.closed || d.created)} · ${esc(d.stage)}</span></span><b>${kr(d.amount)}</b></div>`).join('');
    }

    // Import från Fortnox: en tabellfil (tab, semikolon eller komma) med rubrikerna Kundnr, Namn, Orgnr, Postnr, Ort, Telefon, E-post
    const IMPORT_COLS = { nr: /^kund ?nr|^kundnummer/i, name: /^namn|^kundnamn/i, orgnr: /^org/i, type: /^typ/i, address: /^adress|^gatuadress/i,
      postnr: /^post ?nr|^postnummer/i, city: /^ort/i, phone: /^tel/i, email: /^e-?post|^mail/i };
    function parseCustomerFile(text) {
      const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
      const sep = ['\t', ';', ','].sort((a, b) => lines[0].split(b).length - lines[0].split(a).length)[0];
      const head = lines[0].split(sep).map(h => h.trim().replace(/^"|"$/g, ''));
      const map = {};
      head.forEach((h, i) => { const k = Object.keys(IMPORT_COLS).find(k => IMPORT_COLS[k].test(h)); if (k && map[k] === undefined) map[k] = i; });
      if (map.nr === undefined || map.name === undefined) throw new Error('Hittar inte kolumnerna Kundnr och Namn i första raden.');
      return lines.slice(1).map(l => { const c = l.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
        const o = {}; Object.keys(map).forEach(k => { o[k] = c[map[k]] || ''; }); return o; }).filter(o => o.nr && o.name);
    }
    async function importCustomerFile(file) {
      if (!file) return;
      let list;
      try { list = parseCustomerFile(await file.text()); } catch (e) { setMessage('❌ ' + esc(e.message)); return; }
      if (!confirm(`Importera ${list.length} kunder från ${file.name}?\n\nKunder som redan finns (samma Fortnox-nummer, organisationsnummer eller e-post) uppdateras – inget skrivs över, bara tomma fält fylls i.`)) return;
      let created = 0, updated = 0;
      for (let i = 0; i < list.length; i += 400) {
        setMessage(`📥 Importerar ${Math.min(i + 400, list.length)} av ${list.length}…`);
        const res = await snoApi({ action: 'importCustomers', customers: list.slice(i, i + 400) });
        if (res.status !== 'success') { setMessage('❌ ' + esc(res.message || 'Importen misslyckades.')); return; }
        created += res.created; updated += res.updated;
      }
      customers = null; await loadCustomers();
      message = `✅ Klart: ${created} nya kunder, ${updated} fanns redan och kompletterades.`;
      render();
    }

    function renderCustomers() {
      if (!customers) return '<div class="muted">Hämtar kundregistret…</div>';
      const importBox = scope ? `<div class="msg" id="msg">${message}</div>` : `<div class="msg" id="msg">${message}</div><label class="btn-like" style="display:block;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:12px;cursor:pointer;font-weight:700;font-size:13px">📥 Importera kunder från Fortnox (tabellfil)<input type="file" accept=".tsv,.csv,.txt" style="display:none" onchange="importCustomerFile(this.files[0])"></label>`;
      if (!customers.length) return importBox + renderNewCustomer() + `<div class="card"><h2>Kundregistret är tomt</h2><div class="muted">${scope ? 'Inga kunder för ' + esc(scope) + ' ännu.' : 'Importera från Fortnox ovan, eller hämta från HubSpot under ⚙️ Inställningar → HubSpot.'}</div></div>`;
      const list = customers.filter(c => customerMatches(c, customerSearch));
      return importBox + renderNewCustomer() + `<input placeholder="🔎 Sök namn, kundnr, orgnr, telefon, e-post, adress" value="${esc(customerSearch)}" oninput="customerSearch=this.value; document.getElementById('custlist').innerHTML=renderCustomerList()">
        <div id="custlist">${renderCustomerList(list)}</div>`;
    }
    // ＋ Ny kund (bara i appen, inte HubSpot – se docs/pass-rattning.md)
    function renderNewCustomer() {
      if (!newCust) return `<button class="lpv-btn block" onclick="newCust={ type: 'foretag', rotRut: 'none', company: 'LPV' }; render()">＋ Ny kund</button>`;
      const n = newCust, f = (k, label, ph, type) => `<div><label>${label}</label><input ${type ? `type="${type}"` : ''} placeholder="${ph || ''}" value="${esc(n[k] || '')}" oninput="newCust.${k}=this.value"></div>`;
      return `<div class="card"><h2>＋ Ny kund</h2>
        <div class="lpv-seg block">${[['foretag', '🏢 Företag / BRF'], ['privat', '🏠 Privatperson']].map(([v, l]) => `<button class="${n.type === v ? 'on' : ''}" onclick="newCust.type='${v}'; render()">${l}</button>`).join('')}</div>
        ${f('name', 'Namn', n.type === 'privat' ? 'För- och efternamn' : 'Företagets namn')}
        <div class="grid2">
          ${n.type === 'privat' ? `<div><label>ROT/RUT</label><select onchange="newCust.rotRut=this.value">${[['none', 'Inget'], ['rot', 'ROT'], ['rut', 'RUT']].map(([v, l]) => `<option value="${v}" ${n.rotRut === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : f('orgnr', 'Org.nr', '556123-4567')}
          ${n.type === 'privat' ? '<div></div>' : f('contact', 'Kontaktperson', 'Namn')}
          ${f('phone', 'Telefon', '070…', 'tel')}
          ${f('email', 'E-post', 'namn@exempel.se', 'email')}
        </div>
        ${f('address', 'Adress', 'Gata 1, 642 30 Flen')}
        ${scope ? '' : `<label>Bolag</label><div class="lpv-seg block">${['LPV', 'Klaryta'].map(c => `<button class="${n.company === c ? 'on' : ''}" onclick="newCust.company='${c}'; render()">${c}</button>`).join('')}</div>`}
        <div class="muted" style="margin-top:6px">Kunden sparas i kundregistret i appen (inte i HubSpot). Personnummer sparas inte.</div>
        <div class="chips"><button class="lpv-btn primary" onclick="saveNewCustomer(this)">💾 Spara kund</button><button class="lpv-btn" onclick="newCust=null; render()">Avbryt</button></div>
      </div>`;
    }
    async function saveNewCustomer(btn) {
      if (!(newCust.name || '').trim()) { message = '⚠️ Skriv kundens namn.'; render(); return; }
      btn.disabled = true;
      let res;
      try { res = await snoApi({ action: 'saveCustomer', customer: newCust }); } catch (e) { res = { status: 'error', message: 'Ingen kontakt med servern.' }; }
      if (res.status !== 'success') { message = '❌ ' + esc(res.message || 'Kunde inte spara.'); render(); return; }
      customers = null; await loadCustomers();
      newCust = null; openCustomer = res.customer.id; customerSearch = res.customer.name;
      message = '✅ ' + esc(res.customer.name) + ' tillagd i kundregistret.'; render();
    }

    function renderCustomerList(list) {
      list = list || customers.filter(c => customerMatches(c, customerSearch));
      return `<div class="muted">${list.length} kunder</div>` + list.slice(0, 200).map(c => `
        <div class="ocard" style="flex-direction:column" onclick="openCustomer = openCustomer === '${esc(c.id)}' ? '' : '${esc(c.id)}'; document.getElementById('custlist').innerHTML=renderCustomerList()">
          <div style="display:flex;justify-content:space-between;gap:8px">
            <div><b>${esc(c.name)}</b>${c.contact ? ` <span class="muted">${esc(c.contact)}</span>` : ''}${c.brand ? `<span class="brand">${esc(c.brand)}</span>` : ''}${c.fortnoxNr ? `<span class="brand">Fortnox ${esc(c.fortnoxNr)}</span>` : ''}<br>
              <span class="muted">${esc([c.phone, c.email].filter(Boolean).join(' · '))}</span></div>
            <span class="muted" style="white-space:nowrap">${c.deals.length ? c.deals.length + ' affärer' : ''}</span>
          </div>
          ${openCustomer === c.id ? `<div onclick="event.stopPropagation()">
            ${c.address ? `<div class="muted">📍 ${esc(c.address)}</div>` : ''}${c.orgnr ? `<div class="muted">Org.nr ${esc(c.orgnr)}</div>` : ''}
            ${renderDeals(c)}
            <button class="lpv-btn primary" style="margin-top:8px" onclick="newOffer('offert'); pickCustomer('${esc(c.id)}')">➕ Ny offert till kunden</button></div>` : ''}
        </div>`).join('') + (list.length > 200 ? '<div class="muted">Visar 200 – sök för att hitta fler.</div>' : '');
    }

    function renderCustomerPicker() {
      return `<input placeholder="🔎 Välj kund ur registret (namn, telefon, e-post)" value="${esc(pickSearch)}" onfocus="loadCustomers().then(updatePickHits)" oninput="pickSearch=this.value; updatePickHits()">
        <div class="cust-hits" id="pickhits"></div>`;
    }
    function updatePickHits() {
      const el = document.getElementById('pickhits');
      if (!el || !customers) return;
      if (!pickSearch.trim()) { el.innerHTML = customers.length ? '' : '<div class="muted">Kundregistret är tomt – hämta från HubSpot under ⚙️.</div>'; return; }
      const hits = customers.filter(c => customerMatches(c, pickSearch)).slice(0, 8);
      el.innerHTML = hits.map(c => `<button class="lpv-btn" onclick="pickCustomer('${esc(c.id)}')">${esc(c.company && c.type === 'foretag' ? c.company : c.name)} <span class="muted">${esc([c.phone, c.address].filter(Boolean).join(' · '))}${c.deals.length ? ' · ' + c.deals.length + ' affärer' : ''}</span></button>`).join('') || '<div class="muted">Ingen träff.</div>';
    }
    function pickCustomer(id) {
      const c = (customers || []).find(x => x.id === id);
      if (!c || !draft) return;
      draft.customerType = c.type === 'foretag' ? 'foretag' : 'privat';
      draft.customerName = c.type === 'foretag' && c.company ? c.company : c.name;
      if (draft.customerType === 'foretag') draft.deduction = 'inget';
      draft.phone = c.phone || draft.phone; draft.email = c.email || draft.email; draft.site = draft.site || c.address;
      draft.pickedCustomer = c.id;
      pickSearch = '';
      render();
    }
    function renderPickedHistory() {
      const c = draft.pickedCustomer && (customers || []).find(x => x.id === draft.pickedCustomer);
      return c && c.deals.length ? `<details><summary class="muted">📜 ${c.deals.length} tidigare affärer med kunden</summary>${renderDeals(c)}</details>` : '';
    }

    function renderBrandPicker(dis) {
      const current = brandOf(draft);
      if (draft.sent) return `<div class="muted">Varumärke: <b>${esc(brandLabel(current))}</b> ${hubspotIcon(draft)} ${draft.hubspot && draft.hubspot.message ? esc(draft.hubspot.message) : ''}</div>`;
      const keys = brands ? Object.keys(brands) : ['lpv', 'fasadmalarna', 'linjemalarna', 'klaryta'];
      return `<label>Varumärke${draft.brandSet ? '' : ' (väljs efter innehållet tills du väljer själv)'}</label>
        <div class="lpv-seg block">${keys.map(k => `<button class="${current === k ? 'on' : ''}" ${dis} onclick="draft.brand='${k}'; draft.brandSet=true; render()" style="display:flex;align-items:center;justify-content:center;gap:6px"><img src="loggor/${k}.png" alt="" style="height:20px;max-width:70px;object-fit:contain;background:#fff;border-radius:4px;padding:2px">${esc(brandLabel(k))}</button>`).join('')}</div>`;
    }

    function refreshTotals() {
      document.getElementById('totals').innerHTML = renderTotals(computeTotals(draft));
      draft.rows.forEach((r, i) => { const el = document.getElementById('rowsum-' + i); if (el) el.innerText = money((Number(r.qty) || 0) * (Number(r.price) || 0)); });
    }

    function setField(field, value) {
      draft[field] = value;
      if (field === 'customerType' && value === 'foretag') draft.deduction = 'inget';
      render();
    }

    function addRow(kind, extra = {}) {
      const defaults = {
        arbete: { text: 'Arbete', unit: 'tim', price: settings.hourlyWork, deductible: true },
        maskin: { text: 'Maskintimme', unit: 'tim', price: settings.hourlyMachine, deductible: false },
        resa: { text: 'Restid', unit: 'tim', price: settings.travelPerHour, deductible: false },
        material: { text: 'Material', unit: 'st', price: 0, deductible: false },
        ovrigt: { text: '', unit: 'st', price: 0, deductible: false }
      }[kind];
      draft.rows.push({ kind, qty: 1, ...defaults, ...extra });
      render();
    }

    function removeRow(i) { draft.rows.splice(i, 1); render(); }

    function backToList() { view = 'list'; draft = null; message = ''; render(); }

    async function saveDraft() {
      setMessage('Sparar…');
      const res = await snoApi({ action: 'saveOffer', offer: draft });
      if (res.status !== 'success') { setMessage('❌ ' + esc(res.message || 'Kunde inte spara.')); return null; }
      const keepPdf = draft.pdfUrl;
      draft = { ...res.offer, pdfUrl: keepPdf };
      upsertLocal(draft);
      message = '✅ Sparad';
      render();
      return res;
    }

    function upsertLocal(o) {
      const idx = offers.findIndex(x => x.id === o.id);
      if (idx === -1) offers.unshift(o); else offers[idx] = o;
    }

    async function saveAndMaybeSend() {
      const res = await saveDraft();
      if (res && res.changedAfterSend && confirm(`Offerten är ändrad och blev version ${res.offer.version}.\n\nSkicka den nya versionen (PDF + länk) till kunden nu?`)) {
        await sendOffer();
      }
    }

    async function sendOffer() {
      const res0 = await saveDraft();
      if (!res0) return;
      setMessage('📨 Skapar PDF och skickar…');
      const appUrl = location.origin + location.pathname.replace(/offerter\.html$/, 'index.html');
      // Skalenlig ritning av p-platserna följer med in i PDF:en
      const drawingPng = draft.layout && layoutHasPlacedSections(draft.layout) ? renderLayoutPng(draft.layout, { title: draft.title || 'Ritning p-platser' }) : '';
      const res = await snoApi({ action: 'sendOffer', id: draft.id, appUrl, drawingPng });
      if (res.status !== 'success') { setMessage('❌ ' + esc(res.message || 'Kunde inte skicka.')); return; }
      draft = { ...res.offer, pdfUrl: res.pdfUrl, totals: computeTotals(res.offer) };
      upsertLocal(draft);
      const link = `${appUrl}?${draft.type}=${encodeURIComponent(draft.id)}&code=${encodeURIComponent(res.code)}`;
      message = '';
      render();
      openSentModal(link, res);
    }

    function openSentModal(link, res) {
      const t = computeTotals(draft);
      const label = draft.type === 'ata' ? 'tilläggsarbete (ÄTA)' : 'offert';
      sentLink = link;
      const sms = `Hej ${draft.customerName}! Här kommer ${draft.version > 1 ? 'en uppdaterad ' : 'vår '}${label} ${draft.id}${draft.title ? ' – ' + draft.title : ''}, ${money(t.toPay)}. Läs och godkänn här: ${link}`;
      sentSms = sms;
      openModal(`
        <h2>📨 ${draft.id} ${draft.version > 1 ? `(version ${draft.version}) ` : ''}är skickad</h2>
        ${res.emailNote ? `<div class="banner ${/kunde inte/i.test(res.emailNote) ? 'warn' : 'good'}">✉️ ${esc(res.emailNote)}</div>` : '<div class="muted">Ingen e-post angiven – skicka med SMS nedan.</div>'}
        ${res.pdfNote ? `<div class="banner warn">${esc(res.pdfNote)}</div>` : ''}
        ${res.pdfUrl ? `<a href="${esc(res.pdfUrl)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;">📄 Öppna PDF:en</a>` : ''}
        <button class="lpv-btn primary" id="sms-btn" onclick="sendSms()">💬 Skicka SMS till kunden</button>
        <button class="lpv-btn" id="copy-btn" onclick="copyLink()">🔗 Kopiera kundlänken</button>
        <button class="lpv-btn" onclick="closeModal()">Klar</button>`);
    }

    let sentLink = '', sentSms = '';
    // Skickas via 46elks från servern. Är tjänsten inte inställd (eller numret saknas) öppnas Meddelanden som förut.
    async function sendSms() {
      const btn = document.getElementById('sms-btn');
      const openMessages = () => { location.href = `sms:${draft.phone || ''}?&body=${encodeURIComponent(sentSms)}`; };
      if (!draft.phone) { openMessages(); return; }
      if (btn) { btn.disabled = true; btn.innerText = 'Skickar SMS… ⏳'; }
      let res;
      try { res = await snoApi({ action: 'sendSms', type: 'offer', to: draft.phone, message: sentSms }); }
      catch (err) { res = { status: 'error', message: 'Ingen kontakt med servern.' }; }
      if (res.status === 'success') { if (btn) btn.innerText = `✅ SMS skickat från ${res.sender}`; return; }
      if (btn) { btn.disabled = false; btn.innerText = '💬 Skicka SMS till kunden'; }
      if (res.code === 'not_configured' || confirm('❌ ' + (res.message || 'SMS kunde inte skickas.') + '\n\nÖppna Meddelanden i stället?')) openMessages();
    }
    function copyLink() {
      navigator.clipboard.writeText(sentLink).then(() => { document.getElementById('copy-btn').innerText = '✅ Kopierad'; })
        .catch(() => prompt('Kopiera länken:', sentLink));
    }

    async function cancelOffer() {
      if (!confirm(`Makulera ${draft.id}? Kundens länk slutar fungera.`)) return;
      const res = await snoApi({ action: 'cancelOffer', id: draft.id });
      if (res.status !== 'success') { setMessage('❌ ' + esc(res.message)); return; }
      draft.status = 'makulerad'; upsertLocal(draft); backToList();
    }

    // ================= KULÖRFÖRSLAG (AI målar om ett foto av huset) =================
    // Ett foto och egna förslag per huskropp. Kunden väljer ett alternativ per huskropp.
    let colorPhotos = {};          // huskropp -> { photo: dataURL (bara i telefonen), beforeId: Drive-ID efter första förslaget }
    let colorBuilding = '';        // vald huskropp för nästa förslag
    let colorPick = { main: 0, detail: -1, windows: -1 };  // index i paletten, -1 = behåll befintlig
    let colorBusy = false;

    function palette() {
      return String(settings.facadeColors || '').split('\n').map(line => {
        const [name, ncs, hex] = line.split('|').map(x => (x || '').trim());
        return name ? { name, ncs: ncs || '', hex: /^#[0-9a-fA-F]{6}$/.test(hex || '') ? hex : '#999999' } : null;
      }).filter(Boolean);
    }
    const driveImg = (id) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w800`;

    function knownBuildings() {
      const names = [...(draft.facade ? draft.facade.buildings.map(b => b.name) : []), ...(draft.colorOptions || []).map(o => o.building)];
      return [...new Set(names.filter(Boolean))];
    }
    function photoState() { return colorPhotos[colorBuilding] || (colorPhotos[colorBuilding] = { photo: '', beforeId: '' }); }
    function resetColorState() {
      colorPhotos = {};
      (draft.colorOptions || []).forEach(o => { if (o.beforeId && !colorPhotos[o.building || '']) colorPhotos[o.building || ''] = { photo: '', beforeId: o.beforeId }; });
      colorBuilding = knownBuildings()[0] || '';
    }

    function swatchRow(key, allowKeep) {
      const pal = palette();
      return `<div class="swatches">${allowKeep ? `<button class="lpv-toggle swatch ${colorPick[key] === -1 ? 'on' : ''}" onclick="colorPick.${key}=-1; render()"><span class="chip" style="background:repeating-linear-gradient(45deg,#334155,#334155 4px,#1e293b 4px,#1e293b 8px)"></span>Behåll</button>` : ''}
        ${pal.map((c, i) => `<button class="lpv-toggle swatch ${colorPick[key] === i ? 'on' : ''}" onclick="colorPick.${key}=${i}; render()"><span class="chip" style="background:${c.hex}"></span>${esc(c.name)}<span style="opacity:.7">${esc(c.ncs)}</span></button>`).join('')}</div>`;
    }

    function colorLabel(o) {
      const t = (c) => c ? `${c.name}${c.ncs ? ' (' + c.ncs + ')' : ''}` : 'befintlig';
      return `Fasad: ${t(o.main)} · Detaljer: ${t(o.detail)} · Fönster/dörrar: ${t(o.windows)}`;
    }

    function renderColorCard(dis) {
      const opts = draft.colorOptions || [];
      const groups = [...new Set(opts.map(o => o.building || ''))];
      const buildings = knownBuildings();
      const ps = photoState();
      return `<div class="card">
        <h2>🎨 Kulörförslag ${opts.length ? `<span class="muted">(${opts.length})</span>` : ''}</h2>
        ${groups.map(g => `${g || groups.length > 1 ? `<h2 style="font-size:13px;margin:4px 0 0;">${esc(g || 'Utan huskropp')}</h2>` : ''}
          <div class="colors-grid">${opts.map((o, i) => (o.building || '') !== g ? '' : `<div class="copt">
            <img src="${driveImg(o.imageId)}" data-after="${driveImg(o.imageId)}" data-before="${o.beforeId ? driveImg(o.beforeId) : ''}" onclick="if (this.dataset.before) this.src = this.src === this.dataset.after ? this.dataset.before : this.dataset.after" alt="Alternativ ${i + 1}">
            <div class="cbody"><span><b>Alternativ ${i + 1}</b><br>${esc(o.label)}</span>${dis ? '' : `<button class="lpv-btn danger" style="min-height:30px" onclick="draft.colorOptions.splice(${i},1); render()">✕</button>`}</div>
          </div>`).join('')}</div>`).join('')}
        ${opts.length ? '<div class="muted">Tryck på en bild för att växla före/efter. Kunden väljer ett alternativ per huskropp.</div>' : ''}
        ${dis ? (draft.chosenColor ? `<div class="banner good">Kunden valde: <b>${esc(draft.chosenColor)}</b></div>` : '') : `
          <div><label>Huskropp</label><div class="chips">
            ${buildings.map(n => `<button class="lpv-chip ${colorBuilding === n ? 'on' : ''}" onclick="colorBuilding=${esc(JSON.stringify(n))}; render()">${esc(n)}</button>`).join('')}
            <button class="lpv-btn" onclick="const n = prompt('Namn på huskroppen:', ''); if (n && n.trim()) { colorBuilding = n.trim(); render(); }">➕ Annan</button>
            ${colorBuilding && !buildings.includes(colorBuilding) ? `<button class="lpv-chip on">${esc(colorBuilding)}</button>` : ''}
          </div>${!buildings.length && !colorBuilding ? '<div class="muted">Lägg till huskroppar i fasadmallen, eller tryck "Annan".</div>' : ''}</div>
          ${ps.photo || ps.beforeId ? `<img class="photo-prev" src="${ps.photo || driveImg(ps.beforeId)}" alt="Foto av ${esc(colorBuilding || 'huset')}">` : `<div class="muted">Ta ett foto av ${esc(colorBuilding ? colorBuilding.toLowerCase() : 'huset')} rakt framifrån i dagsljus – AI:n målar om fasaden och låter resten vara.</div>`}
          <input type="file" id="color-photo" accept="image/*" style="display:none" onchange="pickColorPhoto(event)">
          <button class="lpv-btn" onclick="document.getElementById('color-photo').click()">📷 ${ps.photo || ps.beforeId ? 'Byt foto' : 'Foto av ' + esc(colorBuilding ? colorBuilding.toLowerCase() : 'huset')}</button>
          <div><label>Fasad</label>${swatchRow('main', false)}</div>
          <div><label>Detaljer – knutar, foder, vindskivor</label>${swatchRow('detail', true)}</div>
          <div><label>Fönster & dörrar</label>${swatchRow('windows', true)}</div>
          <button class="lpv-btn primary" ${colorBusy || !(ps.photo || ps.beforeId) || opts.length >= 12 ? 'disabled' : ''} onclick="createColorOption()">${colorBusy ? '✨ AI målar… (10–30 s)' : `✨ Skapa förslag${colorBuilding ? ' för ' + esc(colorBuilding.toLowerCase()) : ''}`}</button>
          ${opts.length >= 12 ? '<div class="muted">Max 12 förslag per offert.</div>' : ''}`}
        <div class="muted">Färger på skärm skiljer sig från verklig kulör – rekommendera färgprov.</div>
      </div>`;
    }

    async function pickColorPhoto(event) {
      const file = event.target.files[0];
      if (!file) return;
      const ps = photoState();
      ps.photo = await compressPhoto(file, 1600);
      ps.beforeId = '';
      render();
    }

    function compressPhoto(file, maxSide) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function createColorOption() {
      const pal = palette();
      const pick = (i) => i >= 0 && pal[i] ? pal[i] : null;
      const choice = { main: pick(colorPick.main), detail: pick(colorPick.detail), windows: pick(colorPick.windows) };
      if (!choice.main) { setMessage('Välj en fasadfärg.'); return; }
      const ps = photoState();
      const building = colorBuilding;
      colorBusy = true; message = ''; render();
      try {
        const res = await snoApi({ action: 'recolorHouse', ...choice, beforeId: ps.beforeId, imageBase64: ps.beforeId ? '' : ps.photo });
        if (res.beforeId) { ps.beforeId = res.beforeId; ps.photo = ''; }
        if (res.status !== 'success') { message = '❌ ' + esc(res.message || 'AI:n svarade inte.'); }
        else {
          draft.colorOptions = draft.colorOptions || [];
          draft.colorOptions.push({ imageId: res.imageId, beforeId: res.beforeId, ...choice, label: colorLabel(choice), building });
          message = '🎨 Nytt kulörförslag – kom ihåg att spara/skicka offerten.';
        }
      } catch (err) {
        message = '❌ Ingen kontakt med servern.';
      }
      colorBusy = false; render();
    }

    // ================= MALL: FASADMÅLNING =================
    // En eller flera huskroppar (bostadshus, garage, förråd …), var och en med egna väggar.
    // Varje huskropp blir egna rader i offerten. Måtten sparas med offerten (draft.facade).
    let facadeBuildings = [];
    const FACADE_ROW_PREFIXES = ['Fasadmålning', 'Fasadfärg'];
    const BUILDING_NAMES = ['Bostadshus', 'Garage', 'Förråd', 'Gäststuga', 'Carport', 'Ladugård'];

    function openFacade() {
      facadeBuildings = draft.facade && draft.facade.buildings
        ? JSON.parse(JSON.stringify(draft.facade.buildings))
        : [{ name: 'Bostadshus', walls: [{ name: 'Vägg 1', width: 8, height: 3, peak: 0, sub: 3 }] }];
      renderFacade();
    }
    function wallArea(w) {
      const width = Number(w.width) || 0;
      return Math.max(0, width * (Number(w.height) || 0) + width * (Number(w.peak) || 0) / 2 - (Number(w.sub) || 0));
    }
    function buildingCalc(bld) {
      const m2 = bld.walls.reduce((s, w) => s + wallArea(w), 0);
      return { m2, hours: Math.ceil(m2 / (settings.facadeM2PerHour || 1)), liters: Math.ceil(m2 * settings.facadeCoats / (settings.facadeM2PerLiter || 1)) };
    }
    function renderFacade() {
      const unused = BUILDING_NAMES.filter(n => !facadeBuildings.some(b => b.name === n));
      openModal(`
        <h2>🏠 Fasadmålning</h2>
        <div class="muted">Lägg till varje huskropp och mät vägg för vägg. Gavelspets = höjden på triangeln ovanför väggen. Avdrag = fönster och dörrar i m².</div>
        ${facadeBuildings.map((bld, b) => `<div class="card" style="padding:10px;gap:8px;">
          <div class="sec-head"><input value="${esc(bld.name)}" oninput="facadeBuildings[${b}].name=this.value" style="font-weight:800;max-width:60%">
            ${facadeBuildings.length > 1 ? `<button class="lpv-btn danger" style="min-height:32px" onclick="facadeBuildings.splice(${b},1); renderFacade()">Ta bort huskropp</button>` : ''}</div>
          ${bld.walls.map((w, i) => `<div class="wall">
            <div class="full"><input value="${esc(w.name)}" oninput="facadeBuildings[${b}].walls[${i}].name=this.value" style="max-width:60%"><button class="lpv-btn danger" style="min-height:32px" onclick="facadeBuildings[${b}].walls.splice(${i},1); renderFacade()">Ta bort</button></div>
            <div><label>Bredd m</label><input type="number" step="0.1" value="${w.width}" oninput="facadeBuildings[${b}].walls[${i}].width=this.value; facadeRefresh()"></div>
            <div><label>Höjd m</label><input type="number" step="0.1" value="${w.height}" oninput="facadeBuildings[${b}].walls[${i}].height=this.value; facadeRefresh()"></div>
            <div><label>Gavelspets m</label><input type="number" step="0.1" value="${w.peak}" oninput="facadeBuildings[${b}].walls[${i}].peak=this.value; facadeRefresh()"></div>
            <div><label>Avdrag m²</label><input type="number" step="0.5" value="${w.sub}" oninput="facadeBuildings[${b}].walls[${i}].sub=this.value; facadeRefresh()"></div>
          </div>`).join('')}
          <button class="lpv-btn" onclick="facadeBuildings[${b}].walls.push({ name: 'Vägg ' + (facadeBuildings[${b}].walls.length + 1), width: 6, height: 2.5, peak: 0, sub: 0 }); renderFacade()">➕ Vägg</button>
          <div class="muted" id="facade-res-${b}">${buildingResult(buildingCalc(bld))}</div>
        </div>`).join('')}
        <div class="addbtns">${unused.slice(0, 4).map(n => `<button class="lpv-btn" onclick="addBuilding('${n}')">➕ ${n}</button>`).join('')}<button class="lpv-btn" onclick="addBuilding(prompt('Namn på huskroppen:', '') || '')">➕ Annan</button></div>
        <div class="result" id="facade-result">${facadeTotal()}</div>
        <div class="grid2"><button class="lpv-btn" onclick="closeModal()">Avbryt</button><button class="lpv-btn primary" onclick="applyFacade()">Lägg till i offerten</button></div>`);
    }
    function addBuilding(name) {
      if (!name.trim()) return;
      facadeBuildings.push({ name: name.trim(), walls: [{ name: 'Vägg 1', width: 6, height: 2.5, peak: 0, sub: 0 }] });
      renderFacade();
    }
    function buildingResult(c) { return `<b>${Math.round(c.m2)} m²</b> · ${c.hours} tim · ${c.liters} liter färg`; }
    function facadeTotal() {
      const t = facadeBuildings.map(buildingCalc).reduce((s, c) => ({ m2: s.m2 + c.m2, hours: s.hours + c.hours, liters: s.liters + c.liters }), { m2: 0, hours: 0, liters: 0 });
      return `Totalt <b>${Math.round(t.m2)} m²</b> · ${settings.facadeCoats} strykningar<br>Arbete: <b>${t.hours} tim</b> (${settings.facadeM2PerHour} m²/tim) · Färg: <b>${t.liters} liter</b> (${settings.facadeM2PerLiter} m²/liter)`;
    }
    function facadeRefresh() {
      facadeBuildings.forEach((bld, b) => { const el = document.getElementById('facade-res-' + b); if (el) el.innerHTML = buildingResult(buildingCalc(bld)); });
      document.getElementById('facade-result').innerHTML = facadeTotal();
    }
    function applyFacade() {
      // Ersätt tidigare fasadrader så att mallen kan öppnas och justeras flera gånger
      draft.rows = draft.rows.filter(r => !FACADE_ROW_PREFIXES.some(p => String(r.text).startsWith(p)));
      const many = facadeBuildings.length > 1;
      facadeBuildings.forEach(bld => {
        const c = buildingCalc(bld);
        if (c.m2 <= 0) return;
        const name = many || bld.name !== 'Bostadshus' ? ' ' + bld.name.toLowerCase() : '';
        draft.rows.push({ kind: 'arbete', text: `Fasadmålning${name} ${Math.round(c.m2)} m², ${settings.facadeCoats} strykningar inkl. förarbete`, qty: c.hours, unit: 'tim', price: settings.hourlyWork, deductible: true });
        draft.rows.push({ kind: 'material', text: `Fasadfärg${name}`, qty: c.liters, unit: 'liter', price: settings.facadePaintPerLiter, deductible: false });
      });
      draft.facade = { buildings: facadeBuildings };
      if (!colorBuilding) colorBuilding = facadeBuildings[0] ? facadeBuildings[0].name : '';
      if (!draft.title) draft.title = 'Fasadmålning';
      closeModal(); render();
    }

    // ================= MALL: LINJEMÅLNING =================
    // Rutor som står bredvid varandra delar sidolinje: n rutor = n+1 sidolinjer (+ ev. bakkant).
    // Sektionerna placeras på kartan och sparas med offerten (draft.layout) – kunden ser ritningen.
    let lineSections = [];
    let lineSymbols = 0;
    let lineMap = null, lineLayer = null, lineAnchors = [];
    let placingIdx = -1;
    let lineSat = false;
    const LINE_ROW_PREFIXES = ['Linjemålning parkering', 'Symboler (schablon)', 'Etablering'];

    function openLines() {
      const saved = draft.layout && draft.layout.sections;
      lineSections = saved ? JSON.parse(JSON.stringify(saved)) : [{ count: 10, width: 2.5, depth: 5, back: false, double: false, rotation: 0, anchor: null }];
      lineSymbols = draft.layout ? draft.layout.symbols || 0 : 0;
      placingIdx = -1;
      openModal(`
        <h2>🅿️ Linjemålning</h2>
        <div class="muted">Lägg till sektioner (en rad rutor = en sektion), tryck <b>📍 Placera</b> och sedan på kartan där radens första ruta börjar. Vrid med reglaget, dra i pricken för att flytta.</div>
        <div class="map-tools">
          <button class="lpv-btn" onclick="toggleLineTiles()">🛰️ Satellit / karta</button>
          <button class="lpv-btn" onclick="fitLineMap()">🔍 Visa alla</button>
        </div>
        <div id="line-map"></div>
        <div id="line-sections"></div>
        <button class="lpv-btn" onclick="addLineSection()">➕ Sektion</button>
        <div><label>Symboler (HKP, elbil, pilar…)</label><input type="number" value="${lineSymbols}" oninput="lineSymbols=this.value; linesRefresh()"></div>
        <div class="result" id="lines-result"></div>
        <div class="grid2"><button class="lpv-btn" onclick="closeModal()">Avbryt</button><button class="lpv-btn primary" onclick="applyLines()">Lägg till i offerten</button></div>`);
      renderLineSections();
      initLineMap();
    }

    async function initLineMap() {
      if (typeof SNO_MAP_MISSING !== 'undefined' && SNO_MAP_MISSING) {
        document.getElementById('line-map').innerHTML = '<div class="muted" style="padding:20px;text-align:center;">Kartan kan inte visas utan täckning – siffrorna fungerar ändå.</div>';
        return;
      }
      if (lineMap) { lineMap.remove(); lineMap = null; }
      lineMap = L.map('line-map', { zoomControl: true, maxZoom: 21 });
      lineMap._tiles = L.tileLayer(SNO_TILES.street, { maxZoom: 21, maxNativeZoom: 19 }).addTo(lineMap);
      lineMap.on('click', (e) => {
        if (placingIdx < 0) return;
        lineSections[placingIdx].anchor = [e.latlng.lat, e.latlng.lng];
        placingIdx = -1;
        renderLineSections(); redrawLines();
      });
      setTimeout(() => lineMap.invalidateSize(), 50);
      if (lineSections.some(sec => Array.isArray(sec.anchor))) { redrawLines(); fitLineMap(); return; }
      lineMap.setView(SNO_FLEN_CENTER, 15);
      if (draft.site) {
        try {
          const geo = await snoApi({ action: 'geocode', address: draft.site });
          if (geo.status === 'success' && lineMap) lineMap.setView([geo.lat, geo.lng], 19);
        } catch (err) { /* stanna på Flen */ }
      }
    }

    function toggleLineTiles() {
      if (!lineMap) return;
      lineSat = !lineSat;
      lineMap.removeLayer(lineMap._tiles);
      lineMap._tiles = L.tileLayer(lineSat ? SNO_TILES.sat : SNO_TILES.street, { maxZoom: 21, maxNativeZoom: 19 }).addTo(lineMap);
    }

    function fitLineMap() {
      if (lineMap && lineLayer && lineLayer.getLayers().length) lineMap.fitBounds(lineLayer.getBounds(), { padding: [30, 30], maxZoom: 20 });
    }

    function redrawLines() {
      if (lineMap) {
        if (lineLayer) lineMap.removeLayer(lineLayer);
        lineAnchors.forEach(m => lineMap.removeLayer(m));
        lineLayer = drawLineLayout(lineMap, { sections: lineSections });
        // Dragbar prick vid varje sektions ankare
        lineAnchors = lineSections.map((sec, i) => {
          if (!Array.isArray(sec.anchor)) return null;
          const m = L.marker(sec.anchor, { draggable: true, icon: L.divIcon({ className: '', iconSize: [22, 22],
            html: `<div style="width:22px;height:22px;border-radius:50%;background:${LINE_COLORS[i % LINE_COLORS.length]};border:3px solid #fff;box-shadow:0 1px 4px #000;"></div>` }) }).addTo(lineMap);
          m.on('drag', (e) => { lineSections[i].anchor = [e.latlng.lat, e.latlng.lng]; redrawLinesOnly(); });
          return m;
        }).filter(Boolean);
      }
      linesRefresh();
    }

    function redrawLinesOnly() {
      if (!lineMap) return;
      if (lineLayer) lineMap.removeLayer(lineLayer);
      lineLayer = drawLineLayout(lineMap, { sections: lineSections });
    }

    function renderLineSections() {
      document.getElementById('line-sections').innerHTML = lineSections.map((sec, i) => `<div class="wall ${placingIdx === i ? 'placing' : ''}">
        <div class="full sec-head">
          <b><span class="sec-dot" style="background:${LINE_COLORS[i % LINE_COLORS.length]}"></span>Sektion ${String.fromCharCode(65 + i)}${Array.isArray(sec.anchor) ? '' : ' <span class="muted">(ej placerad)</span>'}</b>
          <span style="display:flex;gap:6px;">
            <button class="lpv-btn" style="min-height:32px" onclick="startPlacing(${i})">📍 ${placingIdx === i ? 'Tryck på kartan…' : (Array.isArray(sec.anchor) ? 'Flytta' : 'Placera')}</button>
            <button class="lpv-btn danger" style="min-height:32px" onclick="lineSections.splice(${i},1); renderLineSections(); redrawLines()">Ta bort</button>
          </span>
        </div>
        <div><label>Antal rutor</label><input type="number" value="${sec.count}" oninput="lineSections[${i}].count=this.value; redrawLinesOnly(); linesRefresh()"></div>
        <div><label>Bredd m</label><input type="number" step="0.1" value="${sec.width}" oninput="lineSections[${i}].width=this.value; redrawLinesOnly(); linesRefresh()"></div>
        <div><label>Djup m</label><input type="number" step="0.1" value="${sec.depth}" oninput="lineSections[${i}].depth=this.value; redrawLinesOnly(); linesRefresh()"></div>
        <div style="display:flex;flex-direction:column;gap:4px;justify-content:end;font-size:12px;">
          <label style="display:flex;gap:6px;align-items:center;margin:0;text-transform:none"><input type="checkbox" ${sec.back ? 'checked' : ''} onchange="lineSections[${i}].back=this.checked; redrawLinesOnly(); linesRefresh()"> Bakkant</label>
          <label style="display:flex;gap:6px;align-items:center;margin:0;text-transform:none"><input type="checkbox" ${sec.double ? 'checked' : ''} onchange="lineSections[${i}].double=this.checked; redrawLinesOnly(); linesRefresh()"> Dubbel</label>
        </div>
        <div class="full" style="gap:8px;">
          <label style="margin:0;white-space:nowrap;">Vrid <span id="rot-${i}">${sec.rotation || 0}°</span></label>
          <input type="range" min="0" max="359" value="${sec.rotation || 0}" style="flex:1" oninput="lineSections[${i}].rotation=Number(this.value); document.getElementById('rot-${i}').innerText=this.value+'°'; redrawLinesOnly()">
          <button class="lpv-btn" style="min-height:32px" onclick="lineSections[${i}].rotation=((Number(lineSections[${i}].rotation)||0)+90)%360; renderLineSections(); redrawLinesOnly()">↻ 90°</button>
        </div>
      </div>`).join('');
    }

    function startPlacing(i) {
      placingIdx = placingIdx === i ? -1 : i;
      renderLineSections();
    }

    function addLineSection() {
      const last = lineSections[lineSections.length - 1];
      lineSections.push({ count: 10, width: 2.5, depth: 5, back: false, double: false, rotation: last ? last.rotation || 0 : 0, anchor: null });
      placingIdx = lineSections.length - 1;
      renderLineSections();
    }

    function linesCalc() {
      const meters = lineSections.reduce((s, sec) => {
        const n = Math.max(0, Number(sec.count) || 0);
        if (!n) return s;
        const one = (n + 1) * (Number(sec.depth) || 0) + (sec.back ? n * (Number(sec.width) || 0) : 0);
        return s + one * (sec.double ? 2 : 1);
      }, 0);
      return { meters: Math.ceil(meters), stalls: lineSections.reduce((s, sec) => s + (Number(sec.count) || 0) * (sec.double ? 2 : 1), 0) };
    }
    function linesResult(c) {
      const unplaced = lineSections.filter(sec => !Array.isArray(sec.anchor)).length;
      return `<b>${c.stalls} rutor · ${c.meters} linjemeter</b> · ${Number(lineSymbols) || 0} symboler<br>
        ${money(c.meters * settings.lineMeterPrice)} + ${money((Number(lineSymbols) || 0) * settings.lineSymbolPrice)} + etablering ${money(settings.lineEstablishment)}
        ${unplaced ? `<br><span style="color:var(--warn)">⚠️ ${unplaced} sektion${unplaced > 1 ? 'er' : ''} inte placerad${unplaced > 1 ? 'e' : ''} – kunden ser bara de placerade på kartan.</span>` : ''}`;
    }
    function linesRefresh() { const el = document.getElementById('lines-result'); if (el) el.innerHTML = linesResult(linesCalc()); }
    function applyLines() {
      const c = linesCalc();
      // Ersätt tidigare linjerader så att mallen kan öppnas och justeras flera gånger
      draft.rows = draft.rows.filter(r => !LINE_ROW_PREFIXES.some(p => String(r.text).startsWith(p)));
      draft.rows.push({ kind: 'ovrigt', text: `Linjemålning parkering, ${c.stalls} rutor`, qty: c.meters, unit: 'm', price: settings.lineMeterPrice, deductible: false });
      if (Number(lineSymbols) > 0) draft.rows.push({ kind: 'ovrigt', text: 'Symboler (schablon)', qty: Number(lineSymbols), unit: 'st', price: settings.lineSymbolPrice, deductible: false });
      draft.rows.push({ kind: 'ovrigt', text: 'Etablering', qty: 1, unit: 'st', price: settings.lineEstablishment, deductible: false });
      draft.layout = { sections: lineSections.map(sec => ({ ...sec, count: Number(sec.count) || 0, width: Number(sec.width) || 2.5, depth: Number(sec.depth) || 5 })), symbols: Number(lineSymbols) || 0 };
      if (!draft.title) draft.title = 'Linjemålning parkering';
      closeModal(); render();
    }

    // ================= INSTÄLLNINGAR =================
    const SETTING_GROUPS = [
      ['Företaget (visas på PDF)', [['companyName', 'Namn', 'text'], ['companyOrgNr', 'Org.nr', 'text'], ['companyPhone', 'Telefon', 'text'], ['companyEmail', 'E-post', 'text'], ['companyAddress', 'Adress', 'text']]],
      ['Priser exkl. moms', [['hourlyWork', 'Timpris arbete (kr)', 'number'], ['hourlyMachine', 'Timpris maskin (kr)', 'number'], ['travelPerHour', 'Restid (kr/tim)', 'number']]],
      ['Avdrag & moms', [['rotPercent', 'ROT %', 'number'], ['rutPercent', 'RUT %', 'number'], ['rotCapPerPerson', 'ROT-tak per person (kr)', 'number'], ['rutCapPerPerson', 'RUT-tak per person (kr)', 'number'], ['vatPercent', 'Moms %', 'number']]],
      ['Offerten', [['validDays', 'Giltig antal dagar', 'number'], ['terms', 'Villkor (sist på PDF)', 'textarea']]],
      ['Fakturaunderlag', [['invoiceDueDays', 'Betalningsvillkor (dagar)', 'number'], ['companyBankgiro', 'Bankgiro', 'text'], ['companyFTax', 'F-skatt (text i sidfoten, tomt = visas inte)', 'text']]],
      ['Fasadmålning', [['facadeM2PerHour', 'm² per arbetstimme', 'number'], ['facadeM2PerLiter', 'm² per liter färg', 'number'], ['facadeCoats', 'Antal strykningar', 'number'], ['facadePaintPerLiter', 'Färgpris (kr/liter)', 'number']]],
      ['Kulörer för kulörförslag (Alcro, NCS)', [['facadeColors', 'En kulör per rad: Namn | NCS-kod | #skärmfärg', 'textarea']]],
      ['Linjemålning', [['lineMeterPrice', 'Pris per linjemeter (kr)', 'number'], ['lineSymbolPrice', 'Pris per symbol (kr)', 'number'], ['lineEstablishment', 'Etablering (kr)', 'number']]]
    ];
    function renderSettings() {
      return `${SETTING_GROUPS.map(([title, fields]) => `<div class="card"><h2>${title}</h2><div class="grid2">
        ${fields.map(([key, label, type]) => `<div style="${type === 'textarea' ? 'grid-column:1/-1' : ''}"><label>${label}</label>${type === 'textarea'
          ? `<textarea id="set-${key}">${esc(settings[key])}</textarea>`
          : `<input id="set-${key}" type="${type}" step="any" value="${esc(settings[key])}">`}</div>`).join('')}
      </div></div>`).join('')}
      <div class="muted">Kontrollera ROT/RUT-procent och tak mot Skatteverket inför varje år.</div>
      ${brands ? `<div class="card"><h2>HubSpot</h2>
        ${Object.keys(brands).map(k => `<div>${brands[k].connected ? '🟢' : '⏳'} <b>${esc(brands[k].label)}</b> <span class="muted">${brands[k].connected ? 'kopplat' : 'ingen nyckel ännu – offerterna väntar'}</span></div>`).join('')}
        <div class="muted">Väntande: ${offers.filter(o => o.sent && (o.hubspot || {}).status !== 'ok').length} skickade offerter är inte i HubSpot än.</div>
        <button class="lpv-btn" onclick="syncPending()">🔄 Skicka väntande till HubSpot</button>
        <button class="lpv-btn" onclick="importFromHubspot()">⬇️ Hämta kunder och affärer från HubSpot</button>
        <div class="muted">Hämtningen går att köra hur ofta som helst – inget dubbleras.</div></div>` : ''}
      <div class="msg" id="msg">${message}</div>`;
    }
    async function importFromHubspot() {
      let total = 0;
      for (let round = 1; round <= 10; round++) {
        setMessage(`⬇️ Hämtar från HubSpot… (omgång ${round}${total ? ', ' + total + ' kunder hittills' : ''})`);
        const res = await snoApi({ action: 'hubspotImport' });
        if (res.status !== 'success') { setMessage('❌ ' + esc(res.message || 'Kunde inte hämta.')); return; }
        total = res.total;
        if (res.done) {
          customers = null;
          setMessage(`✅ Klart! ${res.total} kunder i registret.` + (res.counts.dealsWithoutCustomer ? ` ${res.counts.dealsWithoutCustomer} affärer saknade kund och hoppades över.` : ''));
          return;
        }
      }
      setMessage(`⏳ ${total} kunder hämtade, men det finns mer. Tryck igen för att fortsätta.`);
    }

    async function syncPending() {
      setMessage('🔄 Skickar till HubSpot…');
      const res = await snoApi({ action: 'hubspotSyncPending' });
      if (res.status !== 'success') { setMessage('❌ ' + esc(res.message || 'Kunde inte skicka.')); return; }
      brands = res.brands || brands;
      const fresh = await snoApi({ action: 'getOffers' });
      if (fresh.status === 'success') offers = fresh.offers;
      message = `✅ ${res.synced} skickade till HubSpot` + (res.failed ? `, ⚠️ ${res.failed} fel: ${esc(res.errors.join('; '))}` : '') +
        (res.waiting ? `, ⏳ ${res.waiting} väntar på nyckel` : '') + (res.remaining ? `. ${res.remaining} kvar – tryck igen.` : '');
      render();
    }

    async function saveSettings() {
      const input = {};
      SETTING_GROUPS.forEach(([, fields]) => fields.forEach(([key, , type]) => {
        const v = document.getElementById('set-' + key).value;
        input[key] = type === 'number' ? Number(v) : v;
      }));
      setMessage('Sparar…');
      const res = await snoApi({ action: 'saveOfferSettings', settings: input });
      if (res.status !== 'success') { setMessage('❌ ' + esc(res.message)); return; }
      settings = res.settings; setMessage('✅ Inställningar sparade – gäller nya rader och offerter');
    }

    // ================= RAM =================
    function openModal(html) { document.getElementById('modal').innerHTML = html; document.getElementById('modal-bg').classList.add('open'); }
    function closeModal() {
      document.getElementById('modal-bg').classList.remove('open');
      if (lineMap) { lineMap.remove(); lineMap = null; lineLayer = null; lineAnchors = []; }
    }

    function render() {
      const app = document.getElementById('app');
      const sticky = document.getElementById('sticky');
      if (!settings) { app.innerHTML = `<div class="topbar"><a class="lpv-back" href="index.html"><span data-icon="tillbaka">←</span> Hem</a></div><h1><span data-icon="offerter">📄</span> Offerter & ÄTA</h1><div class="msg" id="msg">${message || 'Hämtar…'}</div>`; return; }
      const head = view === 'edit' ? '' : `<div class="topbar"><a class="lpv-back" href="index.html"><span data-icon="tillbaka">←</span> Hem</a></div><h1><span data-icon="offerter">📄</span> Offerter & ÄTA</h1>
        <div class="lpv-seg block"><button class="${view === 'list' ? 'on' : ''}" onclick="view='list'; message=''; render()">Offerter</button><button class="${view === 'customers' ? 'on' : ''}" onclick="showCustomers()">👥 Kunder</button>${scope ? '' : `<button class="${view === 'settings' ? 'on' : ''}" onclick="view='settings'; message=''; render()">⚙️ Inställningar</button>`}</div>`;
      if (scope && view === 'settings') view = 'list';
      app.innerHTML = head + (view === 'list' ? renderList() : view === 'edit' ? renderEdit() : view === 'customers' ? renderCustomers() : renderSettings());
      if (view === 'edit' && !locked()) {
        sticky.style.display = 'flex';
        sticky.innerHTML = `<button class="lpv-btn" onclick="saveAndMaybeSend()">💾 Spara</button><button class="lpv-btn primary" onclick="sendOffer()">📨 ${draft.status === 'utkast' && !draft.sent ? 'Spara & skicka' : 'Skicka igen'}</button>`;
      } else if (view === 'settings') {
        sticky.style.display = 'flex';
        sticky.innerHTML = '<button class="lpv-btn primary" onclick="saveSettings()">💾 Spara inställningar</button>';
      } else {
        sticky.style.display = 'none';
      }
    }

    async function load() {
      render();
      if (!snoIsAdmin()) { message = '⚠️ Offerter är bara för admin. Logga in med din admin-länk.'; }
      try {
        const res = await snoApi({ action: 'getOffers' });
        if (res.status !== 'success') { message = '❌ ' + esc(res.message || 'Kunde inte hämta.'); settings = null; render(); return; }
        offers = res.offers; settings = res.settings; brands = res.brands || null; scope = res.scope || null;
        const q = new URLSearchParams(location.search);
        if (q.get('id') && offers.find(o => o.id === q.get('id'))) openOffer(q.get('id'));
        else if (q.get('ny')) newOffer(q.get('ny') === 'ata' ? 'ata' : 'offert');
        else if (q.get('view') === 'customers') showCustomers(); // från menyn: 💼 Kunder
        else render();
      } catch (err) {
        message = '❌ Ingen kontakt med servern.'; render();
      }
    }
    load();
  </script>
</body>
</html>
