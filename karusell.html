<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kabanossen - 3D Cover Flow & CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Swiper.js för mjuk 3D Cover Flow -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #020617; 
      color: #f8fafc; 
      overflow-x: hidden;
      touch-action: manipulation;
    }
    .glass-card { 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); 
    }
    .swiper-slide {
      width: 280px;
      height: 380px;
      transition: all 0.3s ease;
    }
    .swiper-slide-active .glass-card {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 20px 40px -15px rgba(14, 165, 233, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto select-none">

  <!-- Header -->
  <header class="text-center pt-2 pb-4">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-bold uppercase tracking-wider mb-1">
      <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
      Dina Uppdrag
    </div>
    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">SVEP FÖR ATT BLÄDDRA</p>
  </header>

  <!-- 3D Cover Flow Karusell -->
  <div class="swiper mySwiper w-full py-4">
    <div class="swiper-wrapper" id="cardContainer">
      <!-- Korten genereras dynamiskt av JavaScript -->
    </div>
  </div>

  <!-- Action-knappar längst ner -->
  <footer class="space-y-3 pb-6">
    <div class="grid grid-cols-2 gap-3">
      <button onclick="openCurrentOrder()" class="py-3.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-2xl font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition active:scale-95">
        📋 ÖPPNA ORDER
      </button>
      <button onclick="exportCurrentVCard()" class="py-3.5 px-4 bg-sky-500 hover:bg-sky-400 text-slate-950 rounded-2xl font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-sky-500/20 transition active:scale-95">
        📞 SPARA KONTAKT
      </button>
    </div>
    
    <a href="prototyper.html" class="block text-center py-2 text-xs font-semibold text-slate-400 hover:text-white transition">
      ← Tillbaka till Prototypnav
    </a>
  </footer>

  <script>
    // Uppdragsdata
    const projects = [
      {
        id: "1043",
        client: "Johansson (Privat)",
        location: "Söderköping",
        date: "17 Maj",
        status: "OFFERT SKICKAD",
        statusBg: "bg-sky-500 text-slate-950",
        domain: "", // Privatperson - använder snygg LPV-badge
        phone: "070-123 45 67",
        email: "johansson@example.com"
      },
      {
        id: "1042",
        client: "Peab Asfalt",
        location: "Linköping",
        date: "12 Maj",
        status: "PÅGÅENDE",
        statusBg: "bg-amber-500 text-slate-950",
        domain: "peab.se",
        phone: "013-987 65 43",
        email: "kontakt@peab.se"
      },
      {
        id: "1041",
        client: "Skanska Industrial Solutions",
        location: "Norrköping",
        date: "04 Maj",
        status: "AVSLUTAD",
        statusBg: "bg-emerald-500 text-slate-950",
        domain: "skanska.se",
        phone: "011-555 12 34",
        email: "info@skanska.se"
      }
    ];

    let swiper;

    function renderCards() {
      const container = document.getElementById('cardContainer');
      container.innerHTML = projects.map((p, index) => {
        
        // Snygg logotyp-hantering utan trasig HTML
        let logoMarkup = '';
        if (p.domain) {
          logoMarkup = `
            <div class="h-20 w-full flex items-center justify-center p-2">
              <img src="https://logo.clearbit.com/${p.domain}" 
                   alt="${p.client}" 
                   class="max-h-full max-w-full object-contain pointer-events-none drop-shadow-md"
                   onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');" />
              <div class="hidden w-16 h-16 rounded-2xl bg-sky-500/20 border border-sky-400/30 flex items-center justify-center text-sky-400 font-black text-2xl">
                ${p.client.charAt(0)}
              </div>
            </div>`;
        } else {
          // Fallback för privatpersoner eller saknad domän
          logoMarkup = `
            <div class="h-20 w-full flex items-center justify-center">
              <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-sky-400 to-emerald-400 p-0.5 shadow-lg shadow-sky-500/20">
                <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center text-white font-black text-2xl">
                  ${p.client.charAt(0)}
                </div>
              </div>
            </div>`;
        }

        return `
          <div class="swiper-slide">
            <div class="glass-card w-full h-full rounded-3xl p-6 flex flex-col justify-between text-center relative overflow-hidden">
              
              <div class="space-y-2">
                ${logoMarkup}
                <h2 class="text-xl font-black text-white leading-tight mt-2">${p.client}</h2>
                <p class="text-xs font-medium text-slate-400">${p.location}</p>
              </div>

              <div class="space-y-3">
                <div class="flex justify-between items-center text-[11px] font-bold text-slate-400 uppercase tracking-wider px-2">
                  <span>Order #${p.id}</span>
                  <span>${p.date}</span>
                </div>
                <div class="w-full py-2.5 rounded-xl text-xs font-black uppercase tracking-wider ${p.statusBg}">
                  ${p.status}
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    // Initiera 3D Cover Flow
    function initSwiper() {
      swiper = new Swiper(".mySwiper", {
        effect: "coverflow",
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: "auto",
        coverflowEffect: {
          rotate: 30,
          stretch: 0,
          depth: 100,
          modifier: 1,
          slideShadows: false,
        },
      });
    }

    function getActiveProject() {
      return projects[swiper.activeIndex || 0];
    }

    function openCurrentOrder() {
      const p = getActiveProject();
      alert(`Öppnar order #${p.id} för ${p.client}`);
    }

    // Generera & Ladda ner vCard (.vcf)
    function exportCurrentVCard() {
      const p = getActiveProject();
      const vcardData = 
`BEGIN:VCARD
VERSION:3.0
FN:${p.client}
ORG:${p.client}
TEL;TYPE=CELL:${p.phone}
EMAIL:${p.email}
NOTE:Kabanossen PWA - Order #${p.id} (${p.location})
END:VCARD`;

      const blob = new Blob([vcardData], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.setAttribute("download", `${p.client.replace(/[^a-zA-Z0-0]/g, "_")}.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Starta vid laddning
    window.addEventListener('DOMContentLoaded', () => {
      renderCards();
      initSwiper();
    });
  </script>
</body>
</html>
