<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPV & Klaryta - DMT Framtidsradarn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ice: { 50: '#f0f9ff', 100: '#e0f2fe', 900: '#0c4a6e', 950: '#082f49' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; transition: background-color 0.5s ease, color 0.5s ease; }
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 32px rgba(34, 211, 238, 0.15); transition: all 0.3s ease; }
        .dark .glass-panel { background: rgba(8, 25, 45, 0.55); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); }
        .orb-kulpase-liten { width: 44px; height: 44px; font-size: 1.25rem; }
        .orb-kulpase-stor { width: 64px; height: 64px; font-size: 2rem; }
        .orb-gantt-liten { width: 32px; height: 32px; font-size: 0.875rem; z-index: 10; }
        .glass-orb { background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 100%); box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), 0 4px 10px rgba(0,0,0,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
        .dark .glass-orb { background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%); box-shadow: inset 0 2px 4px rgba(255,255,255,0.25), 0 6px 12px rgba(0,0,0,0.5); }
        .glass-orb:active { cursor: grabbing; transform: scale(1.05); }
        .owner-badge { position: absolute; bottom: -2px; right: -4px; font-size: 8px; font-weight: 900; padding: 2px 4px; border-radius: 4px; z-index: 20; border: 1px solid rgba(255,255,255,0.6); pointer-events: none; line-height: 1; color: white; }
        .bg-lpv { background-color: #0284c7; } .bg-klaryta { background-color: #16a34a; } .bg-ue { background-color: #d97706; }
        .gantt-job-card { border-radius: 12px; display: flex; align-items: center; padding: 0 12px; gap: 12px; position: relative; cursor: grab; transition: all 0.2s ease; }
        .gantt-job-card.lpv { background: linear-gradient(145deg, rgba(2, 132, 199, 0.7) 0%, rgba(3, 105, 161, 0.9) 100%); border: 1px solid rgba(125, 211, 252, 0.8); }
        .dark .gantt-job-card.lpv { background: linear-gradient(145deg, rgba(2, 105, 164, 0.85) 0%, rgba(7, 89, 133, 0.95) 100%); border: 1px solid rgba(56, 189, 248, 0.5); }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(14, 165, 233, 0.1); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.5); border-radius: 4px; }
        .modal-backdrop { background: rgba(3, 15, 28, 0.75); backdrop-filter: blur(10px); }
        .chip-checkbox:checked + label { background-color: rgba(217, 119, 6, 0.25); border-color: #d97706; color: #fef3c7; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-gradient-to-br from-sky-50 to-cyan-100 dark:from-[#030f1c] dark:to-[#082f49] text-slate-800 dark:text-slate-100 overflow-hidden">

    <!-- HEADER (Renare, ingen "Admin"-knapp) -->
    <header class="glass-panel h-16 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-sky-700 dark:text-sky-300 flex items-center gap-2 drop-shadow-md">
                🔭 Framtidsradarn <span class="text-sky-600/70 dark:text-slate-400 font-normal text-xs">(DMT Mockup)</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <!-- Ny Kund-knapp flyttad hit för att hålla affären samlad -->
            <button onclick="openClientModal()" class="px-3.5 py-2 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-700 dark:text-emerald-300 border border-emerald-400/30 rounded-xl font-bold text-xs transition flex items-center gap-1.5">
                <span>🏢</span> Ny Kund
            </button>
            <button onclick="toggleTheme()" class="w-9 h-9 rounded-full glass-panel flex items-center justify-center text-lg hover:scale-110 transition shadow-lg border border-sky-200 dark:border-sky-800/50">
                <span id="theme-icon">❄️</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <div class="flex flex-1 overflow-hidden relative">
        <!-- KULPÅSE / RESURSDEPÅ -->
        <aside id="resource-panel" class="w-[320px] flex flex-col border-r border-white/30 dark:border-sky-900/40 bg-white/20 dark:bg-slate-900/40 shrink-0 overflow-y-auto p-4 space-y-4 custom-scrollbar">
            <h2 class="text-xs font-bold text-sky-800 dark:text-sky-200 uppercase tracking-wider">🎒 Kulpåsen & Resursdepå</h2>

            <!-- PERSONAL -->
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col">
                <h3 class="text-[11px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-3">👥 Egen Personal</h3>
                <div id="pool-personnel" class="flex flex-wrap gap-3 min-h-[40px] mb-3"></div>
                <!-- DMT Knapp: Kontextuell -->
                <button onclick="openQuickAddModal('person')" class="w-full py-1.5 border border-dashed border-sky-400/50 dark:border-sky-600 text-sky-700 dark:text-sky-400 text-[10px] font-bold rounded-lg hover:bg-sky-400/10 transition">
                    + Ta in extra handtag (UE)
                </button>
            </div>

            <!-- MASKINER -->
            <div class="glass-panel p-3.5 rounded-2xl flex flex-col">
                <h3 class="text-[11px] font-bold text-sky-600 dark:text-sky-300 uppercase tracking-wider mb-3">🚜 Maskinpark</h3>
                <div id="pool-machines" class="flex flex-wrap gap-3 min-h-[40px] mb-3"></div>
                <!-- DMT Knapp: Kontextuell -->
                <button onclick="openQuickAddModal('machine')" class="w-full py-1.5 border border-dashed border-amber-500/50 dark:border-amber-600 text-amber-600 dark:text-amber-400 text-[10px] font-bold rounded-lg hover:bg-amber-400/10 transition">
                    + Hyr in maskin (UE)
                </button>
            </div>
        </aside>

        <!-- TIMELINE & ORDERBOOK -->
        <main class="flex-1 flex flex-col overflow-y-auto p-5 space-y-5 custom-scrollbar relative z-10">
            <section class="glass-panel p-4 rounded-2xl flex-1 flex flex-col min-h-[360px]">
                <h2 class="text-xs font-bold text-sky-700 dark:text-sky-300 uppercase tracking-wider mb-3">📅 Tidsperiod & Schemaläggning</h2>
                <div id="timeline-container" class="border border-white/40 dark:border-sky-900/50 rounded-xl bg-white/20 dark:bg-slate-950/40 flex-1 overflow-auto custom-scrollbar relative backdrop-blur-sm">
                    <div id="timeline-inner" class="flex flex-col min-h-full relative w-[1000px]">
                        <div class="h-10 border-b border-white/30 dark:border-sky-900/50 flex items-center bg-white/40 dark:bg-slate-900/70 shrink-0 sticky top-0 z-40 backdrop-blur-md">
                            <div class="w-56 px-4 font-bold text-sky-800 dark:text-slate-300 text-[10px] uppercase tracking-wider h-full flex items-center">Jobb / Kund</div>
                            <div class="flex-1 text-center text-[10px] font-bold text-slate-400">Tidslinje (Mockup)</div>
                        </div>
                        <div class="relative flex-1 p-4" id="gantt-rows">
                            <!-- Dummy Job -->
                            <div class="flex items-center h-[76px] border-b border-slate-800/40 relative">
                                <div class="w-56 p-2 shrink-0 h-full flex items-center z-30 sticky left-0">
                                    <div class="glass-panel p-2 rounded-xl w-full">
                                        <div class="text-[9px] font-bold text-slate-400 uppercase truncate">Coop Norrköping</div>
                                        <div class="font-bold text-xs text-slate-100 truncate">Snöröjning Parkering</div>
                                    </div>
                                </div>
                                <div class="flex-1 h-full relative" ondragover="allowDrop(event)" ondrop="dropOrbOnJob(event, 'j1')">
                                    <div class="gantt-job-card lpv absolute top-[6px] bottom-[6px] left-[10px] w-[300px]">
                                        <div class="flex items-center gap-1 z-40 relative text-[10px] text-sky-200" id="job-j1-orbs">
                                            Dra in resurser här...
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- MICRO-MODAL: QUICK ADD UE (DMT) -->
    <div id="quick-add-modal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-[200] p-4">
        <div class="glass-panel !bg-slate-900/95 border border-amber-500/30 max-w-sm w-full rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 id="qa-title" class="text-sm font-bold text-amber-400 flex items-center gap-2">
                    ➕ Hyr in Resurs
                </h3>
                <button onclick="closeQuickAddModal()" class="text-slate-400 hover:text-white transition">✕</button>
            </div>
            
            <form onsubmit="handleQuickAddSubmit(event)" class="space-y-3">
                <input type="hidden" id="qa-type" value="person">
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Leverantör (UE) *</label>
                    <select id="qa-supplier" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                        <option value="Svevia">Svevia</option>
                        <option value="PEAB">PEAB</option>
                        <option value="Bravida">Bravida</option>
                        <option value="Bemannia">Bemannia (Personal)</option>
                    </select>
                </div>

                <div>
                    <label id="qa-name-label" class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Namn / Förare *</label>
                    <input type="text" id="qa-name" required placeholder="t.ex. Kalle" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <!-- DYNAMISKT OMRÅDE FÖR TAGGAR -->
                <div id="qa-skills-area">
                    <label id="qa-skills-label" class="block text-[10px] font-bold text-amber-400 uppercase mb-1">Medhavda Redskap</label>
                    <div id="qa-skills-container" class="flex flex-wrap gap-2 text-[11px]">
                        <!-- Innehåll byts ut via JS -->
                    </div>
                </div>

                <div class="pt-3 border-t border-slate-800">
                    <button type="submit" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-amber-900/50 transition">
                        Lägg i Kulpåsen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let state = {
            resources: [
                { id: "Janus", name: "Janus", type: "person", ownerCompany: "LPV", color: "#0284c7", skills: "Arbetare", icon: "👦" },
                { id: "Kramer 1", name: "Kramer 37.8", type: "machine", sizeClass: "stor", ownerCompany: "LPV", color: "#0284c7", icon: "🚜" }
            ],
            jobAssignments: []
        };

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.getElementById('theme-icon').innerText = document.documentElement.classList.contains('dark') ? '❄️' : '☀️';
        }

        function initUI() {
            renderKulpase();
        }

        function renderKulpase() {
            const poolPersonnel = document.getElementById('pool-personnel');
            const poolMachines = document.getElementById('pool-machines');
            poolPersonnel.innerHTML = ''; poolMachines.innerHTML = '';

            state.resources.forEach(res => {
                if(state.jobAssignments.includes(res.id)) return; // Om på jobb, visa ej i kulpåse (i mockupen)

                let badgeClass = res.ownerCompany !== 'LPV' && res.ownerCompany !== 'Klaryta' ? 'bg-ue' : 'bg-lpv';
                let ownerText = badgeClass === 'bg-ue' ? 'UE' : 'LPV';
                let sizeClass = 'orb-kulpase-' + (res.sizeClass || 'liten');
                let displayIcon = '<span class="z-10 text-slate-800">' + res.icon + '</span>';

                let skillHtml = '';
                if (res.skills && res.skills !== "Arbetare") {
                    let firstSkill = res.skills.split(',')[0].trim();
                    skillHtml = '<div class="text-[8px] bg-slate-900/80 text-amber-400 border border-amber-500/30 rounded px-1 py-0.5 mt-0.5 truncate max-w-full">' + firstSkill + '</div>';
                }

                const html = `
                    <div class="flex flex-col items-center gap-1 w-[56px] shrink-0">
                        <div class="glass-orb ${sizeClass}" style="background-color: ${res.color}" draggable="true" ondragstart="onOrbDragStart(event, '${res.id}')">
                            ${displayIcon}
                            <span class="owner-badge ${badgeClass}">${ownerText}</span>
                        </div>
                        <span class="text-[9px] font-semibold text-sky-900 dark:text-slate-300 truncate w-full text-center">${res.name}</span>
                        ${skillHtml}
                    </div>
                `;
                
                if (res.type === 'person') poolPersonnel.innerHTML += html;
                else poolMachines.innerHTML += html;
            });
        }

        /* --- DMT MICRO-MODAL LOGIK --- */
        function openQuickAddModal(type) {
            document.getElementById('qa-type').value = type;
            const title = document.getElementById('qa-title');
            const nameLabel = document.getElementById('qa-name-label');
            const skillsLabel = document.getElementById('qa-skills-label');
            const skillsContainer = document.getElementById('qa-skills-container');

            if (type === 'person') {
                title.innerHTML = '👥 Ta in extra personal';
                nameLabel.innerText = 'Namn *';
                skillsLabel.innerText = 'Kompetenser (Valfritt)';
                skillsContainer.innerHTML = `
                    <input type="checkbox" id="qa-sk-el" value="Elektriker" class="hidden chip-checkbox">
                    <label for="qa-sk-el" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-400 cursor-pointer">⚡ El</label>
                    <input type="checkbox" id="qa-sk-vvs" value="VVS" class="hidden chip-checkbox">
                    <label for="qa-sk-vvs" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-400 cursor-pointer">💧 VVS</label>
                    <input type="checkbox" id="qa-sk-heta" value="Heta Arbeten" class="hidden chip-checkbox">
                    <label for="qa-sk-heta" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-400 cursor-pointer">🔥 Heta</label>
                `;
            } else {
                title.innerHTML = '🚜 Hyr in Maskin';
                nameLabel.innerText = 'Maskinmodell *';
                skillsLabel.innerText = 'Medhavda Redskap (Valfritt)';
                skillsContainer.innerHTML = `
                    <input type="checkbox" id="qa-eq-plog" value="Vikplog" class="hidden chip-checkbox">
                    <label for="qa-eq-plog" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-400 cursor-pointer">❄️ Plog</label>
                    <input type="checkbox" id="qa-eq-sand" value="Sandspridare" class="hidden chip-checkbox">
                    <label for="qa-eq-sand" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-400 cursor-pointer">🧂 Sand</label>
                    <input type="checkbox" id="qa-eq-gaffel" value="Pallgafflar" class="hidden chip-checkbox">
                    <label for="qa-eq-gaffel" class="px-2 py-1 rounded border border-slate-700 bg-slate-900 text-slate-400 cursor-pointer">🏗️ Gafflar</label>
                `;
            }

            document.getElementById('quick-add-modal').classList.remove('hidden');
            document.getElementById('quick-add-modal').classList.add('flex');
            document.getElementById('qa-name').focus(); // DMT: Sätt fokus direkt i skrivfältet
        }

        function closeQuickAddModal() {
            document.getElementById('quick-add-modal').classList.add('hidden');
            document.getElementById('quick-add-modal').classList.remove('flex');
            document.getElementById('qa-name').value = ''; // Rensa
        }

        function handleQuickAddSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('qa-type').value;
            const name = document.getElementById('qa-name').value;
            const supplier = document.getElementById('qa-supplier').value;

            // Hämta ikryssade
            const checkedBoxes = document.querySelectorAll('#qa-skills-container input:checked');
            const selectedSkills = Array.from(checkedBoxes).map(cb => cb.value).join(', ');

            // Bygg resurs
            const newRes = {
                id: name + Date.now(),
                name: name,
                type: type,
                ownerCompany: supplier, // Sparas som UE
                color: '#d97706', // Orange för UE
                icon: type === 'person' ? '👷‍♂️' : '🚜',
                sizeClass: type === 'person' ? 'liten' : 'stor',
                skills: selectedSkills || (type === 'person' ? 'Arbetare' : 'Maskin')
            };

            state.resources.push(newRes);
            closeQuickAddModal();
            renderKulpase();
        }

        // Mockup Drag & Drop
        function onOrbDragStart(e, id) { e.dataTransfer.setData("id", id); }
        function allowDrop(e) { e.preventDefault(); }
        function dropOrbOnJob(e, jobId) {
            e.preventDefault();
            const resId = e.dataTransfer.getData("id");
            if(resId) {
                state.jobAssignments.push(resId);
                const res = state.resources.find(r => r.id === resId);
                if(res) {
                    const jobContainer = document.getElementById('job-j1-orbs');
                    if(jobContainer.innerText === "Dra in resurser här...") jobContainer.innerHTML = '';
                    jobContainer.innerHTML += `<div class="glass-orb orb-gantt-liten border border-slate-800 shrink-0" style="background-color:${res.color}">${res.icon}</div>`;
                }
                renderKulpase();
            }
        }

        document.addEventListener('DOMContentLoaded', initUI);
    </script>
</body>
</html>
