<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Tidrapport</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <header>
      <h1>Tidrapport</h1>
      <div class="status-pill"><div class="status-dot"></div>Ansluten</div>
    </header>

    <div class="section-title">Uppdrag</div>
    <div class="ios-card">
      <div class="ios-row">
        <span>Datum</span>
        <input type="date" id="input-date">
      </div>
      <div class="ios-row">
        <span>Betalställe</span>
        <!-- Tills vi bygger Action sheet använder vi vanlig text-input -->
        <input type="text" id="input-place" placeholder="T.ex. Coop" class="val-text">
      </div>
      <div class="ios-row">
        <span>Aktivitet</span>
        <input type="text" id="input-activity" placeholder="T.ex. Snöröjning" class="val-text">
      </div>
      <textarea id="input-notes" placeholder="Vad har gjorts?"></textarea>
    </div>

    <div class="section-title">Tider</div>
    <div class="ios-card">
      <div class="ios-row">
        <span>Start</span>
        <input type="time" id="input-start">
      </div>
      <div class="ios-row">
        <span>Slut</span>
        <input type="time" id="input-end">
      </div>
    </div>

    <!-- Knappen som sparar formuläret till utkorgen -->
    <button class="main-btn" onclick="saveToOutbox()">Spara pass lokalt</button>

    <!-- UTKORGEN (Hanteras av app.js) -->
    <div id="outbox-section" style="display: none;">
      <div class="section-title" id="outbox-title">Dagens Utkorg</div>
      <div id="outbox-container">
        <!-- JavaScript fyller på korten här -->
      </div>
      
      <button class="submit-btn" onclick="submitAll()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        Skicka in underlag
      </button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
