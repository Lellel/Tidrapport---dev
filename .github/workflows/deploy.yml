name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta Dev-koden
        uses: actions/checkout@v4

      - name: Klona produktionsrepot
        run: |
          git clone https://x-access-token:${{ secrets.PROD_DEPLOY_TOKEN }}@github.com/Lellel/Tidsrapportering-och-annat-LPV.git prod_repo

      - name: Kopiera över logik, struktur och design
        run: |
          cp app.js prod_repo/
          cp style.css prod_repo/
          cp index.html prod_repo/
          cp sw.js prod_repo/
          cp sms.html prod_repo/
          cp avatar_onboarding.js install.js stalltvatt.js egenkontroll.js prod_repo/
          mkdir -p prod_repo/loggor && cp loggor/*.png prod_repo/loggor/
          cp sno.js snojour.html snozoner.html snohinder.html vader.html vader.js theme.css theme.js planering.html offerter.html ekonomi.html linjer.js radar.html prod_repo/

      - name: Höj appversionen så att telefonerna hämtar den nya versionen
        run: |
          sed -i "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'lpv-prod-${{ github.run_number }}-$(date +%Y%m%d%H%M)';/" prod_repo/sw.js
          grep -n "CACHE_NAME =" prod_repo/sw.js

      - name: Skicka ändringarna till produktion
        run: |
          cd prod_repo
          git config user.name "JAS 39 Deploy Bot"
          git config user.email "deploy@tidrapport.local"
          git add app.js style.css index.html sw.js sms.html avatar_onboarding.js install.js stalltvatt.js egenkontroll.js loggor sno.js snojour.html snozoner.html snohinder.html vader.html vader.js theme.css theme.js planering.html offerter.html ekonomi.html linjer.js radar.html
          
          if git diff --staged --quiet; then
            echo "Inga ändringar hittades, avbryter."
          else
            git commit -m "🚀 Auto-deploy: Uppdaterad app, struktur och design från Dev"
            git push https://x-access-token:${{ secrets.PROD_DEPLOY_TOKEN }}@github.com/Lellel/Tidsrapportering-och-annat-LPV.git main
          fi
