name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta Dev-koden
        uses: actions/checkout@v4

      - name: Klona produktionsrepot
        run: |
          git clone https://${{ secrets.DEPLOY_TOKEN }}@github.com/lellel/Tidsrapportering-och-annat-LPV.git prod_repo

      - name: Kopiera över logik och design
        run: |
          cp app.js prod_repo/
          cp style.css prod_repo/

      - name: Skicka ändringarna till produktion
        run: |
          cd prod_repo
          git config user.name "JAS 39 Deploy Bot"
          git config user.email "deploy@tidrapport.local"
          git add app.js style.css
          
          if git diff --staged --quiet; then
            echo "Inga ändringar hittades, avbryter."
          else
            git commit -m "🚀 Auto-deploy: Uppdaterad logik och design från Dev"
            git push
          fi
